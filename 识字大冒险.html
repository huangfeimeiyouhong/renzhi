<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF6EC">

<title>识字大冒险</title>
<!-- ===== BLOCK: CSS-TOKENS ===== -->
<style>
/* ===== BLOCK: CSS-TOKENS ===== */
/* 来源：美术规格 §11 变量总表（逐字粘贴）
         + 美术 §21.1 v2 追加（含 §14.2 三档绿 / §14.4 暗区修正）
         + GDD §11.7 新增令牌
   冲突处理：--tap-min 取 GDD §11.1 的 64px（覆盖美术 §11 的 56px，取更严者）
             --pet4 取 GDD §5.2 v1.1 修正值 #7C5CFF（与 Lv3 同族）            */
:root{
  /* ========== 1. 中性色 ========== */
  --c-bg:            #FFF6EC;
  --c-bg-sky-top:    #BFE7FA;
  --c-bg-sky-mid:    #DCF1F7;
  --c-bg-sky-bot:    #FFE9CF;
  --c-surface:       #FFFBF5;
  --c-surface-2:     #FFF1E0;
  --c-surface-sunken:#F7EFE3;
  --c-ink:           #4A3B2F;
  --c-ink-2:         #7A6555;
  --c-ink-3:         #9C8878;
  --c-line:          #E8D5BE;
  --c-line-2:        #D9C6AE;
  --c-track:         #F0E2D0;
  --c-hanzi:         #3B2A1E;
  --c-disabled-bg:   #F0E9E0;
  --c-shadow-rgb:    90,60,40;

  /* ========== 2. 主色 · 珊瑚橙 ========== */
  --c-pri-l:  #FFE6D5;
  --c-pri:    #E86F33;
  --c-pri-hi: #FFA05E;
  --c-pri-d:  #B4460F;

  /* ========== 3. 辅助色 L / M / D ========== */
  --c-sky-l:  #DFF2FB;  --c-sky:  #2E90C4;  --c-sky-d:  #17608A;
  --c-mint-l: #DDF5E9;  --c-mint: #2FA373;  --c-mint-d: #1A7A54;
  --c-lav-l:  #EBE3FB;  --c-lav:  #7F5FC4;  --c-lav-d:  #5A3D9E;
  --c-peach-l:#FFE1E9;  --c-peach:#E86A8C;  --c-peach-d:#B93A62;

  /* ========== 4. 语义色 ========== */
  --c-ok-l:   #DDF5E9;  --c-ok:   #2FA373;  --c-ok-d:   #1A7A54;
  --c-err-l:  #FFE4DF;  --c-err:  #D24F3C;  --c-err-d:  #A82B1A;
  --c-warn-l: #FFF2CF;  --c-warn: #F2A93B;  --c-warn-d: #8A6100;
  --c-gold-l: #FFE9AE;  --c-gold: #F2C14E;  --c-gold-d: #B87400;
  --c-star-on:  #FFC94D;  --c-star-off: #D9C6AE;
  --c-star-line:#B87400;  --c-star-off-line:#A88B68;
  --c-lock-bg:  #E7ECF0;  --c-lock-2: #C3CDD6;  --c-lock-ic: #5E6E7C;

  /* ========== 5. 场景 / 岛屿 / 宠物 ========== */
  --c-grass:     #8ED46E;  --c-grass-line: #377020;
  --c-soil-1:    #D9A76C;  --c-soil-2: #B07C46;  --c-soil-line: #8A5A2B;
  --c-road:      #C79A63;  --c-road-in: #F2D8AE;
  --c-wood-1:    #D89A57;  --c-wood-2: #B4762F;  --c-wood-band: #C98A45;
  --c-fur-1:     #F0A978;  --c-fur-2: #DE8551;   --c-fur-line: #B0613A;
  --c-cream:     #FFF1E0;  --c-eye:  #3B2A22;    --c-paw: #5C4132;
  --c-paw-line:  #3F2C21;  --c-blush:#FF9AA6;    --c-tear:#7FD4F5;

  /* ========== 6. 字体 ========== */
  --font-sans:  -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
                "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --font-hanzi: "Kaiti SC", "STKaiti", "KaiTi", "Kaiti TC", "BiauKai",
                "PingFang SC", "Songti SC", serif;
  --font-latin: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  --fs-scale:   1;   /* 家长面板「大字号模式」乘数：1 / 1.15 / 1.3 */

  --fs-hanzi-hero: clamp(120px, 34vw, 200px);
  --fs-hanzi-card: clamp(64px, 17vw, 88px);
  --fs-hanzi-opt:  clamp(30px, 8vw, 38px);
  --fs-hanzi-chip: 32px;
  --fs-hanzi-grid: 40px;
  --fs-h1: 26px;  --fs-h2: 21px;  --fs-h3: 18px;
  --fs-btn: 19px;
  --fs-body: 17px;  --fs-pinyin: 18px;  --fs-cap: 15px;  --fs-mini: 13px;
  --lh-tight: 1.25;  --lh-base: 1.65;

  /* ========== 7. 圆角 ========== */
  --r-xs: 8px;  --r-sm: 12px;  --r-md: 16px;
  --r-lg: 22px; --r-xl: 28px;  --r-pill: 999px;

  /* ========== 8. 阴影（微立体） ========== */
  --sh-1: 0 2px 0 rgba(90,60,40,.05), 0 6px 14px rgba(90,60,40,.10);
  --sh-2: 0 4px 0 rgba(90,60,40,.05), 0 10px 24px rgba(90,60,40,.14);
  --sh-3: 0 6px 0 rgba(90,60,40,.06), 0 16px 36px rgba(90,60,40,.18);
  --sh-modal: 0 24px 60px rgba(60,40,25,.32);
  --btn-edge: #B4460F;
  --sh-btn:      0 5px 0 var(--btn-edge), 0 10px 20px rgba(90,60,40,.22);
  --sh-btn-down: 0 1px 0 var(--btn-edge), 0 3px 8px  rgba(90,60,40,.20);
  --sh-inset: inset 0 2px 5px rgba(140,100,60,.14);

  /* ========== 9. 描边 ========== */
  --bw: 2.5px;
  --bw-ui: 3px;
  --bw-btn-2: 3px;
  --bw-hanzi: 8px;

  /* ========== 10. 间距 / 触控 ========== */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-safe: 12px;
  --tap-min: 64px;      /* GDD §11.1；覆盖美术 §11 的 56px，取更严者 */
  --tap-comfort: 72px;
  --tap-hanzi-opt: min(88px, 22vw);

  /* ========== 11. 动效 ========== */
  --dur-tap: 120ms;  --dur-std: 240ms;  --dur-emp: 400ms;  --dur-show: 800ms;
  --ease-tap:  cubic-bezier(.34,1.56,.64,1);
  --ease-std:  cubic-bezier(.4,0,.2,1);
  --ease-emp:  cubic-bezier(.16,1,.3,1);
  --ease-show: cubic-bezier(.22,1.2,.36,1);
  --ease-soft: cubic-bezier(.45,0,.55,1);

  /* ========== 12. 按钮复合 ========== */
  --btn-pri-bg: linear-gradient(180deg, #FFA05E 0%, #E86F33 100%);

  /* ========== 13. 层级 ========== */
  --z-map: 1; --z-pet: 20; --z-dock: 50; --z-overlay: 100; --z-toast: 200;

  /* ================================================================
     美术 §21.1 · v2 追加令牌
     ================================================================ */
  /* §14.2 修正：答对绿拆三档（原 --ok 单值当描边 2.61:1 / 当文字 2.43:1 均不达标） */
  --ok:      #2BB673;   /* 仅大块填充，禁止承载文字 */
  --ok-line: #157F4B;   /* 描边/边框 5.04:1 */
  --ok-d:    #0F6B3E;   /* 文字 6.58:1 */
  --err:     #FF5252;   /* 大块填充 3.19:1 */
  --err-d:   #C62828;   /* 文字 5.62:1 */

  /* §16 地图 4 区 */
  --z0-sky-a:#BFE9FF; --z0-sky-b:#E8F7D4; --z0-land:#7CC576; --z0-acc:#FFB86B;
  --z1-sky-a:#FFE3C2; --z1-sky-b:#FFD9EC; --z1-land:#FFB86B; --z1-acc:#FF8FB1;
  --z2-sky-a:#D6E4FF; --z2-sky-b:#F0E6FF; --z2-land:#A9C8FF; --z2-acc:#C9B6FF;
  --z3-sky-a:#2E2A5E; --z3-sky-b:#5B4B9E; --z3-land:#6C5CE7; --z3-acc:#FFD86B;

  /* §14.4 修正：暗区（四区）整套前景色切换 */
  --line:           #3B2A1E;  /* 区 0-2 描边 */
  --line-dark:      #E8E3FF;  /* 区 3 描边 3.90:1（深字仅 2.81:1，四区禁用） */
  --star-out:       #3B2A1E;  /* 金色元素贴纸外描边（区 0-2） */
  --star-out-dark:  #FFFFFF;  /* 区 3 */

  /* §17 节点 */
  --node-r:       34px;
  --node-r-boss:  44px;
  --node-hit-r:   48px;   /* §14.3：触控半径 ≠ 视觉半径，360px 屏 → 86px */
  --node-gap-y:  104px;

  /* §18 货币 */
  --c-star:  #FFC93C;  --c-star-line:  #B87400;
  --c-star-off:#D9C6AE;--c-star-off-line:#8A7148;
  --c-fruit: #FF6B5B;  --c-fruit-line: #C43324;
  --c-shard: #9B6DFF;
  --c-key:   #FFC93C;

  /* §19 宝箱 / 奖券 */
  --chest-n-line:#6B4420; --chest-r-line:#2C1B78; --chest-s-line:#A56600;
  --ticket-bg-a:#FFFDF3;  --ticket-bg-b:#FFF3D0;
  --ticket-txt:#3B2A1E;   --ticket-code:#8A5A2B;
  --ticket-head:#A56600;  --ticket-date:#7D6647;
  --notch-bg:#FFF7ED;

  /* §20 特效 */
  --fx-1:#E23C74; --fx-2:#FFC93C; --fx-3:#3DA5E0;
  --fx-4:#6FCB8F; --fx-5:#9B6DFF; --fx-6:#E5680F;

  /* ================================================================
     GDD §11.7 新增设计令牌（与美术令牌并存，供 P1–P3 直接引用）
     ================================================================ */
  --star:#FFC93C;
  --energy:#FF6B5B;
  --shard:#9B6DFF;
  --coupon:#FFD86B;
  --zone1:#7CC576;  --zone1-sky1:#BFE9FF; --zone1-sky2:#E8F7D4;
  --zone2:#FFB86B;  --zone2-sky1:#FFE3C2; --zone2-sky2:#FFD9EC;
  --zone3:#A9C8FF;  --zone3-sky1:#D6E4FF; --zone3-sky2:#F0E6FF;
  --zone4:#6C5CE7;  --zone4-sky1:#2E2A5E; --zone4-sky2:#5B4B9E;
  --pet1:#B9B4CC; --pet2:#A79BD6; --pet3:#9B6DFF; --pet4:#7C5CFF; --pet5:#5B3FE0;
  --locked:#C9C2B8;
  --safe-top:env(safe-area-inset-top);
  --safe-bot:env(safe-area-inset-bottom);

  /* 工程常量 */
  --hud-h: 56px;
  --tab-h: 72px;
}
/* ===== /BLOCK: CSS-TOKENS ===== */

/* ===================== 全局基础（美术 §11 尾部） ===================== */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0;
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: var(--font-sans);
  font-size: calc(var(--fs-body) * var(--fs-scale));
  line-height: var(--lh-base);
  overscroll-behavior-y: none;
}
/* 本版用 flex 100dvh 三段式布局（HUD / 主区 / Tab），底部安全区由 #tabbar 承担，
   故覆盖美术 §11 的 body padding-bottom，避免与 tabbar 高度叠加。 */
body{ padding-bottom:0; height:100dvh; overflow:hidden; }
button{ font-family:inherit; font-size:inherit; color:inherit; }
[hidden]{ display:none !important; }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* 焦点可见（美术 §10.5） */
:focus-visible{ outline:4px solid var(--c-sky); outline-offset:3px; }

/* ===================== 应用外壳 ===================== */
#app{
  height:100dvh; display:flex; flex-direction:column;
  background:var(--c-bg); overflow:hidden;
}
#pages{ position:relative; flex:1 1 auto; min-height:0; }
.page{ position:absolute; inset:0; display:none; }
.page.on{ display:block; }

/* ===================== HUD（顶部资源条） ===================== */
.hud{
  position:relative; z-index:var(--z-dock);
  flex:0 0 auto;
  display:flex; align-items:center; gap:var(--sp-2);
  min-height:var(--hud-h);
  padding: calc(var(--sp-2) + var(--safe-top)) var(--sp-3) var(--sp-2);
  background:linear-gradient(180deg,#FFFDF8 0%,#FFF6EC 100%);
  border-bottom:var(--bw-ui) solid var(--c-line);
  box-shadow:var(--sh-1);
}
.hud-curs{ display:flex; align-items:center; gap:var(--sp-2); flex:1 1 auto; min-width:0; }
.cur{
  display:inline-flex; align-items:center; gap:5px;
  height:40px; padding:0 12px 0 8px;
  background:var(--c-surface); border:2.5px solid var(--c-line);
  border-radius:var(--r-pill);
  font-size:var(--fs-cap); font-weight:800; color:var(--c-ink);
  box-shadow:0 2px 0 rgba(var(--c-shadow-rgb),.10);
}
.cur svg{ display:block; flex:0 0 auto; }
.cur-n{ font-variant-numeric:tabular-nums; }
.cur-sub{ font-size:var(--fs-mini); font-weight:700; color:var(--c-ink-2); }
/* 家长入口：视觉 40×40，热区扩到 64×64（GDD §11.1 触控下限 + 防儿童误触） */
.pbtn{
  position:relative; flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  display:grid; place-items:center;
  background:transparent; border:0; padding:0; cursor:pointer;
  -webkit-touch-callout:none; user-select:none;
}
.pbtn-face{
  width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center;
  background:var(--c-surface-2); border:2.5px solid var(--c-line);
  color:var(--c-pri-d); font-size:19px; line-height:1;
  box-shadow:0 2px 0 rgba(var(--c-shadow-rgb),.12);
  transition:transform var(--dur-tap) var(--ease-tap), background var(--dur-tap) linear;
}
.pbtn:active .pbtn-face{ transform:scale(.94); background:var(--c-pri-l); }
.pbtn-fill{
  position:absolute; left:12px; right:12px; bottom:8px; height:4px;
  border-radius:2px; background:var(--c-pri);
  transform:scaleX(0); transform-origin:left center; opacity:0;
}
.pbtn.pressing .pbtn-fill{ opacity:1; animation:pressfill 2s linear forwards; }
@keyframes pressfill{ from{transform:scaleX(0);} to{transform:scaleX(1);} }

/* ===================== 地图（美术 §16.7） ===================== */
.map-wrap{
  position:absolute; inset:0 0 0 0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  scroll-snap-type:y proximity;
  background:linear-gradient(180deg, #BFE9FF 0%, #E8F7D4 100%); /* 与青草岛天空渐变一致，避免顶部透明/滚出边界时露黑底 */
}
.map{ display:block; width:100%; height:auto; }
.node{ cursor:pointer; outline:none; }
.node .hit{ pointer-events:all; }
.node:focus-visible .disc{ stroke:#FFFFFF; stroke-width:5; }
.node.locked-shake{ animation:cardshake .42s ease-in-out both; }
@keyframes cardshake{
  0%,100%{ transform:translateX(0); }
  15%{ transform:translateX(-8px); } 35%{ transform:translateX(7px); }
  55%{ transform:translateX(-5px); } 75%{ transform:translateX(4px); }
}

/* ===================== 关卡节点 5 态（美术 §17.6） ===================== */
.node .disc{ transition:transform .18s ease, filter .2s ease; }
.node .numbg, .node .num{ pointer-events:none; }

/* --- 1) locked --- */
.n-locked{ filter:saturate(.25) brightness(.92); }
.n-locked .disc{ fill:#C9C2B8; }
.n-locked .numbg{ fill:#EDE8DD; stroke:#6B6455; }
.n-locked .num{ fill:#6B6455; }
.n-locked .lockcloud{
  transform-box:fill-box; transform-origin:center;
  animation:lockdrift 4s ease-in-out infinite;
}
.n-locked .lockcloud--2{ animation-delay:-1.3s; }
.n-locked .lockcloud--3{ animation-delay:-2.6s; }
@keyframes lockdrift{
  0%{transform:translateX(-16px);} 50%{transform:translateX(16px);} 100%{transform:translateX(-16px);}
}

/* --- 2) available / 3) inProgress --- */
.n-available .halo,
.n-inProgress .halo,
.n-available .halo--in,
.n-inProgress .halo--in{
  transform-box:view-box; transform-origin:center;
  animation:nodehalo 1.4s ease-out infinite;
}
@keyframes nodehalo{
  0%{ transform:scale(1);     opacity:.6; }
  100%{ transform:scale(1.3); opacity:0;  }
}
/* 浮动只作用在 .disc —— 外层 <g> 带 transform 属性，动画不能挂它（美术 §15.5 / §17.6） */
.n-available .disc,
.n-inProgress .disc{
  transform-box:fill-box; transform-origin:center;
  animation:nodefloat 1.2s ease-in-out infinite;
}
@keyframes nodefloat{
  0%,100%{ transform:translateY(-5px); } 50%{ transform:translateY(5px); }
}
.n-available .flag,
.n-inProgress .flag{
  transform-box:fill-box; transform-origin:bottom left;
  animation:flagwave 1.6s ease-in-out infinite;
}
@keyframes flagwave{
  0%,100%{ transform:rotate(-8deg) scaleX(1); } 50%{ transform:rotate(6deg) scaleX(.88); }
}

/* --- 4) cleared：静止 --- */
.n-cleared .disc{ animation:none; }
.n-cleared .halo{ display:none; }
.n-cleared .stars .off{ opacity:.55; }

/* --- 5) perfect --- */
/* 美术 §17.7：禁用 drop-shadow（20 节点并发 SVG filter 掉帧），
   改用双层同心描边（宽而淡的外圈 + 窄而实的内圈），静态渲染无性能损耗 */
.n-perfect .perfectring{ filter:none; }
.n-perfect .disc{
  transform-box:fill-box; transform-origin:center;
  animation:perfectflash 3s ease-in-out infinite;
  /* 相位打散：每个节点用 --i 错开起始相位，避免 20 个金环同步闪（美术 §17.7 互质步长 137ms） */
  animation-delay:calc(var(--i) * -137ms);
}
@keyframes perfectflash{
  0%,86%,100%{ transform:scale(1); } 92%{ transform:scale(1.08); } 96%{ transform:scale(1.03); }
}
.n-perfect .crown{
  transform-box:fill-box; transform-origin:center;
  animation:crownbob 2.4s ease-in-out infinite;
  animation-delay:calc(var(--i) * -211ms);
}
@keyframes crownbob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }

/* --- Boss 星框 20s 匀速旋转 --- */
.n-boss .bossframe{
  transform-box:fill-box; transform-origin:center;
  animation:bossspin 20s linear infinite;
}
@keyframes bossspin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* ===================== 底部 Tab（≥72px 高，含安全区） ===================== */
.tabbar{
  flex:0 0 auto; z-index:var(--z-dock);
  display:flex; align-items:stretch;
  min-height:var(--tab-h);
  padding-bottom:var(--safe-bot);
  background:var(--c-surface);
  border-top:var(--bw-ui) solid var(--c-line);
  box-shadow:0 -4px 16px rgba(var(--c-shadow-rgb),.10);
}
.tab{
  flex:1 1 0; min-width:0; min-height:var(--tab-h);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:transparent; border:0; padding:6px 2px; cursor:pointer;
  color:var(--c-ink-2); font-size:var(--fs-mini); font-weight:800;
  transition:transform var(--dur-tap) var(--ease-tap), color var(--dur-tap) linear;
}
.tab:active{ transform:scale(.94); }
.tab svg{ display:block; }
.tab.on{ color:var(--c-pri-d); }
.tab.on .tab-ic{ background:var(--c-pri-l); }
.tab-ic{
  width:34px; height:34px; border-radius:50%;
  display:grid; place-items:center;
  background:transparent; transition:background var(--dur-tap) linear;
}

/* ===================== 通用页内占位 / 区块 ===================== */
.pane{ padding:var(--sp-4); }
.stub{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--sp-3); text-align:center;
  min-height:60vh; padding:var(--sp-5);
  color:var(--c-ink-2);
}
.stub-badge{
  width:88px; height:88px; border-radius:var(--r-lg);
  display:grid; place-items:center; font-size:40px;
  background:var(--c-surface-2); border:var(--bw-ui) solid var(--c-line);
  box-shadow:var(--sh-1);
}
.stub-t{ font-size:var(--fs-h3); font-weight:800; color:var(--c-ink); }
.stub-d{ font-size:var(--fs-cap); max-width:30ch; }
.stub-tag{
  font-size:var(--fs-mini); font-weight:800; color:var(--c-ink-2);
  background:var(--c-surface-sunken); border-radius:var(--r-pill);
  padding:4px 12px;
}

/* ===================== 按钮 ===================== */
.btn{
  min-height:56px; padding:0 var(--sp-5);
  display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2);
  border-radius:var(--r-pill); border:0; cursor:pointer;
  font-size:var(--fs-btn); font-weight:800; color:#FFFFFF;
  background:var(--btn-pri-bg); box-shadow:var(--sh-btn);
  transition:transform var(--dur-tap) var(--ease-tap);
}
.btn:active{ transform:translateY(3px); box-shadow:var(--sh-btn-down); }
.btn-sec{
  color:var(--c-ink); background:var(--c-surface);
  border:var(--bw-btn-2) solid var(--c-line-2); box-shadow:0 3px 0 var(--c-line-2);
}
.btn-sec:active{ box-shadow:0 1px 0 var(--c-line-2); }
.btn[aria-pressed="false"]{ color:var(--c-ink-3); background:var(--c-disabled-bg);
  border:var(--bw-btn-2) solid var(--c-line); box-shadow:none; }
.seg{ display:flex; gap:var(--sp-2); flex-wrap:wrap; }

/* ===================== 家长中心面板 ===================== */
.scrim{
  position:fixed; inset:0; z-index:var(--z-overlay);
  background:rgba(60,40,25,.42);
  display:none;
}
.scrim.on{ display:block; }
.panel{
  position:fixed; left:0; right:0; bottom:0; z-index:var(--z-overlay);
  max-height:86dvh; overflow-y:auto;
  padding:var(--sp-4) var(--sp-4) calc(var(--sp-5) + var(--safe-bot));
  background:var(--c-surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--sh-modal);
  transform:translateY(102%); transition:transform var(--dur-emp) var(--ease-emp);
}
.panel.on{ transform:translateY(0); }
.panel-hd{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-4); }
.panel-hd h2{ margin:0; font-size:var(--fs-h2); flex:1 1 auto; }
.panel-x{
  width:var(--tap-min); height:var(--tap-min); flex:0 0 auto;
  border-radius:50%; border:var(--bw-btn-2) solid var(--c-line-2);
  background:var(--c-surface-2); font-size:22px; cursor:pointer;
}
.panel-sec{ margin-bottom:var(--sp-5); }
.panel-sec > h3{
  margin:0 0 var(--sp-2); font-size:var(--fs-h3); color:var(--c-ink);
  border-bottom:2px solid var(--c-line); padding-bottom:6px;
}
.row{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-3); }
.row-lb{ flex:1 1 auto; font-size:var(--fs-body); font-weight:700; }
.hint{ font-size:var(--fs-mini); color:var(--c-ink-2); margin:0 0 var(--sp-3); }
.todo{
  font-size:var(--fs-mini); font-weight:800; color:var(--c-ink-2);
  background:var(--c-surface-sunken); border:2px dashed var(--c-line-2);
  border-radius:var(--r-sm); padding:var(--sp-3);
}

/* ===================== Toast ===================== */
.toast{
  position:fixed; left:50%; bottom:calc(var(--tab-h) + var(--safe-bot) + 16px);
  transform:translate(-50%, 12px);
  z-index:var(--z-toast);
  max-width:min(88vw, 420px);
  padding:12px 20px; border-radius:var(--r-pill);
  background:var(--c-ink); color:#FFF9F0;
  font-size:var(--fs-cap); font-weight:800; text-align:center;
  box-shadow:var(--sh-2);
  opacity:0; pointer-events:none;
  transition:opacity var(--dur-std) var(--ease-std), transform var(--dur-std) var(--ease-std);
}
.toast.on{ opacity:1; transform:translate(-50%, 0); }

/* ===================== 动效降级（美术 §20.6 / §10.3） =====================
   循环动画一律 animation:none，绝不用「把时长压到接近 0」的替代写法
   —— 后者会让 infinite 循环高频重绘，是光敏性风险。 */
@media (prefers-reduced-motion: reduce){
  .n-locked .lockcloud,
  .n-available .halo, .n-inProgress .halo,
  .n-available .halo--in, .n-inProgress .halo--in,
  .n-available .disc, .n-inProgress .disc,
  .n-available .flag, .n-inProgress .flag,
  .n-perfect .disc, .n-perfect .crown,
  .n-boss .bossframe,
  .pbtn.pressing .pbtn-fill{
    animation:none !important;
  }
  /* 长按进度改用描边提示，不依赖动画传达（美术 §10.3「不依赖动画单独传达信息」） */
  .pbtn.pressing .pbtn-face{ outline:3px solid var(--c-sky); outline-offset:2px; }
  *{ transition-duration:.01ms !important; }
  /* P5：每日挑战弹层 / 能量果飞行 / HUD 弹跳 降级（循环/强动效一律 animation:none） */
  .lv-ask-card{ animation:none !important; }
  .fly-fruit{ animation:none !important; opacity:0 !important; }
  .cur-bump{ animation:none !important; }
}

/* ===================== 横屏 / 平板（美术 §10.6） ===================== */
@media (orientation: landscape) and (min-height: 420px){
  .map-wrap{ padding-bottom: 8px; }
}
@media (min-width: 1024px){
  .map{ max-width: 640px; margin: 0 auto; }
  .panel{ left:50%; right:auto; transform:translate(-50%,102%); width:min(640px,92vw); border-radius:var(--r-xl); }
  .panel.on{ transform:translate(-50%,0); }
}
/* ===== /BLOCK: CSS-TOKENS ===== */

/* ===== BLOCK: LEVEL-FLOW (P1) ===== */
/* 关卡全屏流水线（S1 学字 → S2 小游戏 ×2 → S3 小考 → S4 演出）。
   视觉沿用「棉花糖星球」令牌：珊瑚橙主色、奶白卡面、低饱和马卡龙；不引入新配色。 */
.level-overlay{
  position:fixed; inset:0; z-index:var(--z-overlay);
  display:none; flex-direction:column;
  background:linear-gradient(180deg, var(--c-bg-sky-top) 0%, var(--c-bg-sky-bot) 100%);
}
.level-overlay.on{ display:flex; }
.lv-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; justify-content:center; }
.lv-stage{ width:100%; max-width:680px; padding:calc(var(--sp-5) + var(--safe-top)) var(--sp-4) calc(var(--sp-6) + var(--safe-bot));
  display:flex; flex-direction:column; gap:var(--sp-4); }
.lv-hd{ display:flex; align-items:center; gap:var(--sp-3); }
.lv-x{ flex:0 0 auto; width:var(--tap-min); height:var(--tap-min); border-radius:50%;
  border:var(--bw-ui) solid var(--c-line); background:var(--c-surface); color:var(--c-ink);
  font-size:24px; line-height:1; cursor:pointer; }
.lv-x:active{ transform:scale(.94); }
.lv-hd-t{ flex:1 1 auto; text-align:center; font-size:var(--fs-h2); font-weight:800; color:var(--c-ink); }
.lv-hint{ flex:0 0 auto; min-height:var(--tap-min); padding:0 var(--sp-4); border-radius:var(--r-pill);
  border:var(--bw-ui) solid var(--c-warn); background:var(--c-warn-l); color:var(--c-warn-d); font-weight:800; cursor:pointer; }
.lv-hint:active{ transform:scale(.96); }
.lv-stim{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); padding:var(--sp-4);
  background:var(--c-surface); border-radius:var(--r-lg); box-shadow:var(--sh-2); }
.lv-stim.lv-pulse{ animation:lvpulse .7s ease; }
@keyframes lvpulse{ 0%{transform:scale(1);} 40%{transform:scale(1.05); box-shadow:0 0 0 6px var(--c-warn-l);} 100%{transform:scale(1);} }
.lv-hero{ font-family:var(--font-hanzi); font-size:var(--fs-hanzi-hero); color:var(--c-hanzi); line-height:1; }
.lv-pic{ width:min(58vw,240px); }
.lv-pic svg{ width:100%; height:auto; display:block; }
.lv-py{ font-size:var(--fs-hanzi-chip); color:var(--c-pri-d); font-weight:800; }
.lv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
.lv-opt{ min-height:88px; padding:var(--sp-3); border-radius:var(--r-lg); border:var(--bw-ui) solid var(--c-line);
  background:var(--c-surface); box-shadow:var(--sh-1); display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; cursor:pointer; transition:transform var(--dur-tap) var(--ease-tap); }
.lv-opt:active{ transform:scale(.96); }
.lv-opt.correct{ border-color:var(--ok-line); background:var(--c-ok-l); }
.lv-opt.correct-hint{ border-color:var(--ok-line); background:var(--c-ok-l); animation:lvpulse .8s ease; }
.lv-opt.wrong{ border-color:var(--err); background:var(--c-err-l); animation:lvshake .42s ease; }
.lv-opt.dim{ opacity:.4; }
.lv-ch{ font-family:var(--font-hanzi); font-size:var(--fs-hanzi-grid); color:var(--c-hanzi); line-height:1; }
.lv-py-lg{ font-size:var(--fs-hanzi-chip); color:var(--c-pri-d); font-weight:800; }
.lv-listen{ min-height:var(--tap-comfort); padding:0 var(--sp-5); border-radius:var(--r-pill);
  border:var(--bw-btn-2) solid var(--c-sky); background:var(--c-sky-l); color:var(--c-sky-d); font-weight:800; font-size:var(--fs-btn); cursor:pointer; }
.lv-listen:active{ transform:scale(.96); }
.lv-big-play,.lv-small-play{ border:0; background:transparent; cursor:pointer; }
.lv-big-play{ font-size:64px; }
.lv-small-play{ font-size:30px; }
.lv-listen-lab{ font-size:var(--fs-cap); color:var(--c-ink-2); }
.lv-fb{ min-height:28px; text-align:center; font-size:var(--fs-h3); font-weight:800; color:var(--c-pri-d); }
.lv-btn{ min-height:var(--tap-comfort); padding:0 var(--sp-6); border-radius:var(--r-pill);
  border:var(--bw-btn-2) solid var(--btn-edge); background:var(--btn-pri-bg); color:#fff;
  font-weight:800; font-size:var(--fs-btn); box-shadow:var(--sh-btn); cursor:pointer; }
.lv-btn:active{ transform:translateY(3px); box-shadow:var(--sh-btn-down); }
.lv-btn-ghost{ background:var(--c-surface); color:var(--c-ink); border-color:var(--c-line); box-shadow:var(--sh-1); }
.lv-btn-sm{ min-height:48px; padding:0 var(--sp-4); font-size:var(--fs-body); }
.lv-s1card,.lv-s4{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-4);
  padding:var(--sp-5) var(--sp-4); background:var(--c-surface-2); border-radius:var(--r-xl); box-shadow:var(--sh-2); }
.lv-words{ display:flex; flex-wrap:wrap; gap:var(--sp-2); justify-content:center; }
.lv-word{ padding:6px 12px; border-radius:var(--r-pill); background:var(--c-surface); border:2px solid var(--c-line); font-size:var(--fs-body); color:var(--c-ink); cursor:pointer; touch-action:manipulation; }
.lv-stars{ display:flex; gap:var(--sp-3); justify-content:center; }
.lv-star{ display:inline-block; }
.lv-star.pop{ animation:lvstarpop .5s var(--ease-emp) both; }
.lv-star.pop:nth-child(2){ animation-delay:.12s; }
.lv-star.pop:nth-child(3){ animation-delay:.24s; }
@keyframes lvstarpop{ 0%{transform:translateY(-40px) rotate(-180deg) scale(.4); opacity:0;} 60%{transform:translateY(0) rotate(0) scale(1.25); opacity:1;} 100%{transform:scale(1);} }
.lv-reward{ display:flex; gap:var(--sp-3); justify-content:center; flex-wrap:wrap; }
.lv-reward-c{ padding:10px 16px; border-radius:var(--r-md); background:var(--c-surface); border:2px solid var(--c-line); font-weight:800; font-size:var(--fs-body); }
.lv-s4tip{ font-size:var(--fs-cap); color:var(--c-ink-2); text-align:center; }
.lv-learned{ display:flex; gap:var(--sp-2); flex-wrap:wrap; justify-content:center; }
.lv-chip{ width:56px; height:56px; border-radius:var(--r-md); border:2px solid var(--c-line); background:var(--c-surface);
  font-family:var(--font-hanzi); font-size:34px; color:var(--c-hanzi); cursor:pointer; }
.lv-chip:active{ transform:scale(.94); }
@keyframes lvshake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(4px);} }

/* ===================== P5 · 离开关卡二次确认弹层（GDD §9.5 第 2 条） ===================== */
.lv-ask{ position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center;
  background:rgba(60,40,25,.5); padding:var(--sp-4); }
.lv-ask-card{ background:var(--c-surface); border-radius:var(--r-xl); border:var(--bw-ui) solid var(--c-line);
  box-shadow:var(--sh-modal); padding:var(--sp-5); text-align:center; max-width:min(90vw,420px);
  animation:askIn .26s var(--ease-emp) both; }
@keyframes askIn{ from{ transform:scale(.86); opacity:0 } to{ transform:scale(1); opacity:1 } }
.lv-ask-face{ font-size:56px; line-height:1; margin-bottom:var(--sp-2); }
.lv-ask-t{ font-size:var(--fs-h1); font-weight:800; color:var(--c-ink); }
.lv-ask-sub{ font-size:var(--fs-cap); color:var(--c-ink-2); margin-top:var(--sp-2); }
.lv-ask-btns{ display:flex; gap:var(--sp-3); margin-top:var(--sp-5); }
.lv-ask-stay, .lv-ask-go{ min-height:88px; min-width:88px; flex:1; font-size:var(--fs-btn); font-weight:800;
  border-radius:var(--r-pill); cursor:pointer; border:var(--bw-btn-2) solid var(--c-line); }
.lv-ask-stay{ background:var(--c-pri); color:#fff; border-color:var(--btn-edge); }   /* 主按钮：实底白字 */
.lv-ask-go{ background:var(--c-surface); color:var(--c-ink); }                       /* 次级：浅底描边 */

/* ===================== P5 · 能量果微反馈飞行动画（GDD §8 / §7.5） ===================== */
.fly-fruit{ position:fixed; z-index:var(--z-toast); font-size:26px; line-height:1;
  transform:translate(-50%,-50%); pointer-events:none;
  animation:flyFruit .68s var(--ease-emp) forwards; }
@keyframes flyFruit{
  0%{   transform:translate(-50%,-50%) scale(.6); opacity:0; }
  18%{  transform:translate(-50%,-50%) scale(1.25); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.55); opacity:0; }
}
.cur-bump{ animation:curBump .34s var(--ease-emp); }
@keyframes curBump{ 0%,100%{transform:scale(1)} 45%{transform:scale(1.22)} }

/* ===== /BLOCK: LEVEL-FLOW ===== */

/* ===================== P2 · 宠物页（字灵「墨墨」） ===================== */
.pet-page{ height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:var(--sp-5) var(--sp-4) var(--sp-6); }
.pet-stage{
  position:relative; width:100%; max-width:300px; margin:0 auto;
  aspect-ratio:1/1; border-radius:var(--r-xl); overflow:hidden;
  border:var(--bw-ui) solid var(--c-line); box-shadow:var(--sh-2);
  background:var(--c-cream);
}
.pet-bg{ position:absolute; inset:0; width:100%; height:100%; }
.pet-slot{ position:absolute; inset:0; display:grid; place-items:center; }
.pet-slot .pet{ width:80%; height:80%; }
.pet-praise{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  background:rgba(255,255,255,.92); color:var(--c-pri-d);
  font-size:var(--fs-body); font-weight:800; padding:8px 16px; border-radius:var(--r-pill);
  border:2px solid var(--c-pri); box-shadow:var(--sh-1); white-space:nowrap;
  animation:petpraise .5s var(--ease-tap) both;
}
@keyframes petpraise{ 0%{ transform:translate(-50%,14px) scale(.7); opacity:0; } 60%{ transform:translate(-50%,-4px) scale(1.06); opacity:1; } 100%{ transform:translate(-50%,0) scale(1); } }

.pet-card{
  max-width:340px; margin:var(--sp-5) auto 0; padding:var(--sp-5);
  background:var(--c-surface-2); border-radius:var(--r-xl); box-shadow:var(--sh-2);
  display:flex; flex-direction:column; gap:var(--sp-4); align-items:center;
}
.pet-name{ font-size:var(--fs-h2); font-weight:800; color:var(--c-ink); display:flex; align-items:center; gap:10px; }
.pet-lv{ font-size:var(--fs-mini); font-weight:800; color:#fff; background:var(--c-lav); padding:4px 12px; border-radius:var(--r-pill); }
.pet-bar{ position:relative; width:100%; height:22px; border-radius:var(--r-pill); background:var(--c-track); overflow:hidden; border:2px solid var(--c-line); }
.pet-bar-fill{ height:100%; border-radius:var(--r-pill); background:linear-gradient(90deg,#B9B4CC,#7C5CFF); transition:width var(--dur-show) var(--ease-soft); }
.pet-bar-txt{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:var(--fs-mini); font-weight:800; color:var(--c-ink); text-shadow:0 1px 0 rgba(255,255,255,.6); }
.pet-stagetxt{ font-size:var(--fs-cap); color:var(--c-ink-2); }
.pet-btns{ display:flex; gap:var(--sp-3); width:100%; }
.pet-feed, .pet-stroke{
  flex:1; min-height:var(--tap-comfort); padding:0 var(--sp-4); border-radius:var(--r-pill);
  font-size:var(--fs-btn); font-weight:800; cursor:pointer; border:var(--bw-btn-2) solid var(--btn-edge);
  background:var(--btn-pri-bg); color:#fff; box-shadow:var(--sh-btn); transition:transform var(--dur-tap) var(--ease-tap);
}
.pet-feed small{ font-weight:700; opacity:.9; }
.pet-stroke{ flex:0 0 auto; background:var(--c-surface); color:var(--c-ink); border-color:var(--c-line); box-shadow:var(--sh-1); }
.pet-feed:active, .pet-stroke:active{ transform:translateY(3px); box-shadow:var(--sh-btn-down); }
.pet-hint{ font-size:var(--fs-mini); color:var(--c-ink-3); }

/* ---- P4 · 装扮商店 ---- */
.pet-dress{
  flex:0 0 auto; min-height:var(--tap-comfort); padding:0 var(--sp-4); border-radius:var(--r-pill);
  font-size:var(--fs-btn); font-weight:800; cursor:pointer; border:var(--bw-btn-2) solid var(--btn-edge);
  background:var(--c-lav); color:#fff; box-shadow:var(--sh-btn); transition:transform var(--dur-tap) var(--ease-tap);
}
.pet-dress:active{ transform:translateY(3px); box-shadow:var(--sh-btn-down); }
.pet-costume{
  max-width:340px; margin:var(--sp-5) auto 0; padding:var(--sp-4);
  background:var(--c-surface-2); border-radius:var(--r-xl); box-shadow:var(--sh-2);
  display:flex; flex-direction:column; gap:var(--sp-4);
}
.pc-head{ display:flex; align-items:center; justify-content:space-between; }
.pc-title{ font-size:var(--fs-h3); font-weight:800; color:var(--c-ink); }
.pc-star{ font-size:var(--fs-body); font-weight:800; color:var(--c-pri-d); background:var(--c-cream); padding:4px 12px; border-radius:var(--r-pill); border:2px solid var(--c-line); }
.pc-row{ display:flex; flex-direction:column; gap:8px; }
.pc-label{ font-size:var(--fs-cap); font-weight:800; color:var(--c-ink-2); }
.pc-grid{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
.pc-card{
  flex:0 0 auto; width:92px; padding:8px 6px; border-radius:var(--r-lg); border:2px solid var(--c-line);
  background:var(--c-surface); display:flex; flex-direction:column; align-items:center; gap:6px;
  cursor:pointer; box-shadow:var(--sh-1); transition:transform var(--dur-tap) var(--ease-tap); font-family:inherit;
}
.pc-card:active{ transform:translateY(2px); }
.pc-card.pc-on{ border-color:var(--c-pri); background:var(--c-lav-l); box-shadow:0 0 0 3px rgba(124,92,255,.25), var(--sh-1); }
.pc-card.pc-locked{ opacity:.6; cursor:default; }
.pc-prev{ position:relative; width:84px; height:84px; border-radius:var(--r-md); overflow:hidden; background:var(--c-cream); }
.pc-prev .pet{ width:100%; height:100%; }
.pc-prev .pet-bg{ width:100%; height:100%; }
.pc-lockmask{ position:absolute; inset:0; display:grid; place-items:center; font-size:30px; background:rgba(255,255,255,.35); }
.pc-name{ font-size:var(--fs-mini); font-weight:800; color:var(--c-ink); }
.pc-badge{ font-size:var(--fs-mini); font-weight:800; padding:3px 10px; border-radius:var(--r-pill); }
.pc-badge.pc-on{ color:#fff; background:var(--c-pri); }
.pc-badge.pc-wear{ color:var(--c-pri-d); background:var(--c-lav-l); border:2px solid var(--c-pri); }
.pc-badge.pc-buy{ color:var(--c-pri-d); background:var(--c-cream); border:2px solid var(--c-line); }
.pc-badge.pc-lock{ color:var(--c-ink-3); background:var(--c-track); }
.pc-confirm{ display:flex; gap:6px; }
.pc-no, .pc-yes{ flex:1; min-height:30px; border-radius:var(--r-pill); font-size:var(--fs-mini); font-weight:800; cursor:pointer; border:2px solid var(--c-line); }
.pc-no{ background:var(--c-surface); color:var(--c-ink-2); }
.pc-yes{ background:var(--c-pri); color:#fff; border-color:var(--btn-edge); }

/* ---- 宠物动效（美术 §15.6；循环动画全部可被 prefers-reduced-motion 关掉）---- */
.pk-body, .pk-egg{ transform-box:view-box; transform-origin:60px 120px; animation:pk-breathe 2600ms cubic-bezier(.45,0,.55,1) infinite; }
@keyframes pk-breathe{ 0%,100%{ transform:translateY(0) scaleY(1); } 50%{ transform:translateY(-2.5px) scaleY(1.022); } }
.pk-eyes{ transform-box:fill-box; transform-origin:center; animation:pk-blink 4200ms cubic-bezier(.45,0,.55,1) infinite; }
@keyframes pk-blink{ 0%,92%,100%{ transform:scaleY(1); } 95%{ transform:scaleY(.08); } 97%{ transform:scaleY(1); } }
.pk-halo{ transform-box:view-box; transform-origin:60px 30px; animation:pk-halo 6000ms linear infinite; }
@keyframes pk-halo{ to{ stroke-dashoffset:-104; } }
.pk-orbit{ transform-box:view-box; transform-origin:60px 86px; animation:pk-orbit 4000ms linear infinite; }
.pk-orbit-in{ transform-box:fill-box; transform-origin:center; animation:pk-orbit-in 4000ms linear infinite; }
@keyframes pk-orbit{ to{ transform:rotate(360deg); } }
@keyframes pk-orbit-in{ to{ transform:rotate(-360deg); } }
.pk-think{ animation:pk-pulse 1600ms ease-in-out infinite; }
@keyframes pk-pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }
.pk-zzz text{ animation:pk-zzz 2400ms ease-out infinite; }
.pk-zzz text:nth-child(2){ animation-delay:300ms; }
.pk-zzz text:nth-child(3){ animation-delay:600ms; }
@keyframes pk-zzz{ 0%{ opacity:0; transform:translate(0,6px); } 40%{ opacity:1; } 100%{ opacity:0; transform:translate(6px,-14px); } }
.pk-spark{ transform-box:fill-box; transform-origin:center; animation:pk-spark 700ms cubic-bezier(.16,1,.3,1) infinite; }
@keyframes pk-spark{ 0%{ transform:translate(0,0) scale(.3); opacity:0; } 25%{ opacity:1; } 100%{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; } }
.pet[data-mood="excited"] .pk-all{ transform-box:view-box; transform-origin:60px 124px; animation:pk-hop .8s cubic-bezier(.34,1.56,.64,1) infinite; }
@keyframes pk-hop{ 0%,100%{ transform:translateY(0); } 25%{ transform:translateY(-14px); } 50%{ transform:translateY(0); } 75%{ transform:translateY(-6px); } }
.pk-hat, .pk-scarf, .pk-wing, .pk-crown{ animation:pk-wear 200ms ease-out; }
@keyframes pk-wear{ from{ opacity:0; transform:scale(.8); } to{ opacity:1; transform:scale(1); } }
@media (prefers-reduced-motion: reduce){
  .pk-body,.pk-egg,.pk-eyes,.pk-halo,.pk-orbit,.pk-orbit-in,.pk-think,.pk-zzz text,.pk-spark,.pet[data-mood="excited"] .pk-all,.pk-hat,.pk-scarf,.pk-wing,.pk-crown{ animation:none !important; }
  .pk-spark{ display:none; }
}

/* ===================== P2 · 汉字图鉴 ===================== */
.dex{ height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:var(--sp-5) var(--sp-4) var(--sp-6); }
.dex-hd{ position:sticky; top:0; z-index:2; background:var(--c-surface); border-radius:var(--r-lg);
  padding:var(--sp-4) var(--sp-5); margin-bottom:var(--sp-5); box-shadow:var(--sh-1);
  display:flex; flex-direction:column; gap:6px; }
.dex-hd-t{ font-size:var(--fs-h2); font-weight:800; color:var(--c-ink); }
.dex-total{ font-size:var(--fs-body); color:var(--c-ink-2); } .dex-total b{ color:var(--c-pri-d); font-size:var(--fs-h3); }
.dex-track{ height:12px; border-radius:var(--r-pill); background:var(--c-track); overflow:hidden; border:2px solid var(--c-line); }
.dex-track-fill{ height:100%; background:linear-gradient(90deg,#FFC93C,#E86F33); transition:width var(--dur-show) var(--ease-soft); }
.dex-zone{ margin-bottom:var(--sp-6); }
.dex-zone-t{ font-size:var(--fs-h3); font-weight:800; color:var(--c-lav-d); margin:0 0 var(--sp-3); }
.dex-lv{ margin-bottom:var(--sp-4); }
.dex-lv-t{ font-size:var(--fs-cap); font-weight:800; color:var(--c-ink-2); margin-bottom:8px; }
.dex-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.dex-cell{ position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:10px 4px; border-radius:var(--r-md); background:var(--c-surface-2);
  border:2px solid var(--c-line); box-shadow:var(--sh-1); }
.dex-cell .dex-pic{ width:100%; display:flex; justify-content:center; }
.dex-cell .dex-pic svg{ width:100%; max-width:52px; height:auto; }
.dex-cell .dex-c{ font-family:var(--font-hanzi); font-size:30px; color:var(--c-hanzi); line-height:1; }
.dex-cell .dex-py{ font-size:var(--fs-mini); color:var(--c-ink-3); }
.dex-cell.known{ background:var(--c-ok-l); border-color:var(--ok-line); }
.dex-cell.known .dex-c{ color:var(--c-ink); }
.dex-cell.todo{ opacity:.92; }
.dex-cell.locked{ background:var(--c-lock-bg); border-color:var(--c-lock-2); }
.dex-cell.locked .dex-pic, .dex-cell.locked .dex-c, .dex-cell.locked .dex-py{ filter:grayscale(1); opacity:.45; }
.dex-badge{ position:absolute; top:4px; right:5px; font-size:13px; font-weight:800; line-height:1; }
.dex-badge.ok{ color:var(--c-ok-d); }
.dex-badge.lock{ font-size:12px; }
.dex-badge.todo{ color:var(--c-ink-3); }


/* ===================== P3 · 小游戏 G3/G4/G5 ===================== */
.g3-target{ display:flex; flex-direction:column; align-items:center; gap:6px; margin:10px 0 4px; }
.g3-pic{ cursor:pointer; }
.g3-tchar{ font-family:var(--font-hanzi); font-size:72px; line-height:1; color:var(--c-hanzi); cursor:pointer; }
.g3-lab{ font-size:var(--fs-cap); font-weight:700; color:var(--c-ink-2); }
/* 真·地鼠洞：6 个洞固定，字以"地鼠"形式从洞里冒出/缩回 */
.g3-holes{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; justify-items:center; margin:22px auto; max-width:340px; }
.g3-hole{ position:relative; width:92px; height:92px; border:none; background:transparent; padding:0; cursor:pointer; outline:none; }
.g3-hole .g3-mound{ position:absolute; left:50%; bottom:4px; transform:translateX(-50%); width:70px; height:22px; border-radius:50%; background:#CDBEA6; box-shadow:inset 0 3px 6px rgba(0,0,0,.18); pointer-events:none; }
.g3-hole .g3-mole{ position:absolute; left:50%; bottom:8px; transform:translateX(-50%) translateY(44px) scale(.25); width:72px; height:72px; border-radius:22px; background:var(--c-surface); border:3px solid var(--c-line); box-shadow:var(--sh-1); display:flex; align-items:center; justify-content:center; font-family:var(--font-hanzi); font-size:42px; color:var(--c-hanzi); opacity:0; pointer-events:none; }
.g3-hole.g3-up .g3-mole{ animation:g3pop .34s cubic-bezier(.175,.885,.32,1.275) forwards; }
.g3-hole.g3-down .g3-mole{ animation:g3down .22s ease-in forwards; }
.g3-hole.g3-hit .g3-mole{ animation:g3hit .32s ease forwards; }
.g3-hole.g3-wrong .g3-mole{ animation:lvshake .42s ease; }
@keyframes g3pop{ 0%{ transform:translateX(-50%) translateY(44px) scale(.25); opacity:0; } 70%{ transform:translateX(-50%) translateY(-10px) scale(1.08); opacity:1; } 100%{ transform:translateX(-50%) translateY(0) scale(1); opacity:1; } }
@keyframes g3down{ to{ transform:translateX(-50%) translateY(44px) scale(.25); opacity:0; } }
@keyframes g3hit{ 0%{ transform:translateX(-50%) translateY(0) scale(1); opacity:1; } 50%{ transform:translateX(-50%) translateY(-20px) scale(1.2); opacity:1; } 100%{ transform:translateX(-50%) translateY(44px) scale(.25); opacity:0; } }
.g3-bar{ height:14px; background:var(--c-track); border-radius:99px; overflow:hidden; margin:6px 8px 0; }
.g3-fill{ height:100%; width:100%; background:var(--c-ok); transition:width .12s linear; }
.g3-fill.g3-warn{ background:var(--c-warn); }
.g3-fill.g3-danger{ background:var(--c-err); }

.g4-grid{ display:grid; gap:10px; margin:14px auto; max-width:440px; }
.g4-cell{ aspect-ratio:1; min-height:64px; border-radius:16px; border:3px solid var(--c-line); background:var(--c-surface-2);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-hanzi); font-size:40px; color:var(--c-hanzi); cursor:pointer; position:relative; }
.g4-cell.path{ background:var(--c-cream); border-color:var(--c-road); }
.g4-cell.cur{ box-shadow:0 0 0 4px var(--c-ok); animation:g4pulse 1.2s infinite; }
.g4-cell.hint{ box-shadow:0 0 0 6px var(--c-gold); animation:g4hint 1s infinite; }
.g4-cell.g4-shake{ animation:lvshake .42s ease; }
/* 起点/终点用小徽章，不再遮挡汉字（否则孩子看不到目标字） */
.g4-badge{ position:absolute; top:-8px; right:-8px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; background:var(--c-surface); border:2px solid var(--c-road); border-radius:50%; font-size:14px; box-shadow:var(--sh-1); pointer-events:none; }
/* 当前这一步的目标格：橙色高亮，永远与被点中的格子相邻（不再钉在终点误导） */
.g4-badge.tgt{ background:var(--c-pri); border-color:var(--c-pri-d); color:#fff; }
.g4-lab{ text-align:center; font-size:var(--fs-h3); font-weight:800; color:var(--c-ink); }
.g4-tgt{ color:var(--c-pri-d); }
@keyframes g4pulse{ 0%,100%{box-shadow:0 0 0 4px var(--c-ok)} 50%{box-shadow:0 0 0 9px var(--c-ok-l)} }
@keyframes g4hint{ 0%,100%{box-shadow:0 0 0 4px var(--c-gold)} 50%{box-shadow:0 0 0 12px rgba(242,193,78,.25)} }

.g5-top{ display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 0; }
.g5-left{ display:flex; flex-direction:column; align-items:center; cursor:pointer; }
.g5-tc{ font-size:56px; color:var(--c-hanzi); }
.g5-mid{ flex:0 0 60px; height:4px; background:repeating-linear-gradient(90deg,var(--c-line) 0 8px,transparent 8px 16px); }
.g5-right{ width:90px; height:90px; border-radius:16px; border:3px dashed var(--c-line); display:flex; align-items:center; justify-content:center; }
.g5-ph{ font-size:40px; color:var(--c-ink-3); }
.g5-cands{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:14px 0; }
.g5-cand{ width:84px; height:84px; border-radius:18px; border:3px solid var(--c-line); background:var(--c-surface);
  box-shadow:var(--sh-1); display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-family:var(--font-hanzi); font-size:44px; color:var(--c-hanzi); }
.g5-cand.picked{ border-color:var(--c-ok); background:var(--c-ok-l); animation:g3hit .3s ease; }
.g5-cand.gone{ opacity:.4; background:var(--c-disabled-bg); cursor:default; }
.g5-lab, .g5-fb{ text-align:center; }
.g5-fb{ min-height:24px; font-weight:800; color:var(--c-pri-d); }

/* ===================== P6 · G2 字图配对（记忆翻牌） ===================== */
.g2-lab{ text-align:center; font-size:var(--fs-h3); font-weight:800; color:var(--c-ink); margin:4px 10px 2px; }
.g2-grid{ display:grid; gap:10px; margin:14px auto; max-width:440px; justify-items:stretch; }
.g2-card{ width:100%; aspect-ratio:1; perspective:620px; border:none; background:transparent; padding:0; cursor:pointer; outline:none; }
.g2-inner{ position:relative; width:100%; height:100%; transition:transform .28s ease-out; transform-style:preserve-3d; }
.g2-card.flipped .g2-inner{ transform:rotateY(180deg); }
.g2-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px; display:flex; align-items:center; justify-content:center; }
.g2-back{ background:linear-gradient(135deg,#9B6DFF,#6C8EF5); border:3px solid #FFFFFF; box-shadow:var(--sh-1); }
.g2-back .g2-q{ font-size:34px; font-weight:800; color:#FFFFFF; }
.g2-front{ background:var(--c-surface); border:3px solid var(--c-line); transform:rotateY(180deg); }
.g2-front.g2-char{ font-family:var(--font-hanzi); font-size:40px; font-weight:800; color:var(--c-hanzi); }
.g2-front.g2-pic svg{ width:72%; height:72%; }
.g2-card.matched .g2-inner{ transform:rotateY(180deg); animation:g2pop .45s ease; }
.g2-card.matched .g2-front{ border-color:var(--c-ok); background:var(--c-ok-l); }
.g2-card.matched{ cursor:default; }
.g2-card.mismatch .g2-front{ border-color:var(--c-err); }
.g2-card.mismatch{ animation:lvshake .3s ease; }
@keyframes g2pop{ 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
@media (prefers-reduced-motion: reduce){
  .g2-inner{ transition:none; }
  .g2-card.matched{ animation:none; }
  .g2-card.mismatch{ animation:none; }
}

/* ===================== P3 · 宝箱小屋 + 金色奖券 ===================== */
.chest-page{ padding:18px; }
.chest-hd{ font-size:var(--fs-h2); font-weight:800; text-align:center; color:var(--c-ink); }
.chest-keys{ display:flex; gap:12px; justify-content:center; margin:12px 0; }
.ck{ display:flex; align-items:center; gap:6px; background:var(--c-surface); border:2px solid var(--c-line);
  border-radius:99px; padding:6px 14px; font-weight:800; color:var(--c-ink); }
.chest-stage{ display:flex; flex-direction:column; align-items:center; gap:14px; margin:10px 0; }
.chest-open{ min-width:200px; }
.chest-tickets-hd{ text-align:center; font-weight:800; color:var(--c-ink); margin:14px 0 6px; }
.chest-tickets{ display:flex; flex-direction:column; gap:10px; }
.chest-empty{ text-align:center; color:var(--c-ink-3); }
.ticket-reveal{ display:flex; flex-direction:column; align-items:center; gap:10px; animation:tpop .5s cubic-bezier(.34,1.3,.5,1); }
@keyframes tpop{ 0%{transform:scale(.4); opacity:0} 100%{transform:scale(1); opacity:1} }

.pticket{ display:flex; align-items:center; gap:10px; background:var(--c-surface); border:2px solid var(--c-line);
  border-radius:14px; padding:8px 12px; }
.pt-name{ font-weight:800; color:var(--c-ink); flex:1 1 auto; }
.pt-code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; color:var(--c-ink-2); letter-spacing:1px; }

/* --- §19 宝箱 3 档（HTML + CSS 3D，来自美术规格.md §19.5） --- */
.chest3d{ position:relative; width:200px; height:190px; margin:0 auto; perspective:600px; perspective-origin:50% 34%;
  --c-b1:#D89A57; --c-b2:#B4762F; --c-band:#C98A45; --c-lock:#F2C14E; --c-line:#6B4420; }
.chest3d--rare { --c-b1:#9B6DFF; --c-b2:#6A45C4; --c-band:#B69EFF; --c-lock:#FFC93C; --c-line:#2C1B78; }
.chest3d--shiny{ --c-b1:#FFD86B; --c-b2:#E5A419; --c-band:#FFF0B8; --c-lock:#FF6B9D; --c-line:#A56600; }
.chest3d svg{ display:block; width:100%; height:100%; overflow:visible; }
.c-base{ position:absolute; left:0; right:0; bottom:0; height:112px; z-index:1; }
.c-lid{ position:absolute; left:0; right:0; bottom:104px; height:82px; z-index:3;
  transform-origin:bottom center; transform-style:preserve-3d; transform:rotateX(0deg);
  transition:transform .62s cubic-bezier(.34,1.3,.5,1); }
.c-prize{ position:absolute; left:50%; bottom:118px; width:120px; height:64px;
  transform:translateX(-50%) translateY(14px) scale(.8); opacity:0; z-index:2; display:grid; place-items:center;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1) .26s, opacity .34s ease .26s; font-size:20px; font-weight:800; color:#3B2A1E; }
.c-beam{ position:absolute; left:50%; bottom:96px; width:76px; height:0; transform:translateX(-50%); z-index:2;
  background:linear-gradient(to top, rgba(255,255,255,0), #FFE9A8 45%, rgba(255,255,255,0)); border-radius:38px 38px 0 0; opacity:0;
  transition:height .5s cubic-bezier(.2,.9,.3,1) .2s, opacity .3s ease .2s; }
.c-glow{ position:absolute; left:50%; top:52%; width:210px; height:210px; transform:translate(-50%,-50%) scale(.4); z-index:0;
  background:radial-gradient(circle, rgba(255,233,168,.85) 0%, rgba(255,233,168,0) 68%); opacity:0; transition:transform .6s ease, opacity .5s ease; }
.chest3d.is-open .c-lid  { transform:rotateX(-70deg); }
.chest3d.is-open .c-prize{ transform:translateX(-50%) translateY(-16px) scale(1); opacity:1; }
.chest3d.is-open .c-beam { height:160px; opacity:1; }
.chest3d.is-open .c-glow { transform:translate(-50%,-50%) scale(1); opacity:1; }
.chest3d.is-ready{ animation:chestbreathe 1.8s ease-in-out infinite; }
@keyframes chestbreathe{ 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-5px) scale(1.02);} }

/* --- §19.4 金色奖券 --- */
.ticket{ position:relative; width:300px; max-width:86vw; margin:14px auto; padding:16px 22px 18px;
  border:3px solid #FFC93C; border-radius:18px; background:linear-gradient(160deg,#FFFDF3 0%, #FFF3D0 100%);
  box-shadow:0 0 0 4px rgba(255,201,60,.18), 0 10px 24px rgba(180,116,0,.20), inset 0 0 22px rgba(255,233,168,.75);
  text-align:center; color:#3B2A1E; }
.ticket::before{ content:''; position:absolute; inset:7px; border:2px dashed rgba(184,116,0,.45); border-radius:12px; pointer-events:none; }
.t-notch{ position:absolute; top:50%; width:20px; height:20px; margin-top:-10px; background:#FFF7ED; border:3px solid #FFC93C; border-radius:50%; }
.t-notch--l{ left:-13px;  clip-path:inset(0 0 0 50%); }
.t-notch--r{ right:-13px; clip-path:inset(0 50% 0 0); }
.t-head{ font-size:13px; font-weight:800; letter-spacing:1px; color:#A56600; margin-bottom:6px; }
.t-ico { font-size:16px; margin-right:4px; }
.t-name{ font-size:22px; font-weight:800; line-height:1.3; margin-bottom:10px; }
.t-code{ display:inline-block; padding:6px 14px; border-radius:10px; background:#FFFDF3; border:2px dashed rgba(184,116,0,.55);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:16px; letter-spacing:2px; font-weight:700; color:#8A5A2B; user-select:all; }
.t-date{ margin-top:10px; font-size:12px; font-weight:700; color:#7D6647; }
.t-stamp{ position:absolute; right:14px; top:12px; padding:4px 10px; border-radius:8px; background:#E8E3D3; color:#6B6455; font-size:12px; font-weight:800; transform:rotate(-12deg); }
.ticket.is-redeemed{ filter:saturate(.5); opacity:.78; }
.ticket.is-redeemed .t-code{ text-decoration:line-through; }

  <main id="pages" data-nid="pages">

/* ============ 拼音发音（浏览器内置 TTS，零外链/离线可用） ============ */
var _zhVoice=null;
function _initVoices(){
  if(!('speechSynthesis' in window)) return;
  var vs=window.speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++){
    if(/zh|Chinese|普通话|Mandarin|Yue/i.test(vs[i].lang+" "+vs[i].name)){ _zhVoice=vs[i]; break; }
  }
}
function ttsOK(){ return ('speechSynthesis' in window); }
/* GDD §9.5 第 6 条：TTS 不可用时，听音类 G1 自动替换为 G2 字图配对（视觉），其余游戏照常。
   返回去重后最多 2 个不重复的小游戏类型；若替换后不足 2 个，从 G2/G3/G4/G5 补齐，避免卡死。 */
function ttsSafeGames(pair){
  if(ttsOK()) return pair.slice(0,2);
  var out = [];
  pair.forEach(function(t){
    var g = (t === 'G1') ? 'G2' : t;
    if(out.indexOf(g) < 0) out.push(g);
  });
  if(out.length < 2){
    var fb = ['G2','G3','G4','G5'];
    for(var i=0; i<fb.length && out.length<2; i++){ if(out.indexOf(fb[i]) < 0) out.push(fb[i]); }
  }
  return out.slice(0,2);
}
if(typeof window !== "undefined" && 'speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=_initVoices; _initVoices(); }
function spkSVG(){
  return '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
}
function speak(text){
  if(!ttsOK()||!text) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN"; u.rate=(text.length>1?0.62:0.85); u.pitch=1.05;
    if(_zhVoice) u.voice=_zhVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function isFieldError(e){

}
/* 写入：含 v2 独立字段失败 → 置 HAS_V2_FIELDS=false 并用不含 v2 的 props 重试一次 */
function cloudWrite(writeFn){

    if(HAS_V2_FIELDS && isFieldError(e)){

function loadCloud(){

    .then(function(res){

      else {
        cloudWrite(function(p){ return db.addRecord({databaseId:DATABASE_ID, properties:p}); })
          .then(function(r){ if(r) recordId = r.id || (r.record && r.record.id) || recordId; })
          .catch(function(e){ console.error("[sync] seed 失败", e); });
      }
    })

}
function syncSave(){
  save();
  if(!db) return;
  if(recordId){
    cloudWrite(function(p){ return db.updateRecord({databaseId:DATABASE_ID, recordId:recordId, properties:p}); });
  } else {
    db.query({databaseId:DATABASE_ID, filter:mainFilter()})
      .then(function(res){
        if(res.results && res.results.length){
          recordId = res.results[0]._id;
          return cloudWrite(function(p){ return db.updateRecord({databaseId:DATABASE_ID, recordId:recordId, properties:p}); });
        }
        return cloudWrite(function(p){ return db.addRecord({databaseId:DATABASE_ID, properties:p}); })
          .then(function(r){ if(r) recordId = r.id || (r.record && r.record.id) || recordId; });
      })
      .catch(function(e){ console.error("[sync] 保存失败", e); });
  }
}

/* 取孩子已掌握的前 n 个字（供 Lv5 环绕小字灵显示），无则回退默认字 */
function learnedCharsTop(n){
  n = n||5; var out=[], z, k, L, chs, j;
  for(z=0; z<4 && out.length<n; z++){
    for(k=0;k<5 && out.length<n;k++){
      L = state.game.levels["L"+(z*5+k+1)];
      if(L && L.cleared){ chs = levelChars(z*5+k); for(j=0;j<chs.length && out.length<n;j++) out.push(chs[j].c); }
    }
  }
  var fb = ["日","月","山","水","火","木","土","人","口","心"];
  while(out.length<n) out.push(fb[out.length]);
  return out;
}

/* 8 件合计 8+8+25+15+15+25+15+25 = 136⭐，与 GDD §4.3.1 经济闭环上限一致，不可上调。 */
var PET_COSTUME_LIST = [
  {id:'flower',  name:'小花帽',   slot:'hat',   price:8,  rarity:'normal'},
  {id:'leaf',    name:'树叶帽',   slot:'hat',   price:8,  rarity:'normal'},

  {id:'rainbow', name:'彩虹围巾', slot:'scarf', price:15, rarity:'rare'},
  {id:'star',    name:'星星围巾', slot:'scarf', price:15, rarity:'rare'},
  {id:'small',   name:'小翅膀',   slot:'wing',  price:25, rarity:'legend'},
  {id:'forest',  name:'森林背景', slot:'bg',    price:15, rarity:'rare'},
  {id:'space',   name:'星空背景', slot:'bg',    price:25, rarity:'legend'}  /* §5.5 逐项价=25（§4.4 的"背景=15"为稀有档归类笔误） */
];
var PET_COSTUME_SLOTS = [
  {slot:'hat',   label:'帽子'}, {slot:'scarf', label:'围巾'},
  {slot:'wing',  label:'翅膀'}, {slot:'bg',    label:'背景'}
];
function costumeMeta(id){ for(var i=0;i<PET_COSTUME_LIST.length;i++) if(PET_COSTUME_LIST[i].id===id) return PET_COSTUME_LIST[i]; return null; }
/* 等级门禁与 petSVG 渲染口径一致（帽/围巾 Lv2、翅膀 Lv3、背景任意），避免"买了戴不上" */
function costumeUnlockLv(slot){ return slot==='wing'?3:(slot==='hat'||slot==='scarf'?2:1); }
function costumeOwned(s,id){ return Array.isArray(s.pet.owned) && s.pet.owned.indexOf(id)>=0; }
function costumeEquipped(s,id){ var m=costumeMeta(id); return !!(m && s.pet.wears[m.slot]===id); }
function costumePreviewSVG(item, lv){
  if(item.slot==='bg') return petBgSVG(item.id);
  var wears={}; wears[item.slot]=item.id;
  var prevLv = Math.max(lv, costumeUnlockLv(item.slot));
  return petSVG({level:prevLv, mood:'happy', wears:wears, t:0, chars:learnedCharsTop(5)});
}
/* 纯逻辑：购买并自动装备（GDD §5.4 #3：未拥有→花⭐→二次确认→购入后自动装备） */
function buyCostume(s,id){
  var m=costumeMeta(id); if(!m) return {ok:false,reason:'noid'};
  if(costumeOwned(s,id)) return {ok:false,reason:'owned'};
  var lv=petStage(s.pet.bond)+1;
  if(lv < costumeUnlockLv(m.slot)) return {ok:false,reason:'locked'};
  if((s.stars||0) < m.price) return {ok:false,reason:'nostar'};
  s.stars -= m.price;
  if(!Array.isArray(s.pet.owned)) s.pet.owned=[];
  s.pet.owned.push(id);
  s.pet.wears[m.slot]=id;
  return {ok:true, id:id, slot:m.slot, name:m.name, price:m.price, stars:s.stars};
}
/* 纯逻辑：装备/脱下（点已装备→脱下；点已拥有→穿上；同槽自动替换） */
function equipCostume(s,id){
  var m=costumeMeta(id); if(!m) return {ok:false,reason:'noid'};
  var lv=petStage(s.pet.bond)+1;
  if(lv < costumeUnlockLv(m.slot)) return {ok:false,reason:'locked'};
  if(!costumeOwned(s,id)) return {ok:false,reason:'unowned'};
  var on = s.pet.wears[m.slot]===id;
  s.pet.wears[m.slot] = on ? null : id;
  return {ok:true, equipped:!on, slot:m.slot, name:m.name};
}

/* ---- 纯逻辑：喂食一次（不碰 DOM，便于单测）。用户 P2：每次消耗 1 🍎、+10 亲密度；GDD §5.4 每日上限 5 次 ---- */
function applyFeed(s){
  if(!s || !s.pet) return {ok:false, reason:"nopet"};
  if(s.pet.fedToday >= 5) return {ok:false, reason:"cap"};
  if((s.energy||0) < 1)  return {ok:false, reason:"noenergy"};
  var prev = petStage(s.pet.bond);
  s.energy -= 1;
  s.pet.bond += 10;
  s.pet.fedToday += 1;
  s.pet.level = bondToLevel(s.pet.bond);
  var now = petStage(s.pet.bond);
  return {ok:true, prevStage:prev, stage:now, leveledUp: now>prev, bond:s.pet.bond, energy:s.energy, name:PET_STAGES[now].name};
}
/* ---- 纯逻辑：抚摸一次（+1 亲密度，每日上限 10，GDD §5.4）---- */
function applyPetStroke(s){
  if(!s || !s.pet) return {ok:false, reason:"nopet"};
  if(s.pet.petToday >= 10) return {ok:false, reason:"cap"};
  var prev = petStage(s.pet.bond);
  s.pet.bond += 1;
  s.pet.petToday += 1;
  s.pet.level = bondToLevel(s.pet.bond);
  var now = petStage(s.pet.bond);
  return {ok:true, prevStage:prev, stage:now, leveledUp: now>prev, bond:s.pet.bond, name:PET_STAGES[now].name};
}

/* P2 · 图鉴（GDD §6）。分组：4 区 × 5 关 = 100 字。
   复用 CHAR_DICT / levelChars / ZONE_CFG / picSVG（不复制象形数据）。
   每字状态：known（关卡已通关=已学会）/ todo（已解锁未通关）/ locked（未解锁）。 */
function codexGroups(s){
  s = s || state;
  var groups = [], z, k, n, L, cleared, locked, chs, ch, cells, lv0;
  for(z=0; z<4; z++){
    var zone = { name: ZONE_CFG[z].name, levels:[] };
    for(k=0; k<5; k++){
      lv0 = z*5 + k; n = lv0+1;
      L = (s.game && s.game.levels && s.game.levels["L"+n]) || {};
      cleared = !!L.cleared;
      locked  = n > (s.game.unlockedThrough||1);
      chs = levelChars(lv0);
      cells = [];
      for(var ci=0; ci<chs.length; ci++){
        ch = chs[ci];
        cells.push({ c:ch.c, py:ch.py, cleared:cleared, locked:locked,
                     st: cleared ? "known" : (locked ? "locked" : "todo") });
      }
      zone.levels.push({ n:n, cleared:cleared, locked:locked, chars:cells });
    }
    groups.push(zone);
  }
  return groups;
}
function codexKnownCount(s){
  var g = codexGroups(s), n=0, z, lv;
  for(z=0; z<g.length; z++) for(lv=0; lv<g[z].levels.length; lv++)
    if(g[z].levels[lv].cleared) n += g[z].levels[lv].chars.length;
  return n;
}
function renderDex(){
  var host = $("page-dex"); if(!host) return;
  var g = codexGroups(state), known = codexKnownCount(state), total = CHAR_DICT.length;

      '<div class="dex-track"><div class="dex-track-fill" style="width:'+Math.round(known/total*100)+'%"></div></div>'+
    '</div>';
  for(var z=0; z<g.length; z++){
    var zone = g[z];
    html += '<section class="dex-zone" data-page-node-id="'+nid('dex.zone.'+z)+'">'+
      '<h3 class="dex-zone-t" data-page-node-id="'+nid('dex.zone.'+z+'.t')+'">'+zone.name+'</h3>';
    for(var li=0; li<zone.levels.length; li++){

        '<div class="dex-lv-t" data-page-node-id="'+nid('dex.lv.'+Lv.n+'.t')+'">第 '+Lv.n+' 关'+
          (Lv.cleared?' · 已学会':(Lv.locked?' · 未解锁':''))+'</div>'+
        '<div class="dex-grid">';
      for(var ci=0; ci<Lv.chars.length; ci++){
        var c = Lv.chars[ci];
        html += '<div class="dex-cell '+c.st+'" data-c="'+c.c+'" data-page-node-id="'+nid('codex.cell.'+c.c)+'">'+
          '<div class="dex-pic">'+picSVG(c.c)+'</div>'+
          '<div class="dex-c">'+c.c+'</div>'+
          '<div class="dex-py">'+c.py+'</div>'+
          (c.st==="known" ? '<div class="dex-badge ok">✓</div>' :
           (c.st==="locked" ? '<div class="dex-badge lock">🔒</div>' : '<div class="dex-badge todo">·</div>'))+
        '</div>';
      }
      html += '</div></div>';

    html += '</section>';

  html += '</div>';
  setHTML(host, html);
  [].forEach.call(host.querySelectorAll('.dex-cell.known'), function(el){
