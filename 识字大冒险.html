<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 可访问性：移除 maximum-scale=1.0 与 user-scalable=no，改为允许缩放（美术 §10.4） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<meta name="description" content="识字大冒险 · 5 岁儿童识字启蒙游戏：地图闯关 + 字灵宠物收集">
<title>识字大冒险</title>
<!-- ===== BLOCK: CSS-TOKENS ===== -->
<style>
/* ===== BLOCK: CSS-TOKENS ===== */
/* 来源：美术规格 §11 变量总表（逐字粘贴）
         + 美术 §21.1 v2 追加（含 §14.2 三档绿 / §14.4 暗区修正）
         + GDD §11.7 新增令牌
   冲突处理：--tap-min 取 GDD §11.1 的 64px（覆盖美术 §11 的 56px，取更严者）
             --pet4 取 GDD §5.2 v1.1 修正值 #7C5CFF（与 Lv3 同族）            */
:root{
  /* ========== 1. 中性色 ========== */
  --c-bg:            #FFF6EC;
  --c-bg-sky-top:    #BFE7FA;
  --c-bg-sky-mid:    #DCF1F7;
  --c-bg-sky-bot:    #FFE9CF;
  --c-surface:       #FFFBF5;
  --c-surface-2:     #FFF1E0;
  --c-surface-sunken:#F7EFE3;
  --c-ink:           #4A3B2F;
  --c-ink-2:         #7A6555;
  --c-ink-3:         #9C8878;
  --c-line:          #E8D5BE;
  --c-line-2:        #D9C6AE;
  --c-track:         #F0E2D0;
  --c-hanzi:         #3B2A1E;
  --c-disabled-bg:   #F0E9E0;
  --c-shadow-rgb:    90,60,40;

  /* ========== 2. 主色 · 珊瑚橙 ========== */
  --c-pri-l:  #FFE6D5;
  --c-pri:    #E86F33;
  --c-pri-hi: #FFA05E;
  --c-pri-d:  #B4460F;

  /* ========== 3. 辅助色 L / M / D ========== */
  --c-sky-l:  #DFF2FB;  --c-sky:  #2E90C4;  --c-sky-d:  #17608A;
  --c-mint-l: #DDF5E9;  --c-mint: #2FA373;  --c-mint-d: #1A7A54;
  --c-lav-l:  #EBE3FB;  --c-lav:  #7F5FC4;  --c-lav-d:  #5A3D9E;
  --c-peach-l:#FFE1E9;  --c-peach:#E86A8C;  --c-peach-d:#B93A62;

  /* ========== 4. 语义色 ========== */
  --c-ok-l:   #DDF5E9;  --c-ok:   #2FA373;  --c-ok-d:   #1A7A54;
  --c-err-l:  #FFE4DF;  --c-err:  #D24F3C;  --c-err-d:  #A82B1A;
  --c-warn-l: #FFF2CF;  --c-warn: #F2A93B;  --c-warn-d: #8A6100;
  --c-gold-l: #FFE9AE;  --c-gold: #F2C14E;  --c-gold-d: #B87400;
  --c-star-on:  #FFC94D;  --c-star-off: #D9C6AE;
  --c-star-line:#B87400;  --c-star-off-line:#A88B68;
  --c-lock-bg:  #E7ECF0;  --c-lock-2: #C3CDD6;  --c-lock-ic: #5E6E7C;

  /* ========== 5. 场景 / 岛屿 / 宠物 ========== */
  --c-grass:     #8ED46E;  --c-grass-line: #377020;
  --c-soil-1:    #D9A76C;  --c-soil-2: #B07C46;  --c-soil-line: #8A5A2B;
  --c-road:      #C79A63;  --c-road-in: #F2D8AE;
  --c-wood-1:    #D89A57;  --c-wood-2: #B4762F;  --c-wood-band: #C98A45;
  --c-fur-1:     #F0A978;  --c-fur-2: #DE8551;   --c-fur-line: #B0613A;
  --c-cream:     #FFF1E0;  --c-eye:  #3B2A22;    --c-paw: #5C4132;
  --c-paw-line:  #3F2C21;  --c-blush:#FF9AA6;    --c-tear:#7FD4F5;

  /* ========== 6. 字体 ========== */
  --font-sans:  -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
                "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --font-hanzi: "Kaiti SC", "STKaiti", "KaiTi", "Kaiti TC", "BiauKai",
                "PingFang SC", "Songti SC", serif;
  --font-latin: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  --fs-scale:   1;   /* 家长面板「大字号模式」乘数：1 / 1.15 / 1.3 */

  --fs-hanzi-hero: clamp(120px, 34vw, 200px);
  --fs-hanzi-card: clamp(64px, 17vw, 88px);
  --fs-hanzi-opt:  clamp(30px, 8vw, 38px);
  --fs-hanzi-chip: 32px;
  --fs-hanzi-grid: 40px;
  --fs-h1: 26px;  --fs-h2: 21px;  --fs-h3: 18px;
  --fs-btn: 19px;
  --fs-body: 17px;  --fs-pinyin: 18px;  --fs-cap: 15px;  --fs-mini: 13px;
  --lh-tight: 1.25;  --lh-base: 1.65;

  /* ========== 7. 圆角 ========== */
  --r-xs: 8px;  --r-sm: 12px;  --r-md: 16px;
  --r-lg: 22px; --r-xl: 28px;  --r-pill: 999px;

  /* ========== 8. 阴影（微立体） ========== */
  --sh-1: 0 2px 0 rgba(90,60,40,.05), 0 6px 14px rgba(90,60,40,.10);
  --sh-2: 0 4px 0 rgba(90,60,40,.05), 0 10px 24px rgba(90,60,40,.14);
  --sh-3: 0 6px 0 rgba(90,60,40,.06), 0 16px 36px rgba(90,60,40,.18);
  --sh-modal: 0 24px 60px rgba(60,40,25,.32);
  --btn-edge: #B4460F;
  --sh-btn:      0 5px 0 var(--btn-edge), 0 10px 20px rgba(90,60,40,.22);
  --sh-btn-down: 0 1px 0 var(--btn-edge), 0 3px 8px  rgba(90,60,40,.20);
  --sh-inset: inset 0 2px 5px rgba(140,100,60,.14);

  /* ========== 9. 描边 ========== */
  --bw: 2.5px;
  --bw-ui: 3px;
  --bw-btn-2: 3px;
  --bw-hanzi: 8px;

  /* ========== 10. 间距 / 触控 ========== */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-safe: 12px;
  --tap-min: 64px;      /* GDD §11.1；覆盖美术 §11 的 56px，取更严者 */
  --tap-comfort: 72px;
  --tap-hanzi-opt: min(88px, 22vw);

  /* ========== 11. 动效 ========== */
  --dur-tap: 120ms;  --dur-std: 240ms;  --dur-emp: 400ms;  --dur-show: 800ms;
  --ease-tap:  cubic-bezier(.34,1.56,.64,1);
  --ease-std:  cubic-bezier(.4,0,.2,1);
  --ease-emp:  cubic-bezier(.16,1,.3,1);
  --ease-show: cubic-bezier(.22,1.2,.36,1);
  --ease-soft: cubic-bezier(.45,0,.55,1);

  /* ========== 12. 按钮复合 ========== */
  --btn-pri-bg: linear-gradient(180deg, #FFA05E 0%, #E86F33 100%);

  /* ========== 13. 层级 ========== */
  --z-map: 1; --z-pet: 20; --z-dock: 50; --z-overlay: 100; --z-toast: 200;

  /* ================================================================
     美术 §21.1 · v2 追加令牌
     ================================================================ */
  /* §14.2 修正：答对绿拆三档（原 --ok 单值当描边 2.61:1 / 当文字 2.43:1 均不达标） */
  --ok:      #2BB673;   /* 仅大块填充，禁止承载文字 */
  --ok-line: #157F4B;   /* 描边/边框 5.04:1 */
  --ok-d:    #0F6B3E;   /* 文字 6.58:1 */
  --err:     #FF5252;   /* 大块填充 3.19:1 */
  --err-d:   #C62828;   /* 文字 5.62:1 */

  /* §16 地图 4 区 */
  --z0-sky-a:#BFE9FF; --z0-sky-b:#E8F7D4; --z0-land:#7CC576; --z0-acc:#FFB86B;
  --z1-sky-a:#FFE3C2; --z1-sky-b:#FFD9EC; --z1-land:#FFB86B; --z1-acc:#FF8FB1;
  --z2-sky-a:#D6E4FF; --z2-sky-b:#F0E6FF; --z2-land:#A9C8FF; --z2-acc:#C9B6FF;
  --z3-sky-a:#2E2A5E; --z3-sky-b:#5B4B9E; --z3-land:#6C5CE7; --z3-acc:#FFD86B;

  /* §14.4 修正：暗区（四区）整套前景色切换 */
  --line:           #3B2A1E;  /* 区 0-2 描边 */
  --line-dark:      #E8E3FF;  /* 区 3 描边 3.90:1（深字仅 2.81:1，四区禁用） */
  --star-out:       #3B2A1E;  /* 金色元素贴纸外描边（区 0-2） */
  --star-out-dark:  #FFFFFF;  /* 区 3 */

  /* §17 节点 */
  --node-r:       34px;
  --node-r-boss:  44px;
  --node-hit-r:   48px;   /* §14.3：触控半径 ≠ 视觉半径，360px 屏 → 86px */
  --node-gap-y:  104px;

  /* §18 货币 */
  --c-star:  #FFC93C;  --c-star-line:  #B87400;
  --c-star-off:#D9C6AE;--c-star-off-line:#8A7148;
  --c-fruit: #FF6B5B;  --c-fruit-line: #C43324;
  --c-shard: #9B6DFF;
  --c-key:   #FFC93C;

  /* §19 宝箱 / 奖券 */
  --chest-n-line:#6B4420; --chest-r-line:#2C1B78; --chest-s-line:#A56600;
  --ticket-bg-a:#FFFDF3;  --ticket-bg-b:#FFF3D0;
  --ticket-txt:#3B2A1E;   --ticket-code:#8A5A2B;
  --ticket-head:#A56600;  --ticket-date:#7D6647;
  --notch-bg:#FFF7ED;

  /* §20 特效 */
  --fx-1:#E23C74; --fx-2:#FFC93C; --fx-3:#3DA5E0;
  --fx-4:#6FCB8F; --fx-5:#9B6DFF; --fx-6:#E5680F;

  /* ================================================================
     GDD §11.7 新增设计令牌（与美术令牌并存，供 P1–P3 直接引用）
     ================================================================ */
  --star:#FFC93C;
  --energy:#FF6B5B;
  --shard:#9B6DFF;
  --coupon:#FFD86B;
  --zone1:#7CC576;  --zone1-sky1:#BFE9FF; --zone1-sky2:#E8F7D4;
  --zone2:#FFB86B;  --zone2-sky1:#FFE3C2; --zone2-sky2:#FFD9EC;
  --zone3:#A9C8FF;  --zone3-sky1:#D6E4FF; --zone3-sky2:#F0E6FF;
  --zone4:#6C5CE7;  --zone4-sky1:#2E2A5E; --zone4-sky2:#5B4B9E;
  --pet1:#B9B4CC; --pet2:#A79BD6; --pet3:#9B6DFF; --pet4:#7C5CFF; --pet5:#5B3FE0;
  --locked:#C9C2B8;
  --safe-top:env(safe-area-inset-top);
  --safe-bot:env(safe-area-inset-bottom);

  /* 工程常量 */
  --hud-h: 56px;
  --tab-h: 72px;
}
/* ===== /BLOCK: CSS-TOKENS ===== */

/* ===================== 全局基础（美术 §11 尾部） ===================== */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0;
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: var(--font-sans);
  font-size: calc(var(--fs-body) * var(--fs-scale));
  line-height: var(--lh-base);
  overscroll-behavior-y: none;
}
/* 本版用 flex 100dvh 三段式布局（HUD / 主区 / Tab），底部安全区由 #tabbar 承担，
   故覆盖美术 §11 的 body padding-bottom，避免与 tabbar 高度叠加。 */
body{ padding-bottom:0; height:100dvh; overflow:hidden; }
button{ font-family:inherit; font-size:inherit; color:inherit; }
[hidden]{ display:none !important; }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* 焦点可见（美术 §10.5） */
:focus-visible{ outline:4px solid var(--c-sky); outline-offset:3px; }

/* ===================== 应用外壳 ===================== */
#app{
  height:100dvh; display:flex; flex-direction:column;
  background:var(--c-bg); overflow:hidden;
}
#pages{ position:relative; flex:1 1 auto; min-height:0; }
.page{ position:absolute; inset:0; display:none; }
.page.on{ display:block; }

/* ===================== HUD（顶部资源条） ===================== */
.hud{
  position:relative; z-index:var(--z-dock);
  flex:0 0 auto;
  display:flex; align-items:center; gap:var(--sp-2);
  min-height:var(--hud-h);
  padding: calc(var(--sp-2) + var(--safe-top)) var(--sp-3) var(--sp-2);
  background:linear-gradient(180deg,#FFFDF8 0%,#FFF6EC 100%);
  border-bottom:var(--bw-ui) solid var(--c-line);
  box-shadow:var(--sh-1);
}
.hud-curs{ display:flex; align-items:center; gap:var(--sp-2); flex:1 1 auto; min-width:0; }
.cur{
  display:inline-flex; align-items:center; gap:5px;
  height:40px; padding:0 12px 0 8px;
  background:var(--c-surface); border:2.5px solid var(--c-line);
  border-radius:var(--r-pill);
  font-size:var(--fs-cap); font-weight:800; color:var(--c-ink);
  box-shadow:0 2px 0 rgba(var(--c-shadow-rgb),.10);
}
.cur svg{ display:block; flex:0 0 auto; }
.cur-n{ font-variant-numeric:tabular-nums; }
.cur-sub{ font-size:var(--fs-mini); font-weight:700; color:var(--c-ink-2); }
/* 家长入口：视觉 40×40，热区扩到 64×64（GDD §11.1 触控下限 + 防儿童误触） */
.pbtn{
  position:relative; flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  display:grid; place-items:center;
  background:transparent; border:0; padding:0; cursor:pointer;
  -webkit-touch-callout:none; user-select:none;
}
.pbtn-face{
  width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center;
  background:var(--c-surface-2); border:2.5px solid var(--c-line);
  color:var(--c-pri-d); font-size:19px; line-height:1;
  box-shadow:0 2px 0 rgba(var(--c-shadow-rgb),.12);
  transition:transform var(--dur-tap) var(--ease-tap), background var(--dur-tap) linear;
}
.pbtn:active .pbtn-face{ transform:scale(.94); background:var(--c-pri-l); }
.pbtn-fill{
  position:absolute; left:12px; right:12px; bottom:8px; height:4px;
  border-radius:2px; background:var(--c-pri);
  transform:scaleX(0); transform-origin:left center; opacity:0;
}
.pbtn.pressing .pbtn-fill{ opacity:1; animation:pressfill 2s linear forwards; }
@keyframes pressfill{ from{transform:scaleX(0);} to{transform:scaleX(1);} }

/* ===================== 地图（美术 §16.7） ===================== */
.map-wrap{
  position:absolute; inset:0 0 0 0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  scroll-snap-type:y proximity;
  background:#0E0B1F;                 /* 滚出边界时的兜底底色 */
}
.map{ display:block; width:100%; height:auto; }
.node{ cursor:pointer; outline:none; }
.node .hit{ pointer-events:all; }
.node:focus-visible .disc{ stroke:#FFFFFF; stroke-width:5; }
.node.locked-shake{ animation:cardshake .42s ease-in-out both; }
@keyframes cardshake{
  0%,100%{ transform:translateX(0); }
  15%{ transform:translateX(-8px); } 35%{ transform:translateX(7px); }
  55%{ transform:translateX(-5px); } 75%{ transform:translateX(4px); }
}

/* ===================== 关卡节点 5 态（美术 §17.6） ===================== */
.node .disc{ transition:transform .18s ease, filter .2s ease; }
.node .numbg, .node .num{ pointer-events:none; }

/* --- 1) locked --- */
.n-locked{ filter:saturate(.25) brightness(.92); }
.n-locked .disc{ fill:#C9C2B8; }
.n-locked .numbg{ fill:#EDE8DD; stroke:#6B6455; }
.n-locked .num{ fill:#6B6455; }
.n-locked .lockcloud{
  transform-box:fill-box; transform-origin:center;
  animation:lockdrift 4s ease-in-out infinite;
}
.n-locked .lockcloud--2{ animation-delay:-1.3s; }
.n-locked .lockcloud--3{ animation-delay:-2.6s; }
@keyframes lockdrift{
  0%{transform:translateX(-16px);} 50%{transform:translateX(16px);} 100%{transform:translateX(-16px);}
}

/* --- 2) available / 3) inProgress --- */
.n-available .halo,
.n-inProgress .halo,
.n-available .halo--in,
.n-inProgress .halo--in{
  transform-box:view-box; transform-origin:center;
  animation:nodehalo 1.4s ease-out infinite;
}
@keyframes nodehalo{
  0%{ transform:scale(1);     opacity:.6; }
  100%{ transform:scale(1.3); opacity:0;  }
}
/* 浮动只作用在 .disc —— 外层 <g> 带 transform 属性，动画不能挂它（美术 §15.5 / §17.6） */
.n-available .disc,
.n-inProgress .disc{
  transform-box:fill-box; transform-origin:center;
  animation:nodefloat 1.2s ease-in-out infinite;
}
@keyframes nodefloat{
  0%,100%{ transform:translateY(-5px); } 50%{ transform:translateY(5px); }
}
.n-available .flag,
.n-inProgress .flag{
  transform-box:fill-box; transform-origin:bottom left;
  animation:flagwave 1.6s ease-in-out infinite;
}
@keyframes flagwave{
  0%,100%{ transform:rotate(-8deg) scaleX(1); } 50%{ transform:rotate(6deg) scaleX(.88); }
}

/* --- 4) cleared：静止 --- */
.n-cleared .disc{ animation:none; }
.n-cleared .halo{ display:none; }
.n-cleared .stars .off{ opacity:.55; }

/* --- 5) perfect --- */
/* 美术 §17.7：禁用 drop-shadow（20 节点并发 SVG filter 掉帧），
   改用双层同心描边（宽而淡的外圈 + 窄而实的内圈），静态渲染无性能损耗 */
.n-perfect .perfectring{ filter:none; }
.n-perfect .disc{
  transform-box:fill-box; transform-origin:center;
  animation:perfectflash 3s ease-in-out infinite;
  /* 相位打散：每个节点用 --i 错开起始相位，避免 20 个金环同步闪（美术 §17.7 互质步长 137ms） */
  animation-delay:calc(var(--i) * -137ms);
}
@keyframes perfectflash{
  0%,86%,100%{ transform:scale(1); } 92%{ transform:scale(1.08); } 96%{ transform:scale(1.03); }
}
.n-perfect .crown{
  transform-box:fill-box; transform-origin:center;
  animation:crownbob 2.4s ease-in-out infinite;
  animation-delay:calc(var(--i) * -211ms);
}
@keyframes crownbob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }

/* --- Boss 星框 20s 匀速旋转 --- */
.n-boss .bossframe{
  transform-box:fill-box; transform-origin:center;
  animation:bossspin 20s linear infinite;
}
@keyframes bossspin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* ===================== 底部 Tab（≥72px 高，含安全区） ===================== */
.tabbar{
  flex:0 0 auto; z-index:var(--z-dock);
  display:flex; align-items:stretch;
  min-height:var(--tab-h);
  padding-bottom:var(--safe-bot);
  background:var(--c-surface);
  border-top:var(--bw-ui) solid var(--c-line);
  box-shadow:0 -4px 16px rgba(var(--c-shadow-rgb),.10);
}
.tab{
  flex:1 1 0; min-width:0; min-height:var(--tab-h);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:transparent; border:0; padding:6px 2px; cursor:pointer;
  color:var(--c-ink-2); font-size:var(--fs-mini); font-weight:800;
  transition:transform var(--dur-tap) var(--ease-tap), color var(--dur-tap) linear;
}
.tab:active{ transform:scale(.94); }
.tab svg{ display:block; }
.tab.on{ color:var(--c-pri-d); }
.tab.on .tab-ic{ background:var(--c-pri-l); }
.tab-ic{
  width:34px; height:34px; border-radius:50%;
  display:grid; place-items:center;
  background:transparent; transition:background var(--dur-tap) linear;
}

/* ===================== 通用页内占位 / 区块 ===================== */
.pane{ padding:var(--sp-4); }
.stub{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--sp-3); text-align:center;
  min-height:60vh; padding:var(--sp-5);
  color:var(--c-ink-2);
}
.stub-badge{
  width:88px; height:88px; border-radius:var(--r-lg);
  display:grid; place-items:center; font-size:40px;
  background:var(--c-surface-2); border:var(--bw-ui) solid var(--c-line);
  box-shadow:var(--sh-1);
}
.stub-t{ font-size:var(--fs-h3); font-weight:800; color:var(--c-ink); }
.stub-d{ font-size:var(--fs-cap); max-width:30ch; }
.stub-tag{
  font-size:var(--fs-mini); font-weight:800; color:var(--c-ink-2);
  background:var(--c-surface-sunken); border-radius:var(--r-pill);
  padding:4px 12px;
}

/* ===================== 按钮 ===================== */
.btn{
  min-height:56px; padding:0 var(--sp-5);
  display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2);
  border-radius:var(--r-pill); border:0; cursor:pointer;
  font-size:var(--fs-btn); font-weight:800; color:#FFFFFF;
  background:var(--btn-pri-bg); box-shadow:var(--sh-btn);
  transition:transform var(--dur-tap) var(--ease-tap);
}
.btn:active{ transform:translateY(3px); box-shadow:var(--sh-btn-down); }
.btn-sec{
  color:var(--c-ink); background:var(--c-surface);
  border:var(--bw-btn-2) solid var(--c-line-2); box-shadow:0 3px 0 var(--c-line-2);
}
.btn-sec:active{ box-shadow:0 1px 0 var(--c-line-2); }
.btn[aria-pressed="false"]{ color:var(--c-ink-3); background:var(--c-disabled-bg);
  border:var(--bw-btn-2) solid var(--c-line); box-shadow:none; }
.seg{ display:flex; gap:var(--sp-2); flex-wrap:wrap; }

/* ===================== 家长中心面板 ===================== */
.scrim{
  position:fixed; inset:0; z-index:var(--z-overlay);
  background:rgba(60,40,25,.42);
  display:none;
}
.scrim.on{ display:block; }
.panel{
  position:fixed; left:0; right:0; bottom:0; z-index:var(--z-overlay);
  max-height:86dvh; overflow-y:auto;
  padding:var(--sp-4) var(--sp-4) calc(var(--sp-5) + var(--safe-bot));
  background:var(--c-surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--sh-modal);
  transform:translateY(102%); transition:transform var(--dur-emp) var(--ease-emp);
}
.panel.on{ transform:translateY(0); }
.panel-hd{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-4); }
.panel-hd h2{ margin:0; font-size:var(--fs-h2); flex:1 1 auto; }
.panel-x{
  width:var(--tap-min); height:var(--tap-min); flex:0 0 auto;
  border-radius:50%; border:var(--bw-btn-2) solid var(--c-line-2);
  background:var(--c-surface-2); font-size:22px; cursor:pointer;
}
.panel-sec{ margin-bottom:var(--sp-5); }
.panel-sec > h3{
  margin:0 0 var(--sp-2); font-size:var(--fs-h3); color:var(--c-ink);
  border-bottom:2px solid var(--c-line); padding-bottom:6px;
}
.row{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-3); }
.row-lb{ flex:1 1 auto; font-size:var(--fs-body); font-weight:700; }
.hint{ font-size:var(--fs-mini); color:var(--c-ink-2); margin:0 0 var(--sp-3); }
.todo{
  font-size:var(--fs-mini); font-weight:800; color:var(--c-ink-2);
  background:var(--c-surface-sunken); border:2px dashed var(--c-line-2);
  border-radius:var(--r-sm); padding:var(--sp-3);
}

/* ===================== Toast ===================== */
.toast{
  position:fixed; left:50%; bottom:calc(var(--tab-h) + var(--safe-bot) + 16px);
  transform:translate(-50%, 12px);
  z-index:var(--z-toast);
  max-width:min(88vw, 420px);
  padding:12px 20px; border-radius:var(--r-pill);
  background:var(--c-ink); color:#FFF9F0;
  font-size:var(--fs-cap); font-weight:800; text-align:center;
  box-shadow:var(--sh-2);
  opacity:0; pointer-events:none;
  transition:opacity var(--dur-std) var(--ease-std), transform var(--dur-std) var(--ease-std);
}
.toast.on{ opacity:1; transform:translate(-50%, 0); }

/* ===================== 动效降级（美术 §20.6 / §10.3） =====================
   循环动画一律 animation:none，绝不用「把时长压到接近 0」的替代写法
   —— 后者会让 infinite 循环高频重绘，是光敏性风险。 */
@media (prefers-reduced-motion: reduce){
  .n-locked .lockcloud,
  .n-available .halo, .n-inProgress .halo,
  .n-available .halo--in, .n-inProgress .halo--in,
  .n-available .disc, .n-inProgress .disc,
  .n-available .flag, .n-inProgress .flag,
  .n-perfect .disc, .n-perfect .crown,
  .n-boss .bossframe,
  .pbtn.pressing .pbtn-fill{
    animation:none !important;
  }
  /* 长按进度改用描边提示，不依赖动画传达（美术 §10.3「不依赖动画单独传达信息」） */
  .pbtn.pressing .pbtn-face{ outline:3px solid var(--c-sky); outline-offset:2px; }
  *{ transition-duration:.01ms !important; }
}

/* ===================== 横屏 / 平板（美术 §10.6） ===================== */
@media (orientation: landscape) and (min-height: 420px){
  .map-wrap{ padding-bottom: 8px; }
}
@media (min-width: 1024px){
  .map{ max-width: 640px; margin: 0 auto; }
  .panel{ left:50%; right:auto; transform:translate(-50%,102%); width:min(640px,92vw); border-radius:var(--r-xl); }
  .panel.on{ transform:translate(-50%,0); }
}
/* ===== /BLOCK: CSS-TOKENS ===== */

/* ===== BLOCK: LEVEL-FLOW (P1) ===== */
/* 关卡全屏流水线（S1 学字 → S2 小游戏 ×2 → S3 小考 → S4 演出）。
   视觉沿用「棉花糖星球」令牌：珊瑚橙主色、奶白卡面、低饱和马卡龙；不引入新配色。 */
.level-overlay{
  position:fixed; inset:0; z-index:var(--z-overlay);
  display:none; flex-direction:column;
  background:linear-gradient(180deg, var(--c-bg-sky-top) 0%, var(--c-bg-sky-bot) 100%);
}
.level-overlay.on{ display:flex; }
.lv-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; justify-content:center; }
.lv-stage{ width:100%; max-width:680px; padding:calc(var(--sp-5) + var(--safe-top)) var(--sp-4) calc(var(--sp-6) + var(--safe-bot));
  display:flex; flex-direction:column; gap:var(--sp-4); }
.lv-hd{ display:flex; align-items:center; gap:var(--sp-3); }
.lv-x{ flex:0 0 auto; width:var(--tap-min); height:var(--tap-min); border-radius:50%;
  border:var(--bw-ui) solid var(--c-line); background:var(--c-surface); color:var(--c-ink);
  font-size:24px; line-height:1; cursor:pointer; }
.lv-x:active{ transform:scale(.94); }
.lv-hd-t{ flex:1 1 auto; text-align:center; font-size:var(--fs-h2); font-weight:800; color:var(--c-ink); }
.lv-hint{ flex:0 0 auto; min-height:var(--tap-min); padding:0 var(--sp-4); border-radius:var(--r-pill);
  border:var(--bw-ui) solid var(--c-warn); background:var(--c-warn-l); color:var(--c-warn-d); font-weight:800; cursor:pointer; }
.lv-hint:active{ transform:scale(.96); }
.lv-stim{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); padding:var(--sp-4);
  background:var(--c-surface); border-radius:var(--r-lg); box-shadow:var(--sh-2); }
.lv-stim.lv-pulse{ animation:lvpulse .7s ease; }
@keyframes lvpulse{ 0%{transform:scale(1);} 40%{transform:scale(1.05); box-shadow:0 0 0 6px var(--c-warn-l);} 100%{transform:scale(1);} }
.lv-hero{ font-family:var(--font-hanzi); font-size:var(--fs-hanzi-hero); color:var(--c-hanzi); line-height:1; }
.lv-pic{ width:min(58vw,240px); }
.lv-pic svg{ width:100%; height:auto; display:block; }
.lv-py{ font-size:var(--fs-hanzi-chip); color:var(--c-pri-d); font-weight:800; }
.lv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
.lv-opt{ min-height:88px; padding:var(--sp-3); border-radius:var(--r-lg); border:var(--bw-ui) solid var(--c-line);
  background:var(--c-surface); box-shadow:var(--sh-1); display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; cursor:pointer; transition:transform var(--dur-tap) var(--ease-tap); }
.lv-opt:active{ transform:scale(.96); }
.lv-opt.correct{ border-color:var(--ok-line); background:var(--c-ok-l); }
.lv-opt.correct-hint{ border-color:var(--ok-line); background:var(--c-ok-l); animation:lvpulse .8s ease; }
.lv-opt.wrong{ border-color:var(--err); background:var(--c-err-l); animation:lvshake .42s ease; }
.lv-opt.dim{ opacity:.4; }
.lv-ch{ font-family:var(--font-hanzi); font-size:var(--fs-hanzi-grid); color:var(--c-hanzi); line-height:1; }
.lv-py-lg{ font-size:var(--fs-hanzi-chip); color:var(--c-pri-d); font-weight:800; }
.lv-listen{ min-height:var(--tap-comfort); padding:0 var(--sp-5); border-radius:var(--r-pill);
  border:var(--bw-btn-2) solid var(--c-sky); background:var(--c-sky-l); color:var(--c-sky-d); font-weight:800; font-size:var(--fs-btn); cursor:pointer; }
.lv-listen:active{ transform:scale(.96); }
.lv-big-play,.lv-small-play{ border:0; background:transparent; cursor:pointer; }
.lv-big-play{ font-size:64px; }
.lv-small-play{ font-size:30px; }
.lv-listen-lab{ font-size:var(--fs-cap); color:var(--c-ink-2); }
.lv-fb{ min-height:28px; text-align:center; font-size:var(--fs-h3); font-weight:800; color:var(--c-pri-d); }
.lv-btn{ min-height:var(--tap-comfort); padding:0 var(--sp-6); border-radius:var(--r-pill);
  border:var(--bw-btn-2) solid var(--btn-edge); background:var(--btn-pri-bg); color:#fff;
  font-weight:800; font-size:var(--fs-btn); box-shadow:var(--sh-btn); cursor:pointer; }
.lv-btn:active{ transform:translateY(3px); box-shadow:var(--sh-btn-down); }
.lv-btn-ghost{ background:var(--c-surface); color:var(--c-ink); border-color:var(--c-line); box-shadow:var(--sh-1); }
.lv-btn-sm{ min-height:48px; padding:0 var(--sp-4); font-size:var(--fs-body); }
.lv-s1card,.lv-s4{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-4);
  padding:var(--sp-5) var(--sp-4); background:var(--c-surface-2); border-radius:var(--r-xl); box-shadow:var(--sh-2); }
.lv-words{ display:flex; flex-wrap:wrap; gap:var(--sp-2); justify-content:center; }
.lv-word{ padding:6px 12px; border-radius:var(--r-pill); background:var(--c-surface); border:2px solid var(--c-line); font-size:var(--fs-body); color:var(--c-ink); }
.lv-stars{ display:flex; gap:var(--sp-3); justify-content:center; }
.lv-star{ display:inline-block; }
.lv-star.pop{ animation:lvstarpop .5s var(--ease-emp) both; }
.lv-star.pop:nth-child(2){ animation-delay:.12s; }
.lv-star.pop:nth-child(3){ animation-delay:.24s; }
@keyframes lvstarpop{ 0%{transform:translateY(-40px) rotate(-180deg) scale(.4); opacity:0;} 60%{transform:translateY(0) rotate(0) scale(1.25); opacity:1;} 100%{transform:scale(1);} }
.lv-reward{ display:flex; gap:var(--sp-3); justify-content:center; flex-wrap:wrap; }
.lv-reward-c{ padding:10px 16px; border-radius:var(--r-md); background:var(--c-surface); border:2px solid var(--c-line); font-weight:800; font-size:var(--fs-body); }
.lv-s4tip{ font-size:var(--fs-cap); color:var(--c-ink-2); text-align:center; }
.lv-learned{ display:flex; gap:var(--sp-2); flex-wrap:wrap; justify-content:center; }
.lv-chip{ width:56px; height:56px; border-radius:var(--r-md); border:2px solid var(--c-line); background:var(--c-surface);
  font-family:var(--font-hanzi); font-size:34px; color:var(--c-hanzi); cursor:pointer; }
.lv-chip:active{ transform:scale(.94); }
@keyframes lvshake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(4px);} }
/* ===== /BLOCK: LEVEL-FLOW ===== */

</style>
<!-- ===== /BLOCK: CSS-TOKENS ===== -->
</head>
<body>
<div id="app" data-nid="app.root">

  <!-- ===================== 顶部 HUD：3 种货币 + 家长入口 ===================== -->
  <header class="hud" id="hud" data-nid="hud.wrap">
    <div class="hud-curs" data-nid="hud.curs">
      <span class="cur" id="curStar" data-nid="hud.star" role="status" aria-live="polite">
        <span class="cur-ic" id="icStar" data-nid="hud.star.ic" aria-hidden="true"></span>
        <span class="cur-n" id="nStar" data-nid="hud.star.n">0</span>
        <span class="sr-only">星星</span>
      </span>
      <span class="cur" id="curEnergy" data-nid="hud.energy" role="status" aria-live="polite">
        <span class="cur-ic" id="icEnergy" data-nid="hud.energy.ic" aria-hidden="true"></span>
        <span class="cur-n" id="nEnergy" data-nid="hud.energy.n">0</span>
        <span class="sr-only">能量果</span>
      </span>
      <span class="cur" id="curShard" data-nid="hud.shard" role="status" aria-live="polite">
        <span class="cur-ic" id="icShard" data-nid="hud.shard.ic" aria-hidden="true"></span>
        <span class="cur-n" id="nShard" data-nid="hud.shard.n">0</span>
        <span class="sr-only">钥匙碎片</span>
      </span>
    </div>

    <!-- 家长入口：视觉 40×40 / 热区 64×64 / 长按 2 秒触发（单击无响应） -->
    <button class="pbtn" id="pBtn" data-nid="hud.parent" type="button"
            aria-label="家长中心，长按两秒打开">
      <span class="pbtn-face" data-nid="hud.parent.face" aria-hidden="true">⚙</span>
      <span class="pbtn-fill" data-nid="hud.parent.fill" aria-hidden="true"></span>
    </button>
  </header>

  <!-- ===================== 主区（4 个 Tab 页 + 4 个关卡流程舞台） ===================== -->
  <main id="pages" data-nid="pages">

    <!-- ===== BLOCK: PAGE-MAP ===== -->
    <section class="page on" id="page-map" data-nid="page.map" aria-label="地图">
      <div class="map-wrap" id="mapWrap" data-nid="map.wrap">
        <!-- ===== BLOCK: SVG-GENERATORS ===== -->
        <!-- 生成器本体在页面底部脚本区：JS-BLOCK: SVG-GENERATORS
             （picSVG / 地图 zonePlate·node·map / 宠物 petSVG / 货币图标 ICON） -->
        <div id="mapHost" data-nid="map.host"></div>
        <!-- ===== /BLOCK: SVG-GENERATORS ===== -->
      </div>
    </section>
    <!-- ===== /BLOCK: PAGE-MAP ===== -->

    <!-- ===== BLOCK: STAGE-LEARN ===== -->
    <!-- TODO(ENG-001-P1): S1 学字流水线，见 GDD §3.2 / 美术 §5。本阶段仅占位。 -->
    <section class="page" id="stage-learn" data-nid="stage.learn" aria-label="学字"></section>
    <!-- ===== /BLOCK: STAGE-LEARN ===== -->

    <!-- ===== BLOCK: STAGE-GAMES ===== -->
    <!-- TODO(ENG-001-P1/P4): S2 小游戏 ×2（G1–G5），见 GDD §7。本阶段仅占位。 -->
    <section class="page" id="stage-games" data-nid="stage.games" aria-label="小游戏"></section>
    <!-- ===== /BLOCK: STAGE-GAMES ===== -->

    <!-- ===== BLOCK: STAGE-EXAM ===== -->
    <!-- TODO(ENG-001-P1): S3 小考 5 题，见 GDD §3.4。本阶段仅占位。 -->
    <section class="page" id="stage-exam" data-nid="stage.exam" aria-label="小考"></section>
    <!-- ===== /BLOCK: STAGE-EXAM ===== -->

    <!-- ===== BLOCK: STAGE-RESULT ===== -->
    <!-- TODO(ENG-001-P1): S4 通关演出与三星结算，见 GDD §3.5 / 美术 §20。本阶段仅占位。 -->
    <section class="page" id="stage-result" data-nid="stage.result" aria-label="结算"></section>
    <!-- ===== /BLOCK: STAGE-RESULT ===== -->

    <!-- ===== BLOCK: PAGE-PET ===== -->
    <!-- TODO(ENG-001-P2): 宠物「字灵墨墨」养成，见 GDD §5 / 美术 §15。本阶段仅占位。 -->
    <section class="page" id="page-pet" data-nid="page.pet" aria-label="宠物"></section>
    <!-- ===== /BLOCK: PAGE-PET ===== -->

    <!-- ===== BLOCK: PAGE-DEX ===== -->
    <!-- TODO(ENG-001-P3): 100 字图鉴三态 + 详情，见 GDD §6。本阶段仅占位。 -->
    <section class="page" id="page-dex" data-nid="page.dex" aria-label="图鉴"></section>
    <!-- ===== /BLOCK: PAGE-DEX ===== -->

    <!-- ===== BLOCK: PAGE-CHEST ===== -->
    <!-- TODO(ENG-001-P3): 宝箱屋 + 金色奖券，见 GDD §4 / 美术 §19。本阶段仅占位。 -->
    <section class="page" id="page-chest" data-nid="page.chest" aria-label="宝箱"></section>
    <!-- ===== /BLOCK: PAGE-CHEST ===== -->

  </main>

  <!-- ===================== 底部 Tab ===================== -->
  <nav class="tabbar" id="tabbar" data-nid="tabbar" role="tablist" aria-label="主导航">
    <button class="tab on" id="tab-map" data-nid="tab.map" type="button"
            role="tab" aria-selected="true" data-page="page-map">
      <span class="tab-ic" data-nid="tab.map.ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      </span>
      <span data-nid="tab.map.tx">地图</span>
    </button>
    <button class="tab" id="tab-pet" data-nid="tab.pet" type="button"
            role="tab" aria-selected="false" data-page="page-pet">
      <span class="tab-ic" data-nid="tab.pet.ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="9" r="2.1"/><circle cx="12" cy="6.5" r="2.1"/><circle cx="17" cy="9" r="2.1"/><path d="M12 11c2.6 0 4.6 2.1 4.6 4.2S14.6 19 12 19s-4.6-1.7-4.6-3.8S9.4 11 12 11z"/></svg>
      </span>
      <span data-nid="tab.pet.tx">宠物</span>
    </button>
    <button class="tab" id="tab-dex" data-nid="tab.dex" type="button"
            role="tab" aria-selected="false" data-page="page-dex">
      <span class="tab-ic" data-nid="tab.dex.ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      </span>
      <span data-nid="tab.dex.tx">图鉴</span>
    </button>
    <button class="tab" id="tab-chest" data-nid="tab.chest" type="button"
            role="tab" aria-selected="false" data-page="page-chest">
      <span class="tab-ic" data-nid="tab.chest.ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 5 5h14l2 5.5"/><rect x="3" y="10.5" width="18" height="9" rx="2"/><path d="M12 10.5v9"/><path d="M10.2 13.6h3.6"/></svg>
      </span>
      <span data-nid="tab.chest.tx">宝箱</span>
    </button>
  </nav>
</div>

<!-- ===== BLOCK: PARENT-PANEL ===== -->
<div class="scrim" id="scrim" data-nid="scrim"></div>
<aside class="panel" id="parentPanel" data-nid="panel.parent" role="dialog" aria-modal="true"
       aria-labelledby="parentTitle" aria-hidden="true">
  <div class="panel-hd" data-nid="panel.parent.hd">
    <h2 id="parentTitle" data-nid="panel.parent.title">家长中心</h2>
    <button class="panel-x" id="parentX" data-nid="panel.parent.close" type="button" aria-label="关闭">✕</button>
  </div>

  <div class="panel-sec" data-nid="panel.sec.display">
    <h3 data-nid="panel.sec.display.t">显示</h3>
    <div class="row" data-nid="panel.row.fsscale">
      <span class="row-lb" data-nid="panel.row.fsscale.lb">大字号模式</span>
      <span class="seg" data-nid="panel.row.fsscale.seg">
        <button class="btn btn-sec" type="button" data-fs="1"    aria-pressed="true"  data-nid="panel.fs.1">标准</button>
        <button class="btn btn-sec" type="button" data-fs="1.15" aria-pressed="false" data-nid="panel.fs.115">较大</button>
        <button class="btn btn-sec" type="button" data-fs="1.3"  aria-pressed="false" data-nid="panel.fs.13">最大</button>
      </span>
    </div>
    <div class="row" data-nid="panel.row.sound">
      <span class="row-lb" data-nid="panel.row.sound.lb">音效</span>
      <button class="btn btn-sec" id="soundBtn" type="button" aria-pressed="true" data-nid="panel.sound">开</button>
    </div>
  </div>

  <div class="panel-sec" data-nid="panel.sec.todo">

/* ============ 拼音发音（浏览器内置 TTS，零外链/离线可用） ============ */
var _zhVoice=null;
function _initVoices(){
  if(!('speechSynthesis' in window)) return;
  var vs=window.speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++){
    if(/zh|Chinese|普通话|Mandarin|Yue/i.test(vs[i].lang+" "+vs[i].name)){ _zhVoice=vs[i]; break; }
  }
}
function ttsOK(){ return ('speechSynthesis' in window); }
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=_initVoices; _initVoices(); }
function spkSVG(){
  return '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
}
function speak(text){
  if(!ttsOK()||!text) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN"; u.rate=0.85; u.pitch=1.05;
    if(_zhVoice) u.voice=_zhVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* 美术 §9：Web Audio 合成音效（零外链，护耳参数：sine/triangle、≤1600Hz、attack≥10ms） */
var SFX = (function(){
  var AC=null, MASTER=null, LP=null, enabled=true;

  function ctx(){
    if(!AC){
      var C = (typeof window !== "undefined") && (window.AudioContext || window.webkitAudioContext);
      if(!C) return null;
      AC = new C();
      LP = AC.createBiquadFilter(); LP.type='lowpass'; LP.frequency.value=5200; LP.Q.value=.7;
      MASTER = AC.createGain(); MASTER.gain.value=.5;
      LP.connect(MASTER); MASTER.connect(AC.destination);
    }
    if(AC.state === 'suspended' && AC.resume) AC.resume();   /* iOS 需用户手势解锁 */
    return AC;
  }
  function tone(o){
    if(!enabled) return;
    var c = ctx(); if(!c) return;
    var dur = o.dur||.18, t0 = c.currentTime + (o.delay||0), peak = (o.gain==null?.16:o.gain);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t0);
    if(o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t0 + dur*.9);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack||.014));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    osc.connect(g); g.connect(LP);
    osc.start(t0); osc.stop(t0 + dur + .06);
  }
  function noise(dur, gain, freq){          /* 低频"隆隆"，仅用于开箱 */
    if(!enabled) return;
    var c = ctx(); if(!c) return;
    var n = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1,n,c.sampleRate), d = buf.getChannelData(0), i;
    for(i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    var src = c.createBufferSource(); src.buffer = buf;
    var bp = c.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value = freq||500;
    var g = c.createGain(); g.gain.value = gain||.07;
    src.connect(bp); bp.connect(g); g.connect(LP); src.start();
  }
  return {
    setEnabled: function(v){ enabled = !!v; },
    unlock: function(){ ctx(); },
    tap:    function(){ tone({freq:880, dur:.07, type:'sine', gain:.10, attack:.006}); },
    right:  function(){ [523.25,659.25,783.99].forEach(function(f,i){
              tone({freq:f, dur:.16, type:'triangle', gain:.15, delay:i*.085}); }); },
    wrong:  function(){ tone({freq:392, slideTo:311, dur:.26, type:'sine', gain:.13, attack:.02}); },
    clear:  function(){
              [523.25,659.25,783.99,1046.5].forEach(function(f,i){
                tone({freq:f, dur:.22, type:'triangle', gain:.14, delay:i*.11}); });
              tone({freq:1567.98, dur:.5, type:'sine', gain:.07, delay:.42}); },
    levelup:function(){
              [523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){
                tone({freq:f, dur:.18, type:'triangle', gain:.14, delay:i*.1}); });
              tone({freq:1046.5,  dur:.7, type:'sine', gain:.10, delay:.5});
              tone({freq:1567.98, dur:.7, type:'sine', gain:.06, delay:.5}); },
    chest:  function(){
              noise(.22,.06,380);
              tone({freq:660, slideTo:1318.5, dur:.34, type:'sine', gain:.13, attack:.03});
              tone({freq:1760, dur:.45, type:'sine', gain:.08, delay:.2});
              tone({freq:2093, dur:.40, type:'sine', gain:.05, delay:.26}); }
  };
})();

if(typeof document !== "undefined" && document.addEventListener){
  document.addEventListener('touchend', function once(){ SFX.unlock(); document.removeEventListener('touchend', once); }, {passive:true});
  document.addEventListener('click',    function once(){ SFX.unlock(); document.removeEventListener('click',    once); });
}

/* GDD §12.2 v2 数据模型：v1 字段一个不删、语义不变；v2 字段全部追加。
   append-only：learned / codex / stats / chest.log / coupons 只追加不删除。 */
var KEY    = "wb_shizi_v2";          /* v2 本地键 */
var KEY_V1 = "wb_shizi_v1";          /* v1 本地键：只读一遍用于迁移，绝不删除/覆盖 */
var STAGE_THRESH = [10,25,45,70,100,140,190,250,320,400];   /* v1 10 关制门槛，保留 */
var PET_STAGES = [                                           /* GDD §5.2 */
  {lv:1, bond:0,   name:"蛋宝宝", scale:.75},

];
function bondToLevel(bond){ var lv=1, i; for(i=0;i<PET_STAGES.length;i++) if(bond>=PET_STAGES[i].bond) lv=PET_STAGES[i].lv; return lv; }

var state = null;

function defaultStateV2(){
  return {
    /* ═══ v1 字段：全部保留，语义不变 ═══ */
    version:2, pin:null, updatedAt:0, startDate:todayStr(),

    stars:0, starsTotal:0, energy:0, shards:0, keys:0,
    game:{ levels:{}, zones:[0,0,0,0], lastPlayedLevel:null, unlockedThrough:1 },
    pet:{ name:"墨墨", species:"ink", bond:0, level:1,
          fedToday:0, petToday:0, lastCareDate:"",

    /* fsScale 是本阶段工程追加项（对应美术 §11 的 --fs-scale 大字号模式），
       其余字段与 GDD §12.2 完全一致。 */
    settingsNew:{ dailyMinutes:20, restReminder:true, soundOn:true, fsScale:1, chestPool:{} }
  };

/* ---- 迁移：v1 → v2，幂等（GDD §12.4） ---- */
function migrate(s){
  if(!s || typeof s !== "object") return defaultStateV2();
  if(s.version >= 2) return normalizeV2(s);      /* 已迁移，只做补齐 */

  /* 步骤 0：补齐 v1 应有可能缺失的字段（防御历史脏数据） */
  var d = defaultStateV2(), k;
  for(k in d){ if(!d.hasOwnProperty(k)) continue; if(!(k in s)) s[k] = d[k]; }
  if(!s.settings || typeof s.settings !== "object") s.settings = {dailyCount:5};
  if(!s.learned  || typeof s.learned  !== "object") s.learned  = {};
  if(!Array.isArray(s.stagesCleared)) s.stagesCleared = [];
  if(!s.redeemed || typeof s.redeemed !== "object") s.redeemed = {};
  if(!Array.isArray(s.rewards)) s.rewards = d.rewards;

  /* 步骤 1：learned → codex（已学字 = 已解锁，绝不能丢） */
  s.codex = {};
  for(var ch in s.learned){
    if(!s.learned.hasOwnProperty(ch)) continue;
    var dd = s.learned[ch];
    s.codex[ch] = { s:1, right:0, wrong:0,
                    firstAt: Date.parse(dd && dd.date) || Date.now(), masterAt:null };
  }
  var learnedN = Object.keys(s.codex).length;

  /* 步骤 2：v1 积分 → 星星 / 能量果 */
  s.starsTotal = Math.floor(s.points / 10);
  s.stars      = s.starsTotal;
  s.energy     = Math.min(999, Math.floor(s.points / 2));
  s.shards     = 0;
  s.keys       = 0;

  /* 步骤 3：v1 的 10 关制 stagesCleared → v2 的 20 关制 game.levels
     v1 第 k 关（0-based）对应 v2 的 L(2k+1) 与 L(2k+2) */
  s.game = { levels:{}, zones:[0,0,0,0], lastPlayedLevel:null, unlockedThrough:1 };
  for(var k2=0; k2<s.stagesCleared.length; k2++){
    var idx = s.stagesCleared[k2];
    if(typeof idx !== "number" || idx < 0 || idx >= 10) continue;
    var pair = ["L"+(2*idx+1), "L"+(2*idx+2)], j;
    for(j=0;j<pair.length;j++){
      var n = parseInt(pair[j].slice(1), 10);
      if(n >= 1 && n <= 20){
        s.game.levels[pair[j]] = {stars:1, cleared:true, plays:1, best:0,
                                  firstClearAt: s.updatedAt || Date.now(), migrated:true};
      }
    }
  }
  recalcZones(s);

  /* 步骤 4：v1 redeemed → coupons（老数据视为已核销，避免孩子重复领现实奖励） */
  s.coupons = [];
  for(var rid in s.redeemed){
    if(!s.redeemed.hasOwnProperty(rid)) continue;
    var rw = null;
    for(var i2=0;i2<s.rewards.length;i2++) if(s.rewards[i2].id === rid) rw = s.rewards[i2];
    s.coupons.push({ id:"mig_"+rid, rewardId:rid, name: rw ? rw.name : "已兑换奖励",
                     gotAt: s.updatedAt || Date.now(), redeemedAt: s.updatedAt || Date.now(),
                     code:"MIGRATED", migrated:true });
  }

  /* 步骤 5：宠物初始亲密度按已学字数给（老用户不该从蛋重新开始） */
  s.pet = { name:"墨墨", species:"ink",
            bond: Math.min(490, learnedN * 5),
            level: 1,
            fedToday:0, petToday:0, lastCareDate:"",
            wears:{hat:null,scarf:null,wing:null,bg:null},
            owned:[], mood:"happy", friends:[] };
  s.pet.level = bondToLevel(s.pet.bond);

  /* 步骤 6：补齐其余 v2 默认值 */
  s.chest = {opened:0, log:[]};
  s.daily = {};
  s.streak = { cur: streakV1(s), best: streakV1(s), lastDate: todayStr() };
  s.stats = { totalRight: s.quizRight || 0, totalWrong: 0, playSeconds:0, sessions:0, wrongByChar:{} };
  s.settingsNew = { dailyMinutes:20, restReminder:true, soundOn:true, fsScale:1,
                    chestPool: buildDefaultChestPool(s.rewards) };

  /* 步骤 7：v1 的 cursor / dayStart / startDate 原样保留 */

  s.version = 2;
  return normalizeV2(s);
}

function buildDefaultChestPool(rewards){
  var pool = {};
  (rewards||[]).forEach(function(r){ pool[r.id] = {inPool:true, needCoupons:1, dailyLimit:1}; });
  return pool;
}
function recalcZones(s){
  var z=[0,0,0,0], maxCleared=0, n, L;
  for(n=1;n<=20;n++){
    L = s.game.levels["L"+n];
    if(L && L.cleared){ z[Math.floor((n-1)/5)]++; if(n>maxCleared) maxCleared=n; }
  }
  s.game.zones = z;

    g += '<g class="crown" transform="translate(0,'+(-R-38)+')">'+
      '<path d="M-11 3 L-7.5 -7 L-4 0 L0 -9 L4 0 L7.5 -7 L11 3 Z" fill="none" stroke="'+c.starOut+'" stroke-width="7.5" stroke-linejoin="round"/>'+

      '<rect x="-12" y="3" width="24" height="5" rx="2.5" fill="#FFD86B" stroke="#B87400" stroke-width="2"/></g>';

  /* 触控圈：视觉 r=34 在 360px 屏只有 61px，独立放大到 r=48 → 86px（美术 §14.3）

  g += '<circle class="hit" r="48" fill="transparent"/>';

         'stroke-linecap="round" stroke-dasharray="1 22" opacity=".7"/>';
    var dx = [56,344,72,330], dy = [c.y0+70, c.y0+250, c.y0+430, c.y0+540], k;
    for(k=0;k<4;k++) o += decoSVG(c.deco, dx[k], dy[k], k%2?0.85:1.1);
    /* ⚠️ 工程修正：美术 §16.6 原写 116×30（x=-58）。实测与 k=0/k=1 节点的三星重叠——
       左列三星右缘 x≈151.3、右列三星左缘 x≈248.7，而 116 宽胶囊横跨 142–258，
       两边各压进约 9px。收窄到 92 宽（x=-46）后两侧各留 ≈2.7px 净空，几何自洽。 */
    o += '<g class="zonelabel" transform="translate(200,'+(c.y0+34)+')">'+
         '<rect x="-46" y="-17" width="92" height="30" rx="15" fill="'+(c.dark?'rgba(46,42,94,.82)':'rgba(255,255,255,.88)')+'" '+
         'stroke="'+c.line+'" stroke-width="2.5"/>'+

         'font-family="-apple-system,PingFang SC,sans-serif" fill="'+(c.dark?'#E8E3FF':'#3B2A1E')+'">'+c.name+'</text></g>';
  }
  o += bridgeSVG('wood', 700);
  o += bridgeSVG('vine', 1300);
  o += bridgeSVG('star', 1900);
  for(var i=0;i<20;i++) o += nodeSVG(i, (states&&states[i]) || {state:'locked', stars:0});

/* 节点状态由 state 派生（美术 §17.4）：全屏同时只有 1 个 available */
function currentLevel(){
  var n, L;
  for(n=1;n<=20;n++){ L = state.game.levels["L"+n]; if(!(L && L.cleared)) return n; }
  return 20;
}
function levelStates(){
  var out=[], i, n, L, cur = currentLevel();
  for(i=0;i<20;i++){
    n = i+1; L = state.game.levels["L"+n] || {};
    out.push({
      state: (L.cleared && L.stars>=3) ? 'perfect'
           : L.cleared ? 'cleared'
           : (n === cur) ? ((L.sections || 0) ? 'inProgress' : 'available')
           : 'locked',
      stars: L.stars || 0,
      sub:   L.sections || 0,
      total: 3
    });
  }
  return out;
}
function nodeAria(i, st){
  var n = i+1, txt = '第'+n+'关，'+ZONE_CFG[Math.floor(i/5)].name + '，';
  if(st.state === 'locked')        txt += '未解锁';
  else if(st.state === 'available')txt += '可挑战';
  else if(st.state === 'inProgress')txt += '进行中，已完成 '+st.sub+' 个小节';
  else                             txt += '已通关，获得 '+st.stars+' 颗星';
  if(isBoss(i)) txt += '，Boss 关';
  return txt;
}
function setHTML(el, html){
  if(!el) return;
  el.innerHTML = html;

function renderMap(){

function scrollToCurrent(){

  var p = nodePos(currentLevel()-1);

function tapNode(n){

    /* 摇晃 300ms + 气泡提示（GDD §2.4），不跳转 */

function bindMap(){

  host.addEventListener('click', function(e){

    if(!g) return;

    if(Math.abs(x-sx) > 10 || Math.abs(y-sy) > 10) clear();           /* 滚动中不算长按 */
  }
  if(!btn) return;
  if(typeof window !== "undefined" && window.PointerEvent){
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointermove', move);
    btn.addEventListener('pointerup', clear);
    btn.addEventListener('pointercancel', clear);
    btn.addEventListener('pointerleave', clear);
  } else {
    btn.addEventListener('touchstart', down, {passive:true});
    btn.addEventListener('touchmove', move, {passive:true});
    btn.addEventListener('touchend', clear);
    btn.addEventListener('touchcancel', clear);
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', clear);
    btn.addEventListener('mouseleave', clear);
  }
  /* 单击无响应：5 岁儿童不会自发长按 2s，但会乱点 */
  btn.addEventListener('click', function(e){ e.preventDefault(); clear(); });
  btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  var x = $("parentX"); if(x) x.addEventListener('click', closeParent);
  var sc = $("scrim"); if(sc) sc.addEventListener('click', closeParent);
  var fsBtns = document.querySelectorAll('[data-fs]'), i;
  for(i=0;i<fsBtns.length;i++){
    fsBtns[i].addEventListener('click', function(){
      state.settingsNew.fsScale = applyFsScale(parseFloat(this.getAttribute('data-fs')));
      syncSave();
    });
  }
  var sb = $("soundBtn");
  if(sb) sb.addEventListener('click', function(){
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', on ? 'true' : 'false');
    this.textContent = on ? '开' : '关';
    state.settingsNew.soundOn = on;
    SFX.setEnabled(on);
    syncSave();
  });
  if(typeof document !== "undefined" && document.addEventListener){
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeParent(); });
  }
}

/* ===== JS-BLOCK: LEVEL-FLOW (P1) ===== */
/* 核心循环：地图节点 → openLevel(idx) → S1 学字 → S2 小游戏 ×2 → S3 小考 → S4 演出结算。
   设计要点（GDD §3 / §9 / §4）：
   · 防挫败（§9.1）：没有任何「失败/答错」阻断屏；答错只抖动 + 高亮正确项，可重试到对为止。
   · 提示（§9.2）：用过任意提示 → 本关最高 2 星；但永远不阻断推进。
   · 三星（§3.5）：历史最大值，永不下降。
   · 货币（§4.3）：星星/碎片按关卡取历史最大补差（防刷），能量果每次都给。
   视觉沿用「棉花糖星球」令牌，不引入新配色。 */

var GENTLE = ["差一点点～","再看一眼好不好？","没关系，我们再来！","这个字有点调皮呢～","别着急，慢慢来！","快找到了！"];
var PRAISE = ["答对啦！","真棒！","太厉害了！","就是这个！","你好快呀！","完全正确！","哇哦！"];

var LV = null;   /* 当前关卡运行时状态 */

/* ---- 工具 ---- */
function rand(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rand(arr.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function lvCharHTML(ch){ return '<span class="lv-ch">'+ch.c+'</span><span class="lv-py">'+ch.py+'</span>'; }
function lvWrap(inner){ return '<div class="lv-scroll"><div class="lv-stage">'+inner+'</div></div>'; }
function bindExit(host){ var x=host.querySelector('[data-act="exit"]'); if(x) x.addEventListener('click', function(){ closeLevel(); }); }
function bindSpeak(host, txt){
  [].forEach.call(host.querySelectorAll('[data-act="speak"]'), function(el){
    el.addEventListener('click', function(e){ if(e&&e.stopPropagation) e.stopPropagation(); if(txt) speak(txt); });
  });
}

/* 本关 5 个字（i 为 0 基关卡下标）。任务约定的取字约定。 */
function levelChars(i){ return CHAR_DICT.slice(i*5, i*5+5); }
/* 当前应玩关卡的 0 基下标（= currentLevel() - 1）。 */
function currentLevelIdx(){ return Math.max(0, currentLevel()-1); }

/* ---- 纯函数：三星判定（GDD §3.5） ---- */
function computeStars(quizCorrect, quizTotal, hintsUsed, maxCombo){
  var s = 1;                                                   /* ★1：走完 S4 */
  if(quizTotal>0 && (quizCorrect/quizTotal) >= 0.8) s = 2;      /* ★2：小考首答 ≥80% */
  if(quizCorrect===quizTotal && hintsUsed===0 && maxCombo>=5) s = 3;  /* ★3 */
  return s;
}
/* ---- 纯函数：关卡通关奖励（GDD §4.3 产出表；Boss ×2；任务要求 3★ 给 🔑碎片×3） ---- */
function levelReward(stars, isBoss){
  var base = ({1:{star:1,energy:5}, 2:{star:2,energy:8}, 3:{star:3,energy:12}})[stars] || {star:1,energy:5};
  var m = isBoss ? 2 : 1;
  return { star: base.star*m, energy: base.energy*m, shard: (stars===3 ? 3*m : 0) };
}
/* ---- 纯函数：把一次通关结果写进 state（不碰 DOM，便于单测；GDD §3.5 永不下降） ---- */
function applyLevelResult(s, idx, stars, hintsUsed, maxCombo, quizCorrect, quizTotal){
  var key = "L"+(idx+1);
  var prev = (s.game && s.game.levels && s.game.levels[key]) || {};
  var newStars = Math.max(prev.stars||0, stars);               /* 历史最大，永不下降 */
  var isB = isBoss(idx);
  var rwd = levelReward(newStars, isB);
  if(!s.game) s.game = {levels:{}, zones:[0,0,0,0], lastPlayedLevel:null, unlockedThrough:1};
  if(!s.game.levels) s.game.levels = {};
  s.game.levels[key] = {
    stars: newStars, cleared:true, clearedAt: Date.now(),
    hintsUsed: hintsUsed, combo: maxCombo,
    quizCorrect: quizCorrect, quizTotal: quizTotal,
    plays: (prev.plays||0)+1, sections: 4
  };
  recalcZones(s);   /* 顺带把 unlockedThrough 推进到「最高已通关 +1」 */
  /* 防刷（GDD §4.3）：星星/碎片按关卡取历史最大补差，不重复给；能量果每次都给。
     Boss 关奖励按 GDD §4.3 整体 ×2：把「本次提升的星数差」再乘 2（普通关 ×1）。 */
  var gainedStar  = Math.max(0, newStars - (prev.stars||0)) * (isB ? 2 : 1);
  var gainedShard = (newStars===3 && (prev.stars||0) < 3) ? rwd.shard : 0;
  s.stars      = (s.stars||0)      + gainedStar;
  s.starsTotal = (s.starsTotal||0) + gainedStar;
  s.energy     = Math.min(999, (s.energy||0) + rwd.energy);
  if(gainedShard){
    s.shards = (s.shards||0) + gainedShard;
    while(s.shards >= 3){ s.shards -= 3; s.keys = (s.keys||0) + 1; }   /* 满 3 合成 1 钥匙 */
  }
  return { newStars:newStars, reward:rwd, prevStars:prev.stars||0 };
}

/* ---- 出题素材 ---- */
function buildChoicePool(idx){
  var pool = levelChars(idx);
  var adj = [];
  if(idx-1>=0) adj = adj.concat(levelChars(idx-1));
  if(idx+1<=19) adj = adj.concat(levelChars(idx+1));
  var seen = {}; pool.forEach(function(c){ seen[c.c]=1; });
  var distract = adj.filter(function(c){ return !seen[c.c]; });   /* 相邻关干扰项 */
  return { pool:pool, distract:distract };
}
/* 目标字 + 3 个其它字（优先本关，其次相邻干扰），随机排列 */
function makeChoices(target, pool, distract, n){
  var others = pool.concat(distract).filter(function(c){ return c.c !== target.c; });
  others = shuffle(others).slice(0, n-1);
  return shuffle([target].concat(others)).map(function(c){ return {ch:c, correct: c.c===target.c}; });
}

/* ============ 关卡总控 ============ */
function openLevel(idx){
  idx = idx|0;
  if(idx<0 || idx>19) return;
  var st = levelStates()[idx];
  if(st.state === 'locked'){ toast('先把上一关闯过去吧！'); return; }
  var pl = buildChoicePool(idx);
  LV = {
    idx: idx,
    chars: levelChars(idx),
    boss: isBoss(idx),
    stage: 0,
    hintsUsed: 0,
    combo: 0, maxCombo: 0,
    gameCorrect: 0, gameTotal: 0,
    quizFirstCorrect: 0, quizTotal: 5,
    learned: 0,
    pool: pl.pool, distract: pl.distract,
    gameNo: 0, qInGame: 0, games: null,
    quizIdx: 0, quizPlan: null
  };
  state.game.lastPlayedLevel = "L"+(idx+1);
  var host = $('levelHost');
  if(host){ host.classList.add('on'); host.setAttribute('aria-hidden','false'); }
  SFX.tap();
  renderS1();
}
function closeLevel(){
  var host = $('levelHost');

function renderGameQuestion(){

/* ============ S3 小考 ============ */
function qQuiz(t, type){
  if(type === 'py'){
    var others = shuffle(LV.chars.filter(function(c){ return c.c !== t.c; })).slice(0,3).map(function(c){ return c.py; });
    var allpy = shuffle([t.py].concat(others));
    return {
      stimHTML: '<div class="lv-hero">'+t.c+'</div><button class="lv-small-play" data-act="speak">🔊</button><div class="lv-listen-lab">这个字的拼音是哪个？</div>',
      stimSpeak: t.c,
      choices: allpy.map(function(p){ return {html:'<span class="lv-py-lg">'+p+'</span>', correct: (p === t.py)}; }),
      hint: function(){ speak(t.c); }
    };
  } else {
    var opts = makeChoices(t, LV.pool, LV.distract, 4);
    return {
      stimHTML: '<div class="lv-pic">'+picSVG(t.c)+'</div><button class="lv-small-play" data-act="speak">🔊</button><div class="lv-listen-lab">这个图说的是哪个字？</div>',
      stimSpeak: t.c,
      choices: opts.map(function(o){ return {html: lvCharHTML(o.ch), correct: o.correct}; }),

    };

function startS3(){
  LV.stage = 'S3';
  LV.quizIdx = 0;
  LV.quizPlan = LV.chars.map(function(c, i){ return {target:c, type: (i<3 ? 'py' : 'pic')}; });
  renderQuizQuestion();
}
function renderQuizQuestion(){
  var plan = LV.quizPlan[LV.quizIdx];
  var q = qQuiz(plan.target, plan.type);
  q.title = '小考 · 第 '+(LV.quizIdx+1)+' / 5 题';
  lvAsk(q, 'retry', function(correct, firstAttempt){
    if(correct){
      LV.combo++;
      if(firstAttempt) LV.quizFirstCorrect++;
    } else {
      LV.combo = 0;
    }
    LV.maxCombo = Math.max(LV.maxCombo, LV.combo);
    LV.quizIdx++;
    if(LV.quizIdx < LV.quizPlan.length) renderQuizQuestion();
    else finishLevel();
  });
}

/* ============ S4 演出结算 ============ */
function finishLevel(){
  LV.stage = 'S4';
  var stars = computeStars(LV.quizFirstCorrect, LV.quizTotal, LV.hintsUsed, LV.maxCombo);
  var res = applyLevelResult(state, LV.idx, stars, LV.hintsUsed, LV.maxCombo, LV.quizFirstCorrect, LV.quizTotal);

}

/* ---- 通用答题渲染 + 防挫败处理 ---- */
function highlightCorrect(q, host){

function removeOneWrong(q, host){

  for(var i=0;i<opts.length;i++){
    if(!q.choices[i].correct && !opts[i].disabled){ opts[i].classList.add('dim'); opts[i].disabled=true; break; }
  }

function revealCorrect(q, host, onResolved, firstAttempt){

}
function lvAsk(q, mode, onResolved){
  var host = $('levelHost');
  var html =
    '<header class="lv-hd">'+
      '<button class="lv-x" data-act="exit" aria-label="返回地图">✕</button>'+
      '<div class="lv-hd-t">'+q.title+'</div>'+
      '<button class="lv-hint" data-act="hint" aria-label="提示">💡 提示</button>'+
    '</header>'+
    '<div class="lv-stim">'+q.stimHTML+'</div>'+
    '<div class="lv-grid">';
  q.choices.forEach(function(c, ci){ html += '<button class="lv-opt" data-ci="'+ci+'">'+c.html+'</button>'; });
  html += '</div><div class="lv-fb" id="lvFb"></div>';
  host.innerHTML = lvWrap(html);

  var locked = false, firstAttempt = true;
  bindExit(host);
  bindSpeak(host, q.stimSpeak);
  var hintBtn = host.querySelector('[data-act="hint"]');
  if(hintBtn) hintBtn.addEventListener('click', function(){
    LV.hintsUsed++;
    if(q.hint) q.hint();
    var st = host.querySelector('.lv-stim'); if(st){ st.classList.add('lv-pulse'); setTimeout(function(){ st.classList.remove('lv-pulse'); }, 700); }
  });
  if(q.stimSpeak) setTimeout(function(){ speak(q.stimSpeak); }, 140);

  host.querySelector('.lv-grid').addEventListener('click', function(e){
    var btn = (e.target && e.target.closest) ? e.target.closest('.lv-opt') : null;
    if(!btn || btn.disabled || locked) return;
    var ci = parseInt(btn.getAttribute('data-ci'), 10);
    var c = q.choices[ci];
    if(c.correct){
      locked = true;
      btn.classList.add('correct');
      SFX.right();
      var fb = host.querySelector('#lvFb'); if(fb) fb.textContent = pick(PRAISE);
      setTimeout(function(){ onResolved(true, firstAttempt); }, 650);
    } else {
      btn.classList.add('wrong'); btn.disabled = true;
      LV.combo = 0; SFX.wrong();
      var fb2 = host.querySelector('#lvFb'); if(fb2) fb2.textContent = pick(GENTLE);
      if(mode === 'auto'){
        /* S2 小游戏：零惩罚，高亮正确项后自动进入下一题（GDD §9.1） */
        locked = true; highlightCorrect(q, host);
        setTimeout(function(){ onResolved(false, firstAttempt); }, 950);
      } else if(firstAttempt){
        /* S3 小考第 1 次错：移除一个错误项，允许再选一次 */
        firstAttempt = false; removeOneWrong(q, host);
      } else {
        /* S3 小考第 2 次错：直接演示正确答案 + 「我记住啦」 */
        locked = true; revealCorrect(q, host, onResolved, firstAttempt);
      }
    }
  });
}
