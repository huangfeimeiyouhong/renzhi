/* G3 拍字地鼠 / G4 认字小路 / G5 连线成词，接入 S2 轮换（GAME_ROTATION）。
   设计：每个新游戏自管内部循环，结束后回调 done（= nextGameOrS3）；正确性折叠进
   LV.combo / LV.maxCombo，从而与 computeStars(quizFirstCorrect, quizTotal, hintsUsed, maxCombo)
   三星契约保持一致（契约本身不变，见 P1 §3.5）。
   防挫败（GDD §9.1）：拍错/走错/连错都不惩罚、不阻断，可重试到对为止。 */

var GAME_ROTATION = [
  /*L1*/["G1","G2"],["G1","G3"],["G2","G3"],["G2","G4"],["G3","G1"],
  /*L6*/["G1","G5"],["G2","G1"],["G3","G4"],["G4","G2"],["G5","G3"],
  /*L11*/["G4","G1"],["G4","G5"],["G5","G3"],["G5","G2"],["G3","G4"],
  /*L16*/["G1","G5"],["G2","G3"],["G3","G1"],["G4","G5"],["G5","G2"]
];

var MG_TIMERS = [];
var MG_ROUTER = null;
function mgClearTimers(){
  for(var i=0;i<MG_TIMERS.length;i++){ clearTimeout(MG_TIMERS[i]); clearInterval(MG_TIMERS[i]); }
  MG_TIMERS.length = 0;
}
function mgClearHost(){
  if(MG_ROUTER){ var h=$('levelHost'); if(h) h.removeEventListener('click', MG_ROUTER); }
  MG_ROUTER = null;
}
function mgCorrect(){ LV.combo++; if(LV.combo>LV.maxCombo) LV.maxCombo=LV.combo; gainEnergy(1, null); }
function mgWrong(){ LV.combo = 0; }
/* 纯函数：给定对错序列，返回最大连击（与 mgCorrect/mgWrong 等价，供单测验证逻辑） */
function simCombo(seq){
  var combo=0, max=0;
  for(var i=0;i<seq.length;i++){ if(seq[i]){ combo++; if(combo>max) max=combo; } else combo=0; }
  return max;
}

/* 字库查找表 + 组词伙伴表（G5 用，零新增数据，运行时由 CHAR_DICT.w 推导） */
var _DICT_MAP = null;
function chObj(c){ if(!_DICT_MAP){ _DICT_MAP={}; CHAR_DICT.forEach(function(o){ _DICT_MAP[o.c]=o; }); } return _DICT_MAP[c]; }
var _COMBO = null;
function buildCombo(){
  if(_COMBO) return _COMBO;
  var inDict={}; CHAR_DICT.forEach(function(o){ inDict[o.c]=1; });
  _COMBO={};
  CHAR_DICT.forEach(function(o){
    var set={};
    (o.w||[]).forEach(function(word){
      for(var i=0;i<word.length;i++){ var p=word[i]; if(p!==o.c && inDict[p]) set[p]=1; }
    });
    _COMBO[o.c]=Object.keys(set);
  });
  return _COMBO;
}

function runMinigame(g, done){
  mgClearTimers(); mgClearHost();
  if(g.type==='g2') return mgG2(g, done);   /* G2 字图配对（记忆翻牌，自管循环） */
  if(g.type==='g3') return mgG3(g, done);
  if(g.type==='g4') return mgG4(g, done);
  if(g.type==='g5') return mgG5(g, done);
}

var DAILY_DIFF = 10;   /* P5 对齐 GDD §2.7.2：每日字灵挑战固定中档难度（≈第三区），不随 currentLevelIdx 递增（daily 时各 minigame 取此值而非 19 最难关） */

/* ---------- G3 拍字地鼠 ---------- */
/* ---------- G3 拍字地鼠（真·地鼠洞：洞固定，字从洞里冒出/缩回） ---------- */
function mgG3(g, done){
  var host = $('levelHost');
  var idx = (LV && LV.daily) ? DAILY_DIFF : currentLevelIdx();
  var maxHoles = 6;
  /* 6 个固定洞，早期冒出 3 只、中期 4 只、后期 5 只，营造"地鼠突然冒出来"的惊喜感 */
  var numMoles = idx<6 ? 3 : (idx<12 ? 4 : 5);
  var showMs   = idx<6 ? 2500 : (idx<12 ? 2200 : 1800); /* 地鼠停留时间 */
  var roundGap = 450;                                   /* 两波地鼠间隔 */
  var TOTAL = 30000;
  var queue = shuffle(LV.chars).concat(shuffle(LV.chars)).concat(shuffle(LV.chars));
  var qPos = 0, hits = 0;
  var distractorPool = LV.pool.concat(LV.distract);
  var endTime = 0, fillEl, tcharEl, tpicEl, router;
  var holes = [];
  var spawnTimer = null;
  var hideTimers = [];

  function curTarget(){ return queue[qPos % queue.length]; }
  function updateTarget(){
    var t = curTarget();
    if(tcharEl) tcharEl.textContent = t.c;
    if(tpicEl) tpicEl.innerHTML = picSVG(t.c);
    speak(t.c);
  }
  function clearRoundTimers(){
    for(var i=0;i<hideTimers.length;i++) clearTimeout(hideTimers[i]);
    hideTimers.length = 0;
    if(spawnTimer){ clearInterval(spawnTimer); spawnTimer = null; }
  }
  function clearMoles(){
    for(var i=0;i<holes.length;i++){
      var h = holes[i];
      h.classList.remove('g3-up','g3-hit','g3-wrong');
      if(!h.classList.contains('g3-down')) h.classList.add('g3-down');
      h.removeAttribute('data-ch');
    }
  }
  function spawnRound(){
    if(!holes.length) return;
    clearRoundTimers();
    clearMoles();
    var order = shuffle([0,1,2,3,4,5]);
    var chosen = order.slice(0, numMoles);
    var t = curTarget();
    var assigns = [t];
    var others = shuffle(distractorPool.filter(function(c){ return c.c !== t.c; })).slice(0, numMoles-1);
    assigns = shuffle(assigns.concat(others));
    for(var i=0;i<chosen.length;i++){
      var h = holes[chosen[i]];
      var a = assigns[i];
      var mole = h.querySelector('.g3-mole');
      h.setAttribute('data-ch', a.c);
      if(mole) mole.textContent = a.c;
      h.classList.remove('g3-down','g3-hit','g3-wrong');
      h.classList.add('g3-up');
      (function(hh){
        hideTimers.push(setTimeout(function(){
          if(hh.classList.contains('g3-up') && !hh.classList.contains('g3-hit')){
            hh.classList.remove('g3-up'); hh.classList.add('g3-down');
          }
        }, showMs));
      })(h);
    }
  }
  function nextRound(){
    updateTarget();
    spawnRound();
    spawnTimer = setInterval(spawnRound, showMs + roundGap);
  }
  function onHole(btn){
    if(!btn.classList.contains('g3-up') || btn.classList.contains('g3-hit')) return;
    var ch = btn.getAttribute('data-ch');
    if(ch === curTarget().c){
      btn.classList.add('g3-hit');
      SFX.right(); hits++; mgCorrect(); qPos++;
      clearRoundTimers();
      setTimeout(nextRound, 480);
    } else {
      btn.classList.add('g3-wrong');
      SFX.wrong(); mgWrong();
      setTimeout(function(){ btn.classList.remove('g3-wrong','g3-up'); btn.classList.add('g3-down'); }, 420);
    }
  }
  function tick(){
    var rem = endTime - Date.now();
    if(rem <= 0){ endGame(); return; }
    var pct = Math.max(0, rem/TOTAL*100);
    if(fillEl){
      fillEl.style.width = pct + '%';
      fillEl.className = 'g3-fill' + (rem<=10000?' g3-warn':'') + (rem<=5000?' g3-danger':'');
    }
  }
  function endGame(){
    clearRoundTimers(); mgClearTimers(); mgClearHost();
    var html = '<div class="lv-s4">'+
      '<div class="lv-hero" style="font-size:48px">🎉</div>'+
      '<div class="lv-hd-t" style="font-size:var(--fs-h2)">拍中 '+hits+' 个！</div>'+
      '<div class="lv-s4tip">你真棒！</div>'+
      '<button class="lv-btn" id="mgNext">继续 ➜</button></div>';
    host.innerHTML = lvWrap(html);
    SFX.clear();
    host.querySelector('#mgNext').addEventListener('click', function(){ done(); });
    speak('拍中 '+hits+' 个！');
  }
  function init(){
    var t0 = curTarget();
    var holesHtml = '';
    for(var i=0;i<maxHoles;i++){
      holesHtml += '<button class="g3-hole" data-idx="'+i+'" aria-label="地鼠洞">'+
                    '<div class="g3-mound"></div><div class="g3-mole"></div></button>';
    }
    var html =
      '<header class="lv-hd"><button class="lv-x" data-act="exit" aria-label="返回地图">✕</button>'+
        '<div class="lv-hd-t">拍字地鼠</div>'+
        '<button class="lv-hint" data-act="speak" aria-label="重听">🔊</button></header>'+
      '<div class="g3">'+
        '<div class="g3-target">'+
          '<div class="g3-pic" data-act="speak">'+picSVG(t0.c)+'</div>'+
          '<div class="g3-tchar" data-act="speak">'+t0.c+'</div>'+
          '<div class="g3-lab">拍一拍这个字！</div>'+
        '</div>'+
        '<div class="g3-holes">'+holesHtml+'</div>'+
        '<div class="g3-bar"><div class="g3-fill"></div></div>'+
      '</div>';
    host.innerHTML = lvWrap(html);
    bindExit(host);
    tcharEl = host.querySelector('.g3-tchar'); tpicEl = host.querySelector('.g3-pic');
    fillEl = host.querySelector('.g3-fill');
    holes = [].slice.call(host.querySelectorAll('.g3-hole'));
    router = function(e){
      var sp = e.target.closest && e.target.closest('[data-act="speak"]');
      if(sp){ speak(curTarget().c); return; }
      var btn = e.target.closest && e.target.closest('.g3-hole');
      if(btn) onHole(btn);
    };
    host.addEventListener('click', router); MG_ROUTER = router;
    spawnRound();
    spawnTimer = setInterval(spawnRound, showMs + roundGap);
    endTime = Date.now() + TOTAL;
    MG_TIMERS.push(setInterval(tick, 120));
    setTimeout(function(){ speak(curTarget().c); }, 260);
  }
  init();
}

/* ---------- G4 认字小路 ---------- */
function mgG4(g, done){
  var host = $('levelHost');
  var idx = (LV && LV.daily) ? DAILY_DIFF : currentLevelIdx();
  var cols = idx<8 ? 3 : (idx<14 ? 4 : 5);
  var rows = idx<8 ? 4 : (idx<14 ? 5 : 5);
  var steps = idx<8 ? 5 : (idx<14 ? 7 : 9);
  var total = cols*rows;
  function neighbors(cell){
    var r = Math.floor(cell/cols), c = cell%cols, out=[];
    if(r>0) out.push(cell-cols); if(r<rows-1) out.push(cell+cols);
    if(c>0) out.push(cell-1); if(c<cols-1) out.push(cell+1);
    return out;
  }
  function genPath(){
    for(var attempt=0; attempt<300; attempt++){
      var visited={}, path=[], start=rand(total);
      path.push(start); visited[start]=1; var ok=true;
      for(var s=0;s<steps;s++){
        var nb = neighbors(path[path.length-1]).filter(function(n){ return !visited[n]; });
        if(!nb.length){ ok=false; break; }
        var nx = nb[rand(nb.length)]; path.push(nx); visited[nx]=1;
      }
      if(ok && path.length===steps+1) return path;
    }
    /* 兜底：蛇形遍历，保证路径全程相邻（极少触发） */
    var p=[], dir=1;
    for(var rr=0; rr<rows && p.length<=steps; rr++){
      if(dir>0){ for(c=0;c<cols && p.length<=steps;c++) p.push(rr*cols+c); }
      else { for(c=cols-1;c>=0 && p.length<=steps;c--) p.push(rr*cols+c); }
      dir=-dir;
    }
    return p;
  }
  var path = genPath();
  var pathCh={}, used={}; path.forEach(function(c){ used[c]=1; });
  /* 路径上每个字必须唯一，否则"走到『竹』"会出现两个竹，孩子点最近那个不一定是目标。 */
  var distractorPool = LV.pool.concat(LV.distract);
  var usedChars = {};
  for(var i=0;i<path.length;i++){
    var ch;
    if(i < LV.chars.length){
      ch = LV.chars[i];
    } else {
      var cand = shuffle(distractorPool.filter(function(c){ return !usedChars[c.c]; }));
      ch = cand[0] || distractorPool.filter(function(c){ return !usedChars[c.c]; })[0] || LV.pool[0];
    }
    usedChars[ch.c] = 1;
    pathCh[path[i]] = ch;
  }
  var gridCh={};
  for(var cell=0; cell<total; cell++){
    if(used[cell]) continue;
    var adj = neighbors(cell).filter(function(n){ return used[n]; });
    var bad={}; adj.forEach(function(n){ if(pathCh[n]) bad[pathCh[n].c]=1; });
    var cand = shuffle(distractorPool.filter(function(c){ return !bad[c.c]; }));
    gridCh[cell] = cand[0] || LV.pool[0];
  }
  var cur = path[0], step = 0, hintTimer = null, router;
  /* 返回"下一步要走的相邻格子"对应的字；已到终点时返回 null（不再调用 .c 以免崩溃）。 */
  function targetCh(){ var ni = path[step+1]; return (ni==null) ? null : pathCh[ni]; }
  function render(){
    var cellHTML='';
    for(var c=0; c<total; c++){
      var isPath = used[c], ch = isPath ? pathCh[c] : gridCh[c];
      var cls = 'g4-cell' + (isPath?' path':'');
      if(c===path[0]) cls+=' start';
      if(c===cur) cls+=' cur';
      /* 🎯 永远标在当前"下一步相邻目标"上，保证一定在可点击的周边格，不会乱指到终点。 */
      var isTarget = (step < path.length-1) && (c===path[step+1]);
      var mark = ch ? ch.c : '';
      var badge = (c===path[0]) ? '<span class="g4-badge">🏁</span>'
                : isTarget ? '<span class="g4-badge tgt">🎯</span>'
                : '';
      cellHTML += '<button class="'+cls+'" data-cell="'+c+'">'+badge+mark+'</button>';
    }
    var tgt = targetCh();
    var html =
      '<header class="lv-hd"><button class="lv-x" data-act="exit" aria-label="返回地图">✕</button>'+
        '<div class="lv-hd-t">认字小路</div><div style="width:64px"></div></header>'+
      '<div class="g4">'+
        '<div class="g4-lab">'+(tgt ? '走到「<span class="g4-tgt">'+tgt.c+'</span>」' : '到达终点！')+'</div>'+
        '<div class="g4-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+cellHTML+'</div>'+
      '</div>';
    host.innerHTML = lvWrap(html);
    bindExit(host); attachRouter(); resetHint();
    if(step>=path.length-1) win();
  }
  function onTap(cell){
    if(step>=path.length-1) return;
    var next = path[step+1];
    if(cell===next){
      cur=next; step++; mgCorrect(); SFX.right(); speak(targetCh()?targetCh().c:'');
      render();
    } else {
      var el = host.querySelector('[data-cell="'+cell+'"]');
      if(el){ el.classList.add('g4-shake'); setTimeout(function(){ if(el) el.classList.remove('g4-shake'); }, 420); }
      SFX.wrong(); mgWrong();
    }
  }
  function attachRouter(){
    if(MG_ROUTER) host.removeEventListener('click', MG_ROUTER);
    router = function(e){
      var ex = e.target.closest && e.target.closest('[data-act="exit"]'); if(ex) return;
      var ce = e.target.closest && e.target.closest('.g4-cell');
      if(ce) onTap(parseInt(ce.getAttribute('data-cell'),10));
    };
    host.addEventListener('click', router); MG_ROUTER = router;
  }
  function resetHint(){
    if(hintTimer){ clearTimeout(hintTimer); hintTimer=null; }
    var prev = host.querySelector('.g4-cell.hint'); if(prev) prev.classList.remove('hint');
    hintTimer = setTimeout(function(){
      var el = host.querySelector('[data-cell="'+path[step+1]+'"]'); if(el) el.classList.add('g4-hint');
    }, 12000);
    MG_TIMERS.push(hintTimer);
  }
  function win(){
    mgClearTimers(); mgClearHost();
    var html = '<div class="lv-s4"><div class="lv-hero" style="font-size:48px">🎯</div>'+
      '<div class="lv-hd-t" style="font-size:var(--fs-h2)">到达终点！</div>'+
      '<div class="lv-s4tip">你认字小路走得真稳！</div>'+
      '<button class="lv-btn" id="mgNext">继续 ➜</button></div>';
    host.innerHTML = lvWrap(html); SFX.clear();
    host.querySelector('#mgNext').addEventListener('click', function(){ done(); });
    speak('到达终点！');
  }
  render();
}

/* ---------- G5 连线成词 ---------- */
function mgG5(g, done){
  var host = $('levelHost');
  var idx = (LV && LV.daily) ? DAILY_DIFF : currentLevelIdx();
  var qCount = idx<8 ? 4 : (idx<14 ? 5 : 6);
  var COMBO = buildCombo();
  var valid = LV.chars.filter(function(c){
    var ps = (COMBO[c.c]||[]).filter(function(p){ return chObj(p); });
    return ps.length>0;
  });
  if(valid.length < qCount){
    for(var di=0; di<CHAR_DICT.length && valid.length<qCount; di++){
      var o = CHAR_DICT[di];
      var ps2 = (COMBO[o.c]||[]).filter(function(p){ return chObj(p); });
      if(ps2.length>0 && !valid.some(function(v){ return v.c===o.c; })) valid.push(o);
    }
  }
  qCount = Math.min(qCount, valid.length);
  if(qCount===0){ done(); return; }
  valid = shuffle(valid).slice(0, qCount);
  var qi = 0, router, curTargetChar=null, curCorrect=null, curCands=null;
  function buildQuestion(){
    curTargetChar = valid[qi];
    var partners = (COMBO[curTargetChar.c]||[]).filter(function(p){ return chObj(p); });
    curCorrect = chObj(pick(partners));
    var comboSet={}; (COMBO[curTargetChar.c]||[]).forEach(function(p){ comboSet[p]=1; });
    var distPool = LV.pool.concat(LV.distract).filter(function(c){ return c.c!==curTargetChar.c && c.c!==curCorrect.c && !comboSet[c.c]; });
    var distract = shuffle(distPool).slice(0, Math.max(2, 5-1));
    var cands = shuffle([curCorrect].concat(distract));
    cands.forEach(function(c){ c.gone=false; }); curCands = cands;
    var html =
      '<header class="lv-hd"><button class="lv-x" data-act="exit" aria-label="返回地图">✕</button>'+
        '<div class="lv-hd-t">连线成词</div><div style="width:64px"></div></header>'+
      '<div class="g5">'+
        '<div class="g5-lab">和「'+curTargetChar.c+'」组词的是哪个字？</div>'+
        '<div class="g5-top">'+
          '<div class="g5-left" data-act="speak">'+picSVG(curTargetChar.c)+'<div class="lv-hero g5-tc">'+curTargetChar.c+'</div></div>'+
          '<div class="g5-mid"><div class="g5-line"></div></div>'+
          '<div class="g5-right" id="g5Word"><span class="g5-ph">？</span></div>'+
        '</div>'+
        '<div class="g5-cands">'+
          cands.map(function(c,ci){ return '<button class="g5-cand" data-ci="'+ci+'" data-ch="'+c.c+'"><span class="lv-ch">'+c.c+'</span></button>'; }).join('')+
        '</div>'+
        '<div class="g5-fb" id="g5fb"></div>'+
      '</div>';
    host.innerHTML = lvWrap(html);
    bindExit(host); attachRouter(); bindSpeak(host, curTargetChar.c);
    speak(curTargetChar.c);
  }
  function onCand(ci){
    var c = curCands[ci];
    if(!c || c.gone) return;
    if(c.c === curCorrect.c){
      c.gone = true;
      var btn = host.querySelector('[data-ci="'+ci+'"]'); if(btn) btn.classList.add('picked');
      SFX.right(); mgCorrect();
      var word = host.querySelector('#g5Word');
      if(word) word.innerHTML = '<span class="lv-ch">'+curTargetChar.c+'</span><span class="lv-ch">'+curCorrect.c+'</span>';
      speak(curTargetChar.c + curCorrect.c);
      qi++;
      setTimeout(function(){ if(qi>=qCount) finish(); else buildQuestion(); }, 720);
    } else {
      c.gone = true;
      var b2 = host.querySelector('[data-ci="'+ci+'"]'); if(b2){ b2.classList.add('gone'); b2.disabled=true; }
      SFX.wrong(); mgWrong();
      var fb = host.querySelector('#g5fb'); if(fb) fb.textContent = pick(GENTLE);
    }
  }
  function attachRouter(){
    if(MG_ROUTER) host.removeEventListener('click', MG_ROUTER);
    router = function(e){
      var ex = e.target.closest && e.target.closest('[data-act="exit"]'); if(ex) return;
      var ce = e.target.closest && e.target.closest('.g5-cand');
      if(ce && !ce.disabled) onCand(parseInt(ce.getAttribute('data-ci'),10));
    };
    host.addEventListener('click', router); MG_ROUTER = router;
  }
  function finish(){
    mgClearTimers(); mgClearHost();
    var html = '<div class="lv-s4"><div class="lv-hero" style="font-size:48px">🔗</div>'+
      '<div class="lv-hd-t" style="font-size:var(--fs-h2)">连成 '+qCount+' 个词！</div>'+
      '<div class="lv-s4tip">你认识好多词啦！</div>'+
      '<button class="lv-btn" id="mgNext">继续 ➜</button></div>';
    host.innerHTML = lvWrap(html); SFX.clear();
    host.querySelector('#mgNext').addEventListener('click', function(){ done(); });
    speak('连成 '+qCount+' 个词！');
  }
  buildQuestion();
}

/* ---------- G2 字图配对（记忆翻牌） ---------- */
/* GDD §7.2：N 组卡牌背面朝上，点两张 → 图卡与字卡匹配则定格(绿框)+消除计分，
   不匹配则翻回（600ms 记忆窗口，纯靠运气也能看清楚，5 岁记忆窗口短）。全部消完过关。
   防挫败：无倒计时、不匹配不惩罚只翻回（与 G3/G4/G5 一致，GDD §9.1）。
   难度：按 (LV.daily ? DAILY_DIFF : currentLevelIdx) 取 4/6/8 组，但受本关可用字数(= min(LV.chars, LV.pool 去重))上限约束。 */
function mgG2(g, done){
  var host = $('levelHost');
  var idx = (LV && LV.daily) ? DAILY_DIFF : currentLevelIdx();
  var wantPairs = idx<8 ? 4 : (idx<14 ? 6 : 8);
  /* 候选字：本关 5 字优先，不足从已学字池补，去重后取 wantPairs 个 */
  var cand = [], seenC = {};
  function pushChar(ch){ if(ch && ch.c && !seenC[ch.c]){ seenC[ch.c]=1; cand.push(ch); } }
  (LV.chars||[]).forEach(pushChar);
  (LV.pool||[]).forEach(pushChar);
  cand = shuffle(cand).slice(0, wantPairs);
  if(cand.length < 2){ done(); return; }   /* 极端兜底：字不够成不了对，优雅跳过 */
  var pairs = cand.length;
  /* 每组一张图卡 + 一张字卡，全部打乱铺到网格（真正的记忆翻牌） */
  var cards = [];
  cand.forEach(function(ch){
    cards.push({kind:'pic',  ch:ch, matched:false});
    cards.push({kind:'char', ch:ch, matched:false});
  });
  cards = shuffle(cards);
  var cols = 4;   /* 2 行 / 3 行 / 4 行，均为 4 列 */
  var flipped = [], matchedCount = 0, busy = false, router;
  function cardHTML(c, i){
    var cls = 'g2-card', front;
    if(c.matched) cls += ' matched';
    else if(flipped.indexOf(i) >= 0) cls += ' flipped';
    if(c.kind==='pic') front = '<div class="g2-front g2-pic">'+picSVG(c.ch.c)+'</div>';
    else front = '<div class="g2-front g2-char">'+c.ch.c+'</div>';
    return '<button class="'+cls+'" data-ci="'+i+'" aria-label="卡片">'+
      '<div class="g2-inner">'+front+'<div class="g2-face g2-back"><span class="g2-q">?</span></div></div></button>';
  }
  function render(){
    var html =
      '<header class="lv-hd"><button class="lv-x" data-act="exit" aria-label="返回地图">✕</button>'+
        '<div class="lv-hd-t">字图配对</div><div style="width:64px"></div></header>'+
      '<div class="g2">'+
        '<div class="g2-lab">翻开两张，找出「图」和「字」是一对的好朋友！</div>'+
        '<div class="g2-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+
          cards.map(cardHTML).join('')+
        '</div>'+
      '</div>';
    host.innerHTML = lvWrap(html);
    bindExit(host); attachRouter();
  }
  function onCard(i){
    if(busy) return;
    var c = cards[i];
    if(!c || c.matched) return;
    if(flipped.indexOf(i) >= 0) return;   /* 已翻开的不再翻 */
    flipped.push(i);
    var btn = host.querySelector('[data-ci="'+i+'"]');
    if(btn) btn.classList.add('flipped');
    if(flipped.length < 2) return;
    busy = true;
    var a = cards[flipped[0]], b = cards[flipped[1]];
    var ba = host.querySelector('[data-ci="'+flipped[0]+'"]');
    var bb = host.querySelector('[data-ci="'+flipped[1]+'"]');
    if(a.ch.c === b.ch.c && a.kind !== b.kind){
      a.matched = b.matched = true;
      mgCorrect(); SFX.right(); speak(a.ch.c);
      if(ba) ba.classList.add('matched');
      if(bb) bb.classList.add('matched');
      flipped = []; matchedCount++;
      if(matchedCount >= pairs){ setTimeout(win, 480); }
      else { busy = false; }
    } else {
      [ba,bb].forEach(function(el){ if(el) el.classList.add('mismatch'); });
      SFX.wrong(); mgWrong();
      setTimeout(function(){
        flipped.forEach(function(fi){
          var el = host.querySelector('[data-ci="'+fi+'"]');
          if(el) el.classList.remove('flipped','mismatch');
        });
        flipped = []; busy = false;
      }, 600);
    }
  }
  function attachRouter(){
    if(MG_ROUTER) host.removeEventListener('click', MG_ROUTER);
    router = function(e){
      var ex = e.target.closest && e.target.closest('[data-act="exit"]'); if(ex) return;
      var ce = e.target.closest && e.target.closest('.g2-card');
      if(ce) onCard(parseInt(ce.getAttribute('data-ci'),10));
    };
    host.addEventListener('click', router); MG_ROUTER = router;
  }
  function win(){
    mgClearTimers(); mgClearHost();
    gainEnergy(3, null);   /* GDD §7.2：全部完成追加 🍎+3 */
    var html = '<div class="lv-s4"><div class="lv-hero" style="font-size:48px">🎴</div>'+
      '<div class="lv-hd-t" style="font-size:var(--fs-h2)">全部配对成功！</div>'+
      '<div class="lv-s4tip">你的记性真好！</div>'+
      '<button class="lv-btn" id="mgNext">继续 ➜</button></div>';
    host.innerHTML = lvWrap(html); SFX.clear();
    host.querySelector('#mgNext').addEventListener('click', function(){ done(); });
    speak('全部配对成功！');
  }
  render();
}

/* ===== JS-BLOCK: CHEST (P3) ===== */
/* 宝箱小屋 + 金色奖券（GDD §4.6 / 美术 §19）。复用既有 state.coupons 作为奖券列表
   （GDD §4.6 的奖券对象即 coupons 元素），不另增 state.chests，以免与既有迁移/normalize 冲突。 */
var P3_REWARDS = [
  {id:'r1', name:'去公园玩一次'},
  {id:'r2', name:'多讲一个睡前故事'},
  {id:'r3', name:'买一本喜欢的绘本'}
];
function chestRewardPool(s){
  var pool = (s && s.settingsNew && s.settingsNew.chestPool) || {};
  var arr = Object.keys(pool).map(function(k){ return pool[k]; });
  return arr.length ? arr : null;
}
function couponCode(rewardId, ts){
  var b = "ACDEFGHJKLMNPQRTUVWXY3479";
  var h = (rewardId.charCodeAt(rewardId.length-1)*7919 + ts) >>> 0;
  var s = "";
  for(var i=0;i<4;i++){ s += b[h%24]; h = Math.floor(h/24) ^ (h*7>>>0); h >>>= 0; }
  return "SZ-" + s;
}
function fmtDate(ts){
  var d = new Date(ts||Date.now());
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
/* 纯逻辑：扣 1 钥匙、生成奖券并入 coupons。无 DOM，便于单测（vm 沙箱）。 */
function doOpenChest(s){
  if(!s || s.keys < 1) return {ok:false};
  s.keys -= 1;
  var pool = chestRewardPool(s) || P3_REWARDS;
  var rw = pick(pool);
  var gotAt = Date.now();
  var code = couponCode(rw.id, gotAt);
  var ticket = { id:'c_'+gotAt+'_'+rand(99), rewardId:rw.id, name:rw.name, gotAt:gotAt, code:code, used:false, usedAt:null };
  s.coupons = s.coupons || [];
  s.coupons.push(ticket);
  s.chest = s.chest || {opened:0, log:[]};
  s.chest.opened = (s.chest.opened||0) + 1;
  return {ok:true, ticket:ticket};
}
function chestHTML(tier){

  var arcs='', a;

    arcs += '<path d="M'+(26-off)+' '+(42-off)+' a'+(26-off)+' '+(26-off)+' 0 0 1 '+(48+off*2)+' 0" fill="none" stroke="'+T.lock+'" stroke-width="'+(4-a*0.8).toFixed(1)+'" opacity="'+(0.8-a*0.18).toFixed(2)+'"/>';
  }
  return ''+

    '<div class="c-beam"></div><div class="c-glow"></div>'+

      '<defs><linearGradient id="cbG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+T.b1+'"/><stop offset="1" stop-color="'+T.b2+'"/></linearGradient></defs>'+
      '<path d="M10 8 h80 v40 a8 8 0 0 1 -8 8 H18 a8 8 0 0 1 -8 -8 Z" fill="url(#cbG)" stroke="'+T.line+'" stroke-width="3.5" stroke-linejoin="round"/>'+
      '<rect x="6" y="2" width="88" height="14" rx="7" fill="'+T.band+'" stroke="'+T.line+'" stroke-width="3.5"/>'+
      '<rect x="44" y="10" width="12" height="24" rx="4" fill="'+T.lock+'" stroke="#B87400" stroke-width="2.5"/>'+
      '<circle cx="50" cy="21" r="3" fill="'+T.line+'"/>'+
      (T.gem?'<circle cx="26" cy="34" r="5" fill="'+T.gem+'" stroke="#FFFFFF" stroke-width="2"/><circle cx="74" cy="34" r="5" fill="'+T.gem+'" stroke="#FFFFFF" stroke-width="2"/>':'')+
    '</svg></div>'+
    '<div class="c-lid"><svg viewBox="0 0 100 46" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
      '<defs><linearGradient id="clG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+T.b1+'"/><stop offset="1" stop-color="'+T.b2+'"/></linearGradient></defs>'+
      '<path d="M10 44 a40 34 0 0 1 80 0 Z" fill="url(#clG)" stroke="'+T.line+'" stroke-width="3.5" stroke-linejoin="round"/>'+ arcs +
    '</svg></div>'+
    '<div class="c-prize"></div><div class="c-sparks"></div>'+

}
function ticketHTML(t){

function renderChest(){

    '</div>';
  setHTML(host, html);

function openChest(){

/* 核心循环：地图节点 → openLevel(idx) → S1 学字 → S2 小游戏 ×2 → S3 小考 → S4 演出结算。
   设计要点（GDD §3 / §9 / §4）：
   · 防挫败（§9.1）：没有任何「失败/答错」阻断屏；答错只抖动 + 高亮正确项，可重试到对为止。
   · 提示（§9.2）：用过任意提示 → 本关最高 2 星；但永远不阻断推进。
   · 三星（§3.5）：历史最大值，永不下降。
   · 货币（§4.3）：星星/碎片按关卡取历史最大补差（防刷），能量果每次都给。
   视觉沿用「棉花糖星球」令牌，不引入新配色。 */

var PRAISE = ["答对啦！","真棒！","太厉害了！","就是这个！","你好快呀！","完全正确！","哇哦！"];

var LV = null;   /* 当前关卡运行时状态 */

/* ---- 工具 ---- */
function rand(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rand(arr.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* 本关 5 个字（i 为 0 基关卡下标）。任务约定的取字约定。 */
function levelChars(i){ return CHAR_DICT.slice(i*5, i*5+5); }
/* 当前应玩关卡的 0 基下标（= currentLevel() - 1）。 */
function currentLevelIdx(){ return Math.max(0, currentLevel()-1); }

/* ---- P5 · 每日挑战出题池：已学字 + 遗忘权重（GDD §7.6 / §2.7.2） ---- */
/* 已通关关卡的字才算「已学」；带上所属关卡记录，供权重计算取星数/通关时间 */
function learnedPool(s){
  s = s || state;
  var out = [], n, i, L, chs;
  for(n=1;n<=20;n++){
    L = (s.game && s.game.levels && s.game.levels["L"+n]) || {};
    if(!L.cleared) continue;
    chs = levelChars(n-1);
    for(i=0;i<chs.length;i++) out.push({ ch:chs[i], lv:n, L:L });
  }
  return out;
}
/* 权重：星少 / 错得多 / 久未复习 → 权重高；已掌握（codex s=2）额外加权（GDD：间隔复习） */
function charWeight(item, s, now){
  s = s || state; now = now || Date.now();
  var w = 1;
  w += (3 - Math.min(3, item.L.stars||0)) * 1.5;
  var wrong = (s.stats && s.stats.wrongByChar && s.stats.wrongByChar[item.ch.c]) || 0;
  w += Math.min(6, wrong) * 1.2;
  var days = item.L.clearedAt ? Math.floor((now - item.L.clearedAt)/86400000) : 0;
  w += Math.min(7, days) * 0.5;
  if(s.codex && s.codex[item.ch.c] && s.codex[item.ch.c].s === 2) w *= 1.4;
  return w;
}
/* 加权不重复抽样 k 个 */
function weightedPickN(items, k, s, now){
  var pool = items.slice(), out = [], i, total, r, acc;
  while(out.length < k && pool.length){
    total = 0;
    for(i=0;i<pool.length;i++) total += charWeight(pool[i], s, now);
    r = Math.random()*total; acc = 0;
    for(i=0;i<pool.length;i++){ acc += charWeight(pool[i], s, now); if(r <= acc) break; }
    if(i >= pool.length) i = pool.length-1;
    out.push(pool[i].ch);
    pool.splice(i,1);
  }
  return out;
}
function dailyChars(s, now){
  var items = learnedPool(s);
  if(!items.length) return [];
  return weightedPickN(items, Math.min(3, items.length), s, now);
}
/* P5：错题/对题按字累计（append-only），喂给遗忘权重 */
function ensureStats(s){
  if(!s.stats) s.stats = {totalRight:0,totalWrong:0,playSeconds:0,sessions:0,wrongByChar:{}};
  if(!s.stats.wrongByChar) s.stats.wrongByChar = {};
  return s.stats;
}
function noteWrong(s, c){
  if(!s) return; var st = ensureStats(s);
  st.totalWrong = (st.totalWrong||0)+1;
  if(c) st.wrongByChar[c] = (st.wrongByChar[c]||0)+1;
}
function noteRight(s, c){
  if(!s) return; var st = ensureStats(s);
  st.totalRight = (st.totalRight||0)+1;
  if(c && s.codex && s.codex[c]) s.codex[c].right = (s.codex[c].right||0)+1;
}
/* P5：退出关卡时把已完成小节数落盘，地图节点显示 inProgress，下次可续（GDD §9.5 第 2 条）。
   小节口径与 levelStates() 的 total=3 对齐：S1 学完 5 字算 1，S2 两个小游戏各算 ~0.5，S3 进小考算 3。 */
function stageProgress(lv){
  if(!lv) return 0;
  if(lv.stage === 'S4') return 4;
  if(lv.stage === 'S3') return 3;
  if(lv.stage === 'S2') return (lv.gameNo >= 1) ? 2 : 1;
  return (lv.learned >= 5) ? 1 : 0;   /* S1 */
}
function saveSectionProgress(s, lv){
  if(!s || !lv || lv.daily) return 0;          /* 每日挑战不写关卡进度 */
  var key = "L"+(lv.idx+1);
  if(!s.game) return 0;
  if(!s.game.levels) s.game.levels = {};
  var prev = s.game.levels[key] || {};
  if(prev.cleared) return prev.sections || 4;  /* 已通关的不回退（GDD §9.5 第 3 条：永不降低） */
  var n = Math.max(prev.sections||0, stageProgress(lv));   /* 只增不减 */
  s.game.levels[key] = {
    stars: prev.stars||0, cleared:false, clearedAt: prev.clearedAt||null,
    hintsUsed: lv.hintsUsed||0, combo: lv.maxCombo||0,
    quizCorrect: prev.quizCorrect||0, quizTotal: prev.quizTotal||0,
    plays: prev.plays||0, sections: n
  };
  return n;
}

/* ---- 纯函数：三星判定（GDD §3.5） ---- */
function computeStars(quizCorrect, quizTotal, hintsUsed, maxCombo){
  var s = 1;                                                   /* ★1：走完 S4 */
  if(quizTotal>0 && (quizCorrect/quizTotal) >= 0.8) s = 2;      /* ★2：小考首答 ≥80% */
  if(quizCorrect===quizTotal && hintsUsed===0 && maxCombo>=5) s = 3;  /* ★3 */
  return s;
}
/* ---- 纯函数：关卡通关奖励（GDD §4.3 产出表；Boss ×2；任务要求 3★ 给 🔑碎片×3） ---- */
function levelReward(stars, isBoss){
  var base = ({1:{star:1,energy:5}, 2:{star:2,energy:8}, 3:{star:3,energy:12}})[stars] || {star:1,energy:5};
  var m = isBoss ? 2 : 1;
  return { star: base.star*m, energy: base.energy*m, shard: (stars===3 ? 3*m : 0) };
}
/* ---- 纯函数：把一次通关结果写进 state（不碰 DOM，便于单测；GDD §3.5 永不下降） ---- */
function applyLevelResult(s, idx, stars, hintsUsed, maxCombo, quizCorrect, quizTotal){
  var key = "L"+(idx+1);
  var prev = (s.game && s.game.levels && s.game.levels[key]) || {};
  var newStars = Math.max(prev.stars||0, stars);               /* 历史最大，永不下降 */
  var isB = isBoss(idx);
  var rwd = levelReward(newStars, isB);
  if(!s.game) s.game = {levels:{}, zones:[0,0,0,0], lastPlayedLevel:null, unlockedThrough:1};
  if(!s.game.levels) s.game.levels = {};
  s.game.levels[key] = {
    stars: newStars, cleared:true, clearedAt: Date.now(),
    hintsUsed: hintsUsed, combo: maxCombo,
    quizCorrect: quizCorrect, quizTotal: quizTotal,
    plays: (prev.plays||0)+1, sections: 4
  };
  /* P5：通关即把本关 5 字写进图鉴（append-only，s 只升不降）。
     s=1 已学 / s=2 已掌握（≥2★ 视为掌握），供每日挑战遗忘权重取数（GDD §7.6） */
  if(!s.codex) s.codex = {};
  var lvChars = levelChars(idx), ci2, cc, ce;
  for(ci2=0; ci2<lvChars.length; ci2++){
    cc = lvChars[ci2].c;
    ce = s.codex[cc] || { s:0, right:0, wrong:0, firstAt:Date.now(), masterAt:null };
    ce.s = Math.max(ce.s||0, newStars>=2 ? 2 : 1);
    if(ce.s===2 && !ce.masterAt) ce.masterAt = Date.now();
    if(!ce.firstAt) ce.firstAt = Date.now();
    s.codex[cc] = ce;
  }
  recalcZones(s);   /* 顺带把 unlockedThrough 推进到「最高已通关 +1」 */
  /* 防刷（GDD §4.3）：星星/碎片按关卡取历史最大补差，不重复给；能量果每次都给。
     Boss 关奖励按 GDD §4.3 整体 ×2：把「本次提升的星数差」再乘 2（普通关 ×1）。 */
  var gainedStar  = Math.max(0, newStars - (prev.stars||0)) * (isB ? 2 : 1);
  var gainedShard = (newStars===3 && (prev.stars||0) < 3) ? rwd.shard : 0;
  s.stars      = (s.stars||0)      + gainedStar;
  s.starsTotal = (s.starsTotal||0) + gainedStar;
  s.energy     = Math.min(999, (s.energy||0) + rwd.energy);
  if(gainedShard){
    s.shards = (s.shards||0) + gainedShard;
    while(s.shards >= 3){ s.shards -= 3; s.keys = (s.keys||0) + 1; }   /* 满 3 合成 1 钥匙 */
  }
  return { newStars:newStars, reward:rwd, prevStars:prev.stars||0 };
}

/* ---- 出题素材 ---- */
function buildChoicePool(idx){
  var pool = levelChars(idx);
  var adj = [];
  if(idx-1>=0) adj = adj.concat(levelChars(idx-1));
  if(idx+1<=19) adj = adj.concat(levelChars(idx+1));
  var seen = {}; pool.forEach(function(c){ seen[c.c]=1; });
  var distract = adj.filter(function(c){ return !seen[c.c]; });   /* 相邻关干扰项 */
  return { pool:pool, distract:distract };
}
/* 目标字 + 3 个其它字（优先本关，其次相邻干扰），随机排列 */
function makeChoices(target, pool, distract, n){
  var others = pool.concat(distract).filter(function(c){ return c.c !== target.c; });
  others = shuffle(others).slice(0, n-1);
  return shuffle([target].concat(others)).map(function(c){ return {ch:c, correct: c.c===target.c}; });
}

/* ============ 关卡总控 ============ */
function openLevel(idx){
  idx = idx|0;
  if(idx<0 || idx>19) return;
  var st = levelStates()[idx];
  if(st.state === 'locked'){ toast('先把上一关闯过去吧！'); return; }
  var pl = buildChoicePool(idx);
  LV = {
    idx: idx,
    chars: levelChars(idx),
    boss: isBoss(idx),
    stage: 0,
    hintsUsed: 0,
    combo: 0, maxCombo: 0,
    gameCorrect: 0, gameTotal: 0,
    quizFirstCorrect: 0, quizTotal: 5,
    learned: 0,
    pool: pl.pool, distract: pl.distract,
    gameNo: 0, qInGame: 0, games: null,
    quizIdx: 0, quizPlan: null
  };
  state.game.lastPlayedLevel = "L"+(idx+1);
  var host = $('levelHost');
  if(host){ host.classList.add('on'); host.setAttribute('aria-hidden','false'); }
  SFX.tap();
  renderS1();
}
function closeLevel(){
  mgClearTimers(); mgClearHost();   /* P3：清掉小游戏可能遗留的计时器/点击路由 */
  var host = $('levelHost');
  if(host){ host.classList.remove('on'); host.setAttribute('aria-hidden','true'); host.innerHTML=''; }
  LV = null;
  renderMap(); renderHUD(); save();
  showPage('page-map');
}

/* ============ 每日字灵挑战（GDD §2.7.2） ============ */
/* 复用关卡流水线，但跳过 S1 学字（复习不是学新字），走「2 个不同小游戏承载 3 题 → 结算」。
   题量 3 题、玩法随机 2 个不同小游戏、固定难度、时长 ≈2min。 */
function startDaily(){
  var chars = dailyChars(state);
  if(!chars || chars.length < 1){ toast('还没有学过的字，先去闯关吧！'); return; }
  /* 干扰项：全部已学字（非相邻关），保证 4 选 1 成立 */
  var allLearned = learnedPool(state).map(function(it){ return it.ch; });
  var seen = {}; chars.forEach(function(c){ seen[c.c]=1; });
  var distract = shuffle(allLearned.filter(function(c){ return !seen[c.c]; }));
  /* 2 个不同小游戏，承载 3 题（2+1）。TTS 不可用时按 GDD §9.5 第 6 条：G1 听音类自动替换为 G2 字图配对（保证在场），另一游戏从 G3/G4/G5 随机 */
  var games;
  if(!ttsOK()){
    var rest = shuffle(['G3','G4','G5']).slice(0,1);
    games = shuffle(['G2'].concat(rest)).map(function(t){ return t.toLowerCase(); });
  } else {
    games = shuffle(['G1','G2','G3','G4','G5']).slice(0,2).map(function(t){ return t.toLowerCase(); });
  }
  LV = {
    idx: -1, daily: true,
    chars: chars,
    boss: false,
    stage: 0, hintsUsed: 0, combo: 0, maxCombo: 0,
    gameCorrect: 0, gameTotal: 3, quizFirstCorrect: 0, quizTotal: 3,
    learned: 5,            /* 跳过 S1 */
    gameNo: 0, qInGame: 0,
    pool: chars.slice(), distract: distract,
    games: [
      {type: games[0], targets: chars.slice(0,2)},
      {type: games[1], targets: chars.slice(2,3)}
    ],
    quizIdx: 0, quizPlan: null
  };
  var host = $('levelHost');
  if(host){ host.classList.add('on'); host.setAttribute('aria-hidden','false'); }
  SFX.tap();
  renderGameIntro(0);
}
/* P5 · 每日挑战产出（GDD §2.7.2）：⭐+1 / 🍎+15 / 亲密度+5。
   关键裁决：每日挑战的 ⭐ 不受 §4.3 防刷补差规则限制 —— 它是新关卡 L21 不是重玩，
   这是终局后唯一的星星来源，走补差就彻底断流。 */
function applyDailyResult(s){
  if(!s) return null;
  var t = todayStr();
  if(!s.daily) s.daily = {};
  if(!s.daily[t]) s.daily[t] = {login:true, firstClear:false, learnCount:0, playCount:0, petLines:[], energyEarned:0, dailyDone:false};
  if(s.daily[t].dailyDone) return {ok:false, reason:"done"};   /* 每日 1 次，幂等 */
  s.daily[t].dailyDone = true;
  s.stars      = (s.stars||0) + 1;
  s.starsTotal = (s.starsTotal||0) + 1;
  s.energy     = Math.min(999, (s.energy||0) + 15);
  if(s.pet){
    s.pet.bond = (s.pet.bond||0) + 5;
    s.pet.level = bondToLevel(s.pet.bond);
  }
  return {ok:true, star:1, energy:15, bond:5, petLevel: s.pet ? s.pet.level : null};
}
function finishDaily(){
  LV.stage = 'S4';
  var res = applyDailyResult(state);
  save();
  renderDailyResult(res);
}
function renderDailyResult(res){
  var host = $('levelHost');
  var ok = res && res.ok;
  var rewardHTML =
    '<div class="lv-reward-c">⭐ +1</div>'+
    '<div class="lv-reward-c">🍎 +15</div>'+
    '<div class="lv-reward-c">💗 +5</div>';

  var html =

    '<div class="lv-s4">'+
      '<div class="lv-hero" style="font-size:48px">🌈</div>'+
      '<div class="lv-hd-t" style="font-size:var(--fs-h2)">每日挑战完成！</div>'+
      (ok ? '<div class="lv-reward">'+rewardHTML+'</div>'
          : '<div class="lv-s4tip">今天已经完成啦，明天再来～</div>')+
      '<div class="lv-learned">复习了：'+chips+'</div>'+
      '<div class="lv-s4tip">本次答对 '+LV.gameCorrect+' / 3</div>'+

    '</div>';
  host.innerHTML = lvWrap(html);
  SFX.clear();
  [].forEach.call(host.querySelectorAll('.lv-chip'), function(b){
    b.addEventListener('click', function(){ speak(b.getAttribute('data-c')); });
  });
  host.querySelector('#lvBack').addEventListener('click', function(){ closeLevel(); });

/* ============ S1 学字 ============ */
function renderS1(){
  LV.stage = 'S1';
  var ch = LV.chars[LV.learned];

  /* 词语改成可点读按钮，且进入页面时自动连读 */

  var allWords = (ch.w||[]).join('、');
  var html =
    '<header class="lv-hd">'+
      '<button class="lv-x" data-act="exit" aria-label="返回地图">✕</button>'+
      '<div class="lv-hd-t">学字 · 第 '+(LV.learned+1)+' / 5 个</div>'+

    '</header>'+
    '<div class="lv-s1card">'+
      '<div class="lv-pic" data-act="speak">'+picSVG(ch.c)+'</div>'+
      '<div class="lv-hero" data-act="speak">'+ch.c+'</div>'+
      '<div class="lv-py">'+ch.py+'</div>'+
      '<button class="lv-listen" data-act="speak">🔊 听一听</button>'+
      '<div class="lv-words">'+words+'</div>'+
      '<button class="lv-btn" id="lvLearn">我学会了 ✅</button>'+
    '</div>';
  host.innerHTML = lvWrap(html);
  bindExit(host);
  /* 点大图/听一听：读字 + 连读词语 */
  bindSpeak(host, ch.c + (allWords?'，'+allWords:''));
  /* 点单个词语：只读该词 */
  [].forEach.call(host.querySelectorAll('[data-act="speak-word"]'), function(el){
    el.addEventListener('click', function(e){ if(e&&e.stopPropagation) e.stopPropagation(); var w=this.getAttribute('data-w'); if(w) speak(w); });
  });
  host.querySelector('#lvLearn').addEventListener('click', function(){
    SFX.right(); LV.learned++; gainEnergy(1, this);
    if(LV.learned >= 5) startS2(); else renderS1();
  });
  speak(ch.c);
  if(allWords) setTimeout(function(){ speak(allWords); }, 900);
}

/* ============ S2 小游戏 ×2 ============ */
function qG1(t){
  var opts = makeChoices(t, LV.pool, LV.distract, 4);
  return {
    stimHTML: '<button class="lv-big-play" data-act="speak">🔊</button><div class="lv-listen-lab">点上面的喇叭，听一听是哪个字？</div>',
    stimSpeak: t.c,
    choices: opts.map(function(o){ return {html: lvCharHTML(o.ch), correct: o.correct}; }),
    hint: function(){ speak(t.c); }
  };
}
function gameName(type){
  return ({g1:'听音找字', g2:'字图配对', g3:'拍字地鼠', g4:'认字小路', g5:'连线成词'})[type] || '小游戏';
}
function startS2(){
  LV.stage = 'S2';
  LV.gameNo = 0; LV.qInGame = 0;
  /* P3：按 GDD §7.7 轮换表选本关两个小游戏（G1–G5 轮换），默认 G1/G2 兜底。
     用本关真实下标 LV.idx（而非全局 currentLevel），避免回放已通关关卡时选错轮换 */
  var rot = ttsSafeGames(GAME_ROTATION[LV.idx] || ['G1','G2']);   /* GDD §9.5 第 6 条：TTS 不可用时 G1→G2 */
  LV.games = rot.map(function(t){ return {type: t.toLowerCase(), targets: shuffle(LV.chars).slice(0,4)}; });
  renderGameIntro(0);
}
function renderGameIntro(no){
  var host = $('levelHost');
  var name = gameName(LV.games[no].type);
  var html =
    '<header class="lv-hd">'+
      '<button class="lv-x" data-act="exit" aria-label="返回地图">✕</button>'+
      '<div class="lv-hd-t">'+(LV.daily?('每日挑战 · 第 '+(no+1)+' / 2 关游戏'):('小游戏 '+(no+1)+' / 2'))+'</div>'+
      '<div style="width:64px"></div>'+
    '</header>'+
    '<div class="lv-s4">'+
      '<div class="lv-hero" style="font-size:48px">🎮</div>'+
      '<div class="lv-hd-t" style="font-size:var(--fs-h2)">'+(LV.daily?'每日字灵挑战':('第 '+(no+1)+' 个小游戏'))+'</div>'+
      '<div class="lv-s4tip">'+name+'！准备好了吗？</div>'+
      '<button class="lv-btn" id="lvGo">开始 ➜</button>'+
    '</div>';
  host.innerHTML = lvWrap(html);
  bindExit(host);
  host.querySelector('#lvGo').addEventListener('click', function(){ renderGameQuestion(); });
}
function renderGameQuestion(){
  var g = LV.games[LV.gameNo];
  /* P3/P6：G2–G5 是自管内部循环的小游戏（G2 字图配对记忆翻牌 / G3 拍字地鼠 / G4 认字小路 / G5 连线成词），
     跑完回调 nextGameOrS3；G1 听音找字仍是 quiz 式（qG1 + lvAsk），逐题驱动 */
  if(g.type==='g2' || g.type==='g3' || g.type==='g4' || g.type==='g5'){
    runMinigame(g, nextGameOrS3);
    return;
  }
  var t = g.targets[LV.qInGame];
  var q = qG1(t);   /* 到此分支只剩 G1（G2–G5 已在上方 runMinigame 路由） */
  q.title = (LV.daily ? '每日挑战 · ' : '') + gameName(g.type) + ' · 第 '+(LV.qInGame+1)+' / '+g.targets.length;
  lvAsk(q, 'auto', function(correct){
    if(correct){ LV.gameCorrect++; LV.combo++; gainEnergy(1, null); }
    else { LV.combo = 0; }
    LV.maxCombo = Math.max(LV.maxCombo, LV.combo);
    LV.qInGame++;
    if(LV.qInGame < g.targets.length) renderGameQuestion();
    else nextGameOrS3();
  });
}
function nextGameOrS3(){
  if(LV.gameNo === 0){ LV.gameNo = 1; LV.qInGame = 0; renderGameIntro(1); }
  else if(LV.daily) finishDaily();
  else startS3();
}

/* ============ S3 小考 ============ */
/* S3 小考：全程字图辨识，不含拼音题（5 岁未学拼音，不考核拼音认读）。
   每题显示插图 + 听音，让孩子从 4 个汉字里选出正确字，无需读拼音。 */
function qQuiz(t){
  var opts = makeChoices(t, LV.pool, LV.distract, 4);
  return {
    stimHTML: '<div class="lv-pic">'+picSVG(t.c)+'</div><button class="lv-small-play" data-act="speak">🔊</button><div class="lv-listen-lab">这个图说的是哪个字？</div>',
    stimSpeak: t.c,
    choices: opts.map(function(o){ return {html: lvCharHTML(o.ch), correct: o.correct}; }),
    hint: function(){ speak(t.c); }
  };
}
function startS3(){
  LV.stage = 'S3';
  LV.quizIdx = 0;
  LV.quizPlan = LV.chars.map(function(c){ return {target:c, type:'pic'}; });
  renderQuizQuestion();
}
function renderQuizQuestion(){
  var plan = LV.quizPlan[LV.quizIdx];
  var q = qQuiz(plan.target);
  q.title = '小考 · 第 '+(LV.quizIdx+1)+' / 5 题';
  lvAsk(q, 'retry', function(correct, firstAttempt){
    if(correct){
      LV.combo++;
      if(firstAttempt) LV.quizFirstCorrect++;
    } else {
      LV.combo = 0;
    }
    LV.maxCombo = Math.max(LV.maxCombo, LV.combo);
    LV.quizIdx++;
    if(LV.quizIdx < LV.quizPlan.length) renderQuizQuestion();
    else finishLevel();
  });
}

/* ============ S4 演出结算 ============ */
function finishLevel(){
  LV.stage = 'S4';
  var stars = computeStars(LV.quizFirstCorrect, LV.quizTotal, LV.hintsUsed, LV.maxCombo);
  var res = applyLevelResult(state, LV.idx, stars, LV.hintsUsed, LV.maxCombo, LV.quizFirstCorrect, LV.quizTotal);
  save();
  renderS4(res);
}
function s4tip(stars){
  if(stars === 2) return '小考再答对 1 题，就能点亮第 3 颗星！';
  if(stars === 1) return '不点提示、小考全对，就能点亮更多星星！';
  return '';
}
function renderS4(res){
  var host = $('levelHost');
  var r = res.reward;
  var starHTML = '';
  for(var i=0;i<3;i++){
    starHTML += '<span class="lv-star '+(i<res.newStars?'on pop':'off')+'">'+ICON.star(48, i>=res.newStars)+'</span>';
  }
  var rewardHTML =
    '<div class="lv-reward-c">⭐ +'+r.star+'</div>'+
    '<div class="lv-reward-c">🍎 +'+r.energy+'</div>'+
    (r.shard ? '<div class="lv-reward-c">🔑 +'+r.shard+'</div>' : '');
  var learnedChips = LV.chars.map(function(c){ return '<button class="lv-chip" data-c="'+c.c+'">'+c.c+'</button>'; }).join('');
  var html =
    '<header class="lv-hd"><div class="lv-hd-t">第 '+(LV.idx+1)+' 关 通关！</div><div style="width:64px"></div></header>'+
    '<div class="lv-s4">'+
      '<div class="lv-stars">'+starHTML+'</div>'+
      (res.newStars<3 ? '<div class="lv-s4tip">'+s4tip(res.newStars)+'</div>' : '')+
      '<div class="lv-reward">'+rewardHTML+'</div>'+
      '<div class="lv-learned">本关学会：'+learnedChips+'</div>'+
      '<button class="lv-btn" id="lvBack">返回地图</button>'+
      '<button class="lv-btn lv-btn-ghost" id="lvReplay">再玩一次</button>'+
    '</div>';
  host.innerHTML = lvWrap(html);
  SFX.clear();
  [].forEach.call(host.querySelectorAll('.lv-chip'), function(b){
    b.addEventListener('click', function(){ speak(b.getAttribute('data-c')); });
  });
  host.querySelector('#lvBack').addEventListener('click', function(){ closeLevel(); });
  host.querySelector('#lvReplay').addEventListener('click', function(){ openLevel(LV.idx); });
}

/* ---- 通用答题渲染 + 防挫败处理 ---- */
function highlightCorrect(q, host){
  var opts = host.querySelectorAll('.lv-opt');
  [].forEach.call(opts, function(b,i){ if(q.choices[i] && q.choices[i].correct) b.classList.add('correct-hint'); });
}
function removeOneWrong(q, host){
  var opts = host.querySelectorAll('.lv-opt');
  for(var i=0;i<opts.length;i++){
    if(!q.choices[i].correct && !opts[i].disabled){ opts[i].classList.add('dim'); opts[i].disabled=true; break; }
  }
}
function revealCorrect(q, host, onResolved, firstAttempt){
  highlightCorrect(q, host);
  var fb = host.querySelector('#lvFb');
  if(fb) fb.innerHTML = '是这个字呀～ <button class="lv-btn lv-btn-sm" id="lvGot">我记住啦</button>';
  var got = host.querySelector('#lvGot');
  if(got) got.addEventListener('click', function(){ onResolved(false, firstAttempt); });
}
function lvAsk(q, mode, onResolved){
  var host = $('levelHost');
  var html =
    '<header class="lv-hd">'+
      '<button class="lv-x" data-act="exit" aria-label="返回地图">✕</button>'+
      '<div class="lv-hd-t">'+q.title+'</div>'+
      '<button class="lv-hint" data-act="hint" aria-label="提示">💡 提示</button>'+
    '</header>'+
    '<div class="lv-stim">'+q.stimHTML+'</div>'+
    '<div class="lv-grid">';
  q.choices.forEach(function(c, ci){ html += '<button class="lv-opt" data-ci="'+ci+'">'+c.html+'</button>'; });
  html += '</div><div class="lv-fb" id="lvFb"></div>';
  host.innerHTML = lvWrap(html);

  var locked = false, firstAttempt = true;
  bindExit(host);
  bindSpeak(host, q.stimSpeak);
  var hintBtn = host.querySelector('[data-act="hint"]');
  if(hintBtn) hintBtn.addEventListener('click', function(){
    LV.hintsUsed++;
    if(q.hint) q.hint();
    var st = host.querySelector('.lv-stim'); if(st){ st.classList.add('lv-pulse'); setTimeout(function(){ st.classList.remove('lv-pulse'); }, 700); }
  });
  if(q.stimSpeak) setTimeout(function(){ speak(q.stimSpeak); }, 140);

  host.querySelector('.lv-grid').addEventListener('click', function(e){
    var btn = (e.target && e.target.closest) ? e.target.closest('.lv-opt') : null;
    if(!btn || btn.disabled || locked) return;
    var ci = parseInt(btn.getAttribute('data-ci'), 10);
    var c = q.choices[ci];
    if(c.correct){
      locked = true;
      btn.classList.add('correct');
      SFX.right();
      noteRight(state, q.stimSpeak);
      var fb = host.querySelector('#lvFb'); if(fb) fb.textContent = pick(PRAISE);
      setTimeout(function(){ onResolved(true, firstAttempt); }, 650);
    } else {
      btn.classList.add('wrong'); btn.disabled = true;
      LV.combo = 0; SFX.wrong();
      noteWrong(state, q.stimSpeak);
      var fb2 = host.querySelector('#lvFb'); if(fb2) fb2.textContent = pick(GENTLE);
      if(mode === 'auto'){
        /* S2 小游戏：零惩罚，高亮正确项后自动进入下一题（GDD §9.1） */
        locked = true; highlightCorrect(q, host);
        setTimeout(function(){ onResolved(false, firstAttempt); }, 950);
      } else if(firstAttempt){
        /* S3 小考第 1 次错：移除一个错误项，允许再选一次 */
        firstAttempt = false; removeOneWrong(q, host);
      } else {
        /* S3 小考第 2 次错：直接演示正确答案 + 「我记住啦」 */
        locked = true; revealCorrect(q, host, onResolved, firstAttempt);
      }
    }
  });
}

/* ===================== 渲染与启动 ===================== */
function render(){
  renderHUD();
  renderMap();
}
/* 手机端：用户首次触摸/点击时尝试进入全屏并锁定竖屏。
   真正的 Fullscreen API 必须由用户手势触发，无法自动触发。 */
function tryFullscreen(){
  if(document.fullscreenElement || document.webkitFullscreenElement) return;
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(fn){
    try{ fn.call(el).catch(function(){}); }catch(e){}
  }
}
function tryLockPortrait(){
  if(window.screen && screen.orientation && screen.orientation.lock){
    try{ screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
  }
}
function bindFirstInteractionFullscreen(){
  function once(){
    tryFullscreen();
    tryLockPortrait();
  }
  document.addEventListener('click', once, {once:true});
}
function boot(){
  load();
  SFX.setEnabled(state.settingsNew.soundOn !== false);
  applyFsScale(state.settingsNew.fsScale);
  var sb = $("soundBtn");
  if(sb){ sb.setAttribute('aria-pressed', state.settingsNew.soundOn !== false ? 'true' : 'false');
          sb.textContent = state.settingsNew.soundOn !== false ? '开' : '关'; }
  assignNodeIds(document);      /* 静态 DOM：data-nid → data-page-node-id */
  render();
  renderStubs();
  bindTabs();
  bindMap();
  bindParent();
  scrollToCurrent();
  bindFirstInteractionFullscreen();
}
if(typeof document !== "undefined" && document.getElementById){
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
