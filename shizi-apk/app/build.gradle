plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.shizi'
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.example.shizi"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildFeatures {
        // AGP 8+ 默认不生成 BuildConfig，在线升级需读取当前 versionCode
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
