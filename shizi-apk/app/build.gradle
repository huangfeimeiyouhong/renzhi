plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.shizi'
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.example.shizi"
        // minSdk 24 = Android 7.0：兼容老设备（之前 26 会导致 Android 7.0 安装被拒）
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
    }

    // 正式签名：debug 包缺少完整签名信息，在部分旧设备（如 Android 7.0）上会「解析错误」
    // -Punsigned 时可临时跳过自动签名（用于「先编译未签名包，再用 apksigner 一次性签名」，
    // 二次签名会让 v1 摘要失效，导致老设备解析失败）
    signingConfigs {
        release {
            if (!project.hasProperty('unsigned')) {
                // 密码放在 local.properties（已被 .gitignore 排除，不会进仓库）
                def lp = new java.util.Properties()
                File f = project.rootProject.file('local.properties')
                if (f.exists()) new FileInputStream(f).withCloseable { lp.load(it) }
                storeFile file("../shizi-release.keystore")
                storePassword lp.getProperty('storePassword', 'shizi2026')
                keyAlias lp.getProperty('keyAlias', 'shizi')
                keyPassword lp.getProperty('keyPassword', 'shizi2026')
            }
        }
    }

    buildTypes {
        release {
            signingConfig project.hasProperty('unsigned') ? null : signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false // 兼容旧 API 的告警不阻断出包
    }

    buildFeatures {
        // AGP 8+ 默认不生成 BuildConfig，在线升级需读取当前 versionCode
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
