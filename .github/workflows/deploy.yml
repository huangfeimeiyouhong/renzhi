name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 优先按 Worker 模式部署（与 wrangler.toml 的 assets.directory=public 一致）。
      # 若 Cloudflare 上的 renzhi 实为旧 Pages 项目，wrangler deploy 会报错，
      # 则回退到 Pages 发布（以 public/ 为输出目录）。
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy || npx wrangler pages deploy public --project-name=renzhi --commit-dirty=true
